merce ce que la relance personnalisée décide et ce qu'elle pourrait rapporter, afin d'obtenir son soutien pour le projet.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT fournir, au plus tard le 8 décembre 2026, un environnement de démonstration qui applique des règles de relance et de remise à un jeu de paniers et affiche, pour chaque panier, le message, le moment, le canal, la remise et la règle appliquée. _Source : B05-D10, H19, H30_\n2. LE SYSTÈME DOIT alimenter l'environnement de démonstration uniquement avec des données synthétiques ou anonymisées. _Source : B05-D11, CT-04, H19_\n3. SI le jeu de démonstration est dérivé de données de production, ALORS LE SYSTÈME DOIT n'en charger que la version anonymisée validée par la DPO. _Source : B05-D11, CT-04, H19_\n4. LE SYSTÈME DOIT afficher dans la démonstration un tableau de CA incrémental simulé, marqué « simulation sur données fictives », calculé avec la méthode de l'exigence 6. _Source : B05-D10, B05-D12, H19_\n5. LE SYSTÈME NE DOIT PAS envoyer de message à une personne réelle depuis l'environnement de démonstration. _Source : B05-D10, H19_\n6. LE SYSTÈME DOIT fonctionner, pour la démonstration, sur un environnement distinct de la production, sans aucune mise en production pendant le gel du 16 novembre au 11 janvier. _Source : H19, CT-07_\n\n### Exigence 8 : modèle d'IA de choix des relances (lot 2)\n\n**User story :** En tant que responsable marketing, je veux qu'un modèle d'IA puisse remplacer les règles pour choisir la relance, afin d'améliorer la conversion une fois les données confirmées et le traitement autorisé.\n\n#### Critères d'acceptation\n\n1. OÙ un modèle de choix est activé, LE SYSTÈME DOIT soumettre ses propositions aux mêmes contrôles que les règles : éligibilité (exigence 1), plafonds de remise (exigence 3), données autorisées (exigence 4) et canaux activés (exigence 5). _Source : B05-D2, H30_\n2. LE SYSTÈME NE DOIT PAS permettre l'activation d'un modèle de choix tant que l'avis de la DPO sur ce traitement n'est pas enregistré. _Source : B05-D2, CT-01, H30_\n3. OÙ un modèle de choix est activé, LE SYSTÈME DOIT enregistrer pour chaque relance la version du modèle et les principaux facteurs de sa décision. _Source : B05-D2, H30_\n4. OÙ un modèle de choix est activé, LE SYSTÈME DOIT mesurer son CA incrémental par rapport aux règles du lot 1, sur un groupe de comparaison tiré au hasard et de taille paramétrable. _Source : B05-D2, B05-D12_\n5. LE SYSTÈME DOIT permettre de désactiver le modèle et de revenir aux règles du lot 1 sans mise en production. _Source : B05-D2, H30_\n\n### Exigence 9 : exigences non fonctionnelles et conformité\n\n**User story :** En tant que DSI, je veux une solution conforme au RGPD, hébergée dans l'Union européenne, dimensionnée pour le pic et réversible, afin de pouvoir la mettre en service sans risque.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME NE DOIT PAS envoyer de relance personnalisée en production tant que l'avis de la DPO sur le traitement n'est pas enregistré dans le paramétrage. _Source : B05-D8, CT-01_\n2. LE SYSTÈME DOIT être hébergé dans l'Union européenne, y compris l'environnement de démonstration et le service d'envoi des e-mails. _Source : CT-08_\n3. LE SYSTÈME DOIT utiliser uniquement des données synthétiques ou anonymisées dans les environnements de développement, de test et de recette. _Source : CT-04_\n4. LE SYSTÈME DOIT journaliser les modifications de règles, de modèles de message, de plafonds et de paramètres, ainsi que les accès au tableau de mesure, avec l'auteur et l'horodatage. _Source : B05-D6, H30, CT-01_\n5. LE SYSTÈME DOIT traiter le volume de pointe de paniers abandonnés fixé lors du cadrage, pic de fin d'année compris, en respectant la tolérance d'envoi du critère 2.6. _Source : B05-D1_\n6. LE SYSTÈME DOIT permettre de suspendre toutes les relances personnalisées et de revenir à la relance actuelle par un paramètre, sans mise en production. _Source : B05-D1, H30_\n\n## Hors périmètre\n\n- Code promo dans les messages de retard de livraison (`B05-D7`) : relève du projet retards (B05-F6), où il est exclu par `CT-03` (conflit `C07`, hypothèse `H06`, question `Q07`). Renvoyé vers P01.\n- Historique d'achats depuis 2014 (`B05-D3`, en partie) : seuls les 3 ans précédant le dernier contact sont exploités (`H18`, `CT-05`). Aucun projet ne reprend l'historique plus ancien.\n- Report de la question des données personnelles (`B05-D9`, en partie) : non retenu. Le consentement newsletter n'est utilisé que si la DPO en confirme la portée (critères 1.3 et 9.1).\n- Démonstration « sur les vrais clients » (`B05-D11`, en partie) : remplacée par des données synthétiques ou anonymisées (`H19`, `CT-04`, question `Q20`).\n- Modèle d'IA dès le lot 1 (`B05-D2`) : reporté au lot 2 (exigence 8, `H30`, question `Q33`).\n- Canaux autres que l'e-mail dès le lot 1 (`B05-D4`, en partie) : reportés au lot 2, après avis de la DPO (critère 5.2, `H17`). Les « messageries mobiles » ne sont pas nommées (B05-F11) et le seront avant leur activation.\n- Purge des historiques de prospection antérieurs à la limite de 3 ans dans les systèmes existants (`B07-D14`) : chantier sans porteur ni échéance (`Q31`). Le projet purge seulement ses propres données (critère 4.5). Aucun projet ne le reprend.\n- Gestion des oppositions à la prospection et des demandes de droits : portée par P05. P04 lit les oppositions enregistrées (critère 1.4).\n\n## Hypothèses\n\n| Id | Hypothèse | Conflit | Réversible |\n|---|---|---|---|\n| H06 | L'alerte de retard ne contient ni code promo ni offre commerciale. Une éventuelle offre relève d'un message marketing distinct, hors P01, soumis aux règles de consentement. | C07 | oui |\n| H17 | La V1 de la relance n'utilise que l'e-mail, pour les clients ayant consenti aux communications commerciales, sous réserve que la DPO confirme la portée du consentement newsletter. SMS, notifications et messageries mobiles sont ajoutés après analyse de la DPO (CT-01, CT-02). | C18 | oui |\n| H18 | La personnalisation n'utilise que les commandes du Lac et, pour les clients connectés, la navigation disponible, limitées aux 3 ans précédant le dernier contact du client. L'historique depuis 2014 n'est pas exploité. | C19 | oui |\n| H19 | La démo du comité commerce du 8 décembre utilise des données anonymisées ou synthétiques, sur un environnement hors production. Une démo n'étant pas une mise en production, le gel ne s'y applique pas. | C20 | oui |\n| H30 | La V1 de la relance choisit le message, le moment et la remise par des règles paramétrables et explicables ; un modèle d'IA (B05-D2) vient en V2, une fois les données confirmées et l'avis de la DPO rendu. | — | oui |\n\n## Questions ouvertes\n\n| Id | Question | Destinataire | Bloquante |\n|---|---|---|---|\n| Q07 | Confirmez-vous l'abandon du code promo dans les messages de retard (CT-03) ? Souhaitez-vous à la place un message commercial distinct, soumis au consentement ? | Capucine Lorrain ; Hélène Marsac | non (hors périmètre de P04) |\n| Q18 | Le consentement newsletter couvre-t-il une relance personnalisée des paniers abandonnés, les remises ciblées et chaque canal (e-mail, notifications, SMS, messageries) ? Quelle analyse faut-il avant le développement ? | Hélène Marsac | non (conditionne la mise en service du lot 1, critères 1.3 et 9.1, et l'activation des canaux, critère 5.2) |\n| Q19 | Quelles données la relance peut-elle utiliser (commandes, navigation des clients connectés) et sur quelle profondeur, compte tenu de la limite de 3 ans ? Que contient réellement le Lac ? | Hélène Marsac ; équipe du Lac (Théo Bazin) | non (conditionne les critères 4.1, 4.2 et 4.6) |\n| Q20 | Une démo sur données anonymisées ou synthétiques convient-elle au comité commerce du 8 décembre ? Qu'attendez-vous précisément de la démo ? | Capucine Lorrain ; Hélène Marsac | non (conditionne le contenu de l'exigence 7) |\n| Q31 | Qui porte la purge des historiques de prospection de plus de 3 ans, et pour quelle échéance ? | Hélène Marsac ; Capucine Lorrain | non (hors périmètre de P04) |\n| Q33 | La relance doit-elle reposer sur un modèle d'IA dès la V1, ou des règles suffisent-elles ? Les plafonds de remise (10 %, 15 % pour Orvanne+) sont-ils validés par la finance ? | Capucine Lorrain ; finance | non (conditionne les valeurs du critère 3.3 et le calendrier de l'exigence 8) |\n| Q34 | L'exigence d'hébergement dans le cloud d'Orvanne (B01) s'applique-t-elle à tous les projets, ou un hébergement dans l'UE chez un éditeur est-il admis (B03, B07-D20) ? | DSI (comité d'architecture) | non (conditionne le choix d'hébergement, critère 9.2) |\n| Q36 | Quand pouvez-vous examiner les traitements des projets P01, P02, P03, P04, P06 et P07 (CT-01) ? Lesquels exigent une analyse d'impact ? | Hélène Marsac | non (conditionne la date de mise en service du lot 1, critère 9.1) |\n\n### Points à remonter à l'analyste (sans identifiant dans `work/analyse.json`)\n\nCes points ne figurent pas dans l'analyse. Ils ne bloquent pas la spec, mais conditionnent des tâches de cadrage (tâche 1 de `tasks.md`).\n\n| Point | Destinataire proposé | Ce qu'il conditionne |\n|---|---|---|\n| Quel système détecte aujourd'hui les paniers abandonnés et envoie la relance à 24 h ? Après quel délai d'inactivité un panier est-il « abandonné » ? | Capucine Lorrain ; DSI | Critère 1.1 (intégration avec Vitrine) |\n| Combien de paniers abandonnés par jour, en temps normal et pendant le pic ? (B05-F5) | Équipe du Lac (Théo Bazin) ; DSI | Critère 9.5 |\n| Comment Vitrine applique-t-elle une remise individuelle (code à usage unique, remise rattachée au compte) ? Quelle durée de validité ? | DSI ; Capucine Lorrain ; finance | Critère 3.2 |\n| Dans quel système l'appartenance à Orvanne+ est-elle enregistrée ? | Capucine Lorrain ; DSI | Critères 3.3 et 3.6 |\n| Comment calculer le CA incrémental (B05-F10) : groupe témoin, taille, fenêtre d'attribution ? La méthode proposée dans `design.md` convient-elle ? | Capucine Lorrain ; finance | Critères 6.1, 6.2 et 6.4 |\n| Une seule relance par panier, ou une séquence de relances ? | Capucine Lorrain | Critère 1.7 |\n| L'outil d'e-mailing peut-il envoyer des relances personnalisées une à une, est-il hébergé dans l'UE, et quelles mentions (lien de désinscription) la DPO exige-t-elle ? | DSI ; Hélène Marsac | Critères 5.1 et 9.2 |\n", "design.md": "# Conception : relance personnalisée des paniers abandonnés\n\n## Vue d'ensemble\n\nLa solution remplace la relance unique (même e-mail à 24 h) par un **moteur de relance** qui, pour chaque panier abandonné éligible, demande à un **décideur** le message, le moment, le canal et la remise, puis programme l'envoi. En lot 1, le décideur applique des **règles paramétrées par le marketing** ; en lot 2, un **modèle d'IA** peut le remplacer derrière la même interface (`H30`). Un **groupe témoin** qui reçoit la relance actuelle permet de mesurer le CA incrémental (exigence 6). Une **démonstration** isolée, sur données fictives, est livrée pour le comité commerce du 8 décembre 2026 (exigence 7, `H19`).\n\nChoix structurants :\n\n| Choix | Raison | Alternative écartée |\n|---|---|---|\n| Règles paramétrables et explicables en lot 1, modèle d'IA en lot 2 | « L'IA » n'est pas définie (B05-F1), les données disponibles sont incertaines (B05-F2), la démo est à un mois (`H30`) | Modèle d'IA dès le lot 1 : pas de données d'entraînement confirmées, pas d'avis de la DPO, décisions difficiles à expliquer |\n| Une seule interface « décideur » pour les règles et le modèle | Le passage au lot 2 ne touche ni l'éligibilité, ni les plafonds, ni l'envoi ; retour aux règles par paramètre (8.5) | Deux chaînes séparées : contrôles dupliqués, risque que le modèle contourne les plafonds |\n| Contrôles de conformité hors du décideur (éligibilité, plafonds, données autorisées, canaux) | Ils s'appliquent quel que soit le décideur (8.1) et sont testables isolément | Contrôles codés dans chaque règle |\n| E-mail seul en lot 1 | Seul canal déjà utilisé pour la relance ; les autres canaux attendent l'avis de la DPO (`H17`, `CT-02`) | Quatre canaux d'emblée (B05-D4) |\n| Groupe témoin recevant la relance actuelle | Mesure le gain par rapport à l'existant sans priver de relance une partie des clients | Témoin sans aucune relance : mesure l'effet total de la relance mais dégrade la conversion actuelle du groupe ; reste possible par paramètre si le marketing le demande |\n| Vérifications de consentement, d'opposition et de commande au moment de l'envoi | Le délai entre décision et envoi peut atteindre plusieurs heures (1.5) | Vérification à la seule programmation |\n| Lecture des coordonnées et des consentements à la source, sans copie | Minimisation (`CT-01`) ; une seule vérité pour les oppositions (P05) | Copie des e-mails et consentements dans la base de relance |\n| Démonstration sur un environnement isolé, sans connecteur d'envoi | Aucune donnée réelle (`CT-04`), aucun message possible (7.5), pas de mise en production pendant le gel (`CT-07`) | Démo sur la production ou sur une copie de production |\n\nLes technologies citées ci-dessous sont des **propositions** : les sources n'en imposent aucune.\n\n## Architecture\n\n```mermaid\nflowchart LR\n  subgraph Existant\n    V[Vitrine : paniers, comptes, remises]\n    LAC[(le Lac : commandes, navigation des clients connectés)]\n    CONS[Consentements et oppositions : Vitrine / outil d'e-mailing, registre P05]\n    EM[Outil d'e-mailing ou service d'envoi e-mail]\n  end\n  V -- panier abandonné --> COL[Collecteur de paniers]\n  COL --> BASE[(Base de relance)]\n  LAC -- extraction filtrée 3 ans --> PROF[Vue de personnalisation]\n  BASE --> ELI[Contrôle d'éligibilité]\n  CONS --> ELI\n  ELI --> DEC{Décideur}\n  DEC -- lot 1 --> REG[Moteur de règles]\n  DEC -. lot 2 .-> MOD[Modèle d'IA]\n  PROF --> REG\n  PROF -.-> MOD\n  DEC --> CTL[Contrôles : plafonds, données, canaux]\n  CTL --> PLAN[Planificateur d'envois]\n  PLAN -- re-vérification --> ELI\n  PLAN -- remise individuelle --> V\n  PLAN --> EM\n  PLAN --> BASE\n  BASE --> MES[Mesure et tableau du CA incrémental]\n  LAC -- commandes --> MES\n  BO[Back-office marketing : règles, modèles, plafonds, paramètres] --> REG\n  BO --> CTL\n  BO --> PLAN\n  PURGE[Purge 3 ans] --> BASE\n  subgraph Démo [Environnement de démonstration isolé, lot 0]\n    SYN[(Jeu synthétique ou anonymisé)] --> REGD[Moteur de règles] --> RES[Écran de restitution et CA simulé]\n  end\n```\n\n## Composants et interfaces\n\n| Composant | Responsabilité | Interfaces (entrée / sortie) | Exigences | Lot |\n|---|---|---|---|---|\n| Collecteur de paniers | Reçoit les paniers abandonnés, les enregistre comme candidats, écarte les paniers sans client identifié | Entrée : événement ou extraction de Vitrine (mécanisme à confirmer, « Points à remonter »). Sortie : base de relance | 1.1, 1.2 | 1 |\n| Base de relance | Stocke paniers candidats, décisions, relances, remises, affectation au groupe témoin | Base relationnelle (proposition : PostgreSQL), hébergée dans l'UE | 2.5, 4.5, 6.1 | 1 |\n| Vue de personnalisation | Expose par client des attributs calculés à partir des commandes du Lac et de la navigation des sessions connectées, limités aux 3 ans précédant le dernier contact | Entrée : le Lac (extraction quotidienne proposée). Sortie : attributs lus par le décideur ; liste fermée des attributs autorisés | 2.4, 4.1, 4.2, 4.3, 4.6 | 1 |\n| Contrôle d'éligibilité | Vérifie client identifié, consentement à la prospection par canal, absence d'opposition, panier non commandé ; appelé à la programmation et à l'envoi | Entrée : consentements et oppositions (Vitrine ou outil d'e-mailing, registre P05), commandes de Vitrine. Sortie : éligible / motif de refus | 1.2 à 1.6, 4.4 | 1 |\n| Décideur : moteur de règles | Évalue les règles actives par ordre de priorité ; applique la relance par défaut si aucune ne s'applique | Interface `decider(panier, attributs) → {modèle, délai, canal, remise, justification}` | 2.1, 2.2, 3.1, 3.2 | 0 (prototype), 1 |\n| Décideur : modèle d'IA | Propose les mêmes choix à partir d'un modèle entraîné ; renvoie version et facteurs | Même interface que le moteur de règles | 8.1, 8.3 | 2 |\n| Contrôles | Applique plafonds de remise par catégorie, liste des données autorisées, canaux activés ; rejette ou corrige la proposition du décideur | Lit les paramètres du back-office | 3.3, 3.6, 5.2, 5.3, 8.1 | 1 |\n| Planificateur d'envois | Programme l'envoi à l'heure décidée, re-vérifie l'éligibilité, demande la remise à Vitrine, envoie, réessaie, journalise | Entrée : décisions. Sortie : API de Vitrine (remise individuelle, à qualifier), API de l'outil d'e-mailing | 1.5 à 1.7, 2.6, 3.2, 5.1, 5.4, 9.6 | 1 |\n| Back-office marketing | Règles, modèles de message, plafonds, paramètres, test sur échantillon, versions, avis de la DPO enregistrés | Application web interne, SSO, rôles `crm`, `finance`, `dpo`, `admin` (proposition) | 2.3, 2.7, 3.4, 3.5, 5.2, 8.2, 9.1, 9.4, 9.6 | 1 |\n| Mesure et tableau | Affectation au groupe témoin, attribution des commandes, indicateurs agrégés, CA incrémental, export | Entrée : base de relance, commandes du Lac. Sortie : tableau web et export CSV agrégé | 3.7, 6.1 à 6.6, 8.4 | 1 |\n| Purge | Supprime ou anonymise les données de relance 3 ans après le dernier contact | Tâche planifiée quotidienne | 4.5 | 1 |\n| Environnement de démonstration | Copie isolée du moteur de règles, jeu fictif, écran de restitution, CA simulé, aucun connecteur d'envoi | Hébergé dans l'UE, sans accès réseau aux systèmes de production | 7.1 à 7.6 | 0 |\n\n### Méthode de calcul du CA incrémental (proposition, à valider par le marketing et la finance)\n\nLa méthode répond à B05-D12 sans que la source la définisse (B05-F10).\n\n- Chaque panier éligible est affecté au hasard, à sa création, au **groupe nouveau dispositif** ou au **groupe témoin** (part paramétrable, proposition : 10 %).\n- Une commande est attribuée à la relance si elle contient au moins un article du panier et si elle est passée dans la fenêtre d'attribution après l'envoi (proposition : 7 jours, paramètre).\n- CA par panier d'un groupe = CA attribué du groupe ÷ nombre de paniers éligibles du groupe (relancés ou non, pour ne pas biaiser la comparaison).\n- **CA incrémental** = (CA par panier du nouveau dispositif − CA par panier du groupe témoin) × nombre de paniers du nouveau dispositif − montant des remises accordées dans le nouveau dispositif qui ne l'auraient pas été dans le témoin.\n- Le tableau affiche aussi l'intervalle de confiance à 95 % de l'écart de conversion, pour signaler les écarts non significatifs (proposition).\n- Pour chaque règle de remise, la même comparaison est faite avec son échantillon relancé sans remise (3.7) : un écart nul ou négatif signale une remise donnée à des clients qui auraient acheté sans elle (B05-D5).\n\n## Flux principaux\n\n### Du panier abandonné à l'envoi\n\n```mermaid\nsequenceDiagram\n  participant V as Vitrine\n  participant C as Collecteur\n  participant E as Contrôle d'éligibilité\n  participant D as Décideur\n  participant K as Contrôles\n  participant P as Planificateur\n  participant M as Outil d'e-mailing\n  V->>C: panier abandonné (client, articles, montant, horodatage)\n  C->>C: client identifié avec e-mail ? sinon écarter (1.2)\n  C->>E: candidat\n  E->>E: consentement prospection e-mail, opposition (1.3, 1.4)\n  alt non éligible\n    E-->>C: écarté, motif journalisé\n  else éligible\n    C->>C: tirage groupe témoin (6.1)\n    alt groupe témoin\n      C->>P: relance actuelle, 24 h\n    else nouveau dispositif\n      C->>D: decider(panier, attributs autorisés)\n      D->>K: proposition\n      K->>K: plafond de la catégorie, données autorisées, canal activé\n      K->>P: décision validée et justification (2.5)\n    end\n    P->>P: attendre l'heure prévue (2.6)\n    P->>E: re-vérifier consentement, opposition, commande (1.5)\n    alt panier commandé ou client opposé\n      P->>P: annuler (1.6)\n    else toujours éligible\n      opt remise décidée\n        P->>V: créer la remise individuelle (3.2)\n      end\n      P->>M: envoyer l'e-mail\n      P->>P: journaliser l'envoi ou l'échec (5.4)\n    end\n  end\n```\n\n### Mesure\n\n```mermaid\nsequenceDiagram\n  participant L as le Lac\n  participant B as Base de relance\n  participant T as Mesure et tableau\n  L->>T: commandes du jour (extraction quotidienne)\n  B->>T: paniers, groupes, relances, remises\n  T->>T: attribuer les commandes (fenêtre paramétrée)\n  T->>T: calculer indicateurs et CA incrémental par règle et par période\n  T-->>T: publier des agrégats uniquement (6.6)\n```\n\n## Modèle de données\n\n| Entité | Attributs principaux | Donnée personnelle | Durée de conservation |\n|---|---|---|---|\n| PanierCandidat | id panier, id client (pseudonyme interne), articles, montant, horodatage d'abandon, groupe (nouveau / témoin), statut d'éligibilité et motif | oui (rattaché à un client) | 3 ans après le dernier contact du client, puis suppression ou anonymisation (4.5, `CT-05`) |\n| Décision | id panier, décideur (règles / modèle), règle ou version du modèle, modèle de message, heure prévue, canal, taux de remise, justification | oui (rattachée à un client) | idem PanierCandidat |\n| Relance | id panier, canal, version du modèle de message, horodatage d'envoi, statut (programmée, envoyée, annulée, non envoyée), motif, nombre de tentatives | oui | idem PanierCandidat |\n| Remise | id panier, id client, taux, référence de la remise dans Vitrine, date de validité, utilisée oui / non | oui | idem PanierCandidat ; les pièces comptables liées à une commande suivent les règles de Vitrine, hors projet |\n| AttributsPersonnalisation | id client, attributs calculés (liste fermée), date de calcul, fenêtre de données utilisée | oui (profil) | recalculés chaque jour, version précédente écrasée |\n| RègleRelance, RègleRemise | critères, priorité, modèle, délai, canal, taux, version, auteur, date d'activation, statut | non | conservées (traçabilité, 2.7) |\n| ModèleMessage | canal, texte, variables, version, auteur, date d'activation | non | conservé |\n| Paramètre | clé (plafonds, part du témoin, fenêtre d'attribution, tolérance d'envoi, politique de nouvelles tentatives, définition du dernier contact, avis de la DPO enregistrés, interrupteur général), valeur, auteur, date | non | conservé |\n| IndicateurAgrégé | période, règle, groupe, compteurs, CA, remises, CA incrémental | non (agrégats) | conservé |\n| Journal | utilisateur, action, objet, horodatage | oui (identifiant de l'employé) | 1 an proposé, à confirmer avec la DPO |\n\nLes adresses e-mail, numéros de mobile et consentements ne sont **pas** copiés dans la base de relance : ils sont lus à la source au moment de l'envoi. La base ne contient ni nom, ni adresse postale.\n\n## Gestion des erreurs\n\n| Situation | Comportement | Exigence |\n|---|---|---|\n| Panier sans client identifié ou sans e-mail | Écarté à la collecte, compté dans les indicateurs (« non relançable ») | 1.2 |\n| Service des consentements ou des oppositions indisponible | Aucun envoi sans vérification : envoi reporté et nouvel essai (proposition : 3 essais sur 1 h), puis relance « non envoyée : vérification impossible » | 1.3, 1.4, 1.5 |\n| Panier commandé entre la décision et l'envoi | Relance annulée | 1.6 |\n| Deuxième événement d'abandon pour le même panier | Ignoré : une relance au plus par panier | 1.7 |\n| Aucune règle ne s'applique | Relance par défaut (e-mail, modèle par défaut, 24 h) | 2.2 |\n| Règle qui référence un attribut non autorisé | Enregistrement refusé avec message explicite | 2.4 |\n| Proposition de remise au-delà du plafond (règle ou modèle) | Activation refusée pour une règle ; proposition du modèle ramenée sous le plafond et écart journalisé | 3.3, 8.1 |\n| Plafond abaissé alors que des règles le dépassent | Règles suspendues, auteur averti | 3.4 |\n| Appartenance Orvanne+ invérifiable | Plafond général appliqué | 3.6 |\n| Création de la remise refusée par Vitrine | Relance envoyée sans remise si la règle le permet (paramètre), sinon reportée puis « non envoyée : remise » | 3.2, 5.4 |\n| Extraction du Lac absente ou en retard | Attributs de la veille utilisés s'ils ont moins de 48 h (proposition), sinon relance par défaut | 4.1, 2.2 |\n| Donnée plus ancienne que la fenêtre de 3 ans | Filtrée à l'extraction ; un contrôle quotidien vérifie qu'aucun attribut n'en dépend | 4.2 |\n| Échec d'envoi par l'outil d'e-mailing | Nouvelles tentatives selon la politique paramétrée (proposition : 3 essais, délai croissant), puis « non envoyée » avec motif | 5.4 |\n| Retard d'envoi supérieur à la tolérance (file saturée au pic) | Alerte à la supervision ; envoi maintenu tant que le panier est éligible | 2.6, 9.5 |\n| Dérive constatée (plaintes, désinscriptions, erreur de règle) | Interrupteur général : retour à la relance actuelle sans mise en production | 9.6 |\n| Tentative d'envoi depuis l'environnement de démonstration | Impossible : aucun connecteur d'envoi installé, pas de route réseau vers l'outil d'e-mailing | 7.5 |\n\n## Sécurité et RGPD\n\n- **Avant le développement :** l'analyse du traitement est soumise à la DPO (`CT-01`, `Q18`, `Q36`). Points à faire valider :\n  - la base légale de la relance et la portée réelle du consentement newsletter (relance personnalisée, remise ciblée, chaque canal) ;\n  - la nature de profilage de la personnalisation et la nécessité d'une analyse d'impact ;\n  - la définition du « dernier contact » (4.6) et la liste des attributs autorisés (4.1) ;\n  - les mentions obligatoires de l'e-mail de relance (proposition : lien de désinscription en un clic, identification d'Orvanne comme émettrice), à confirmer par la DPO.\n- **Verrous techniques :** l'envoi en production (9.1), chaque canal autre que l'e-mail (5.2), l'usage du mobile (4.4, `CT-02`) et le modèle d'IA (8.2) restent désactivés tant que l'avis correspondant n'est pas enregistré dans le back-office par le rôle `dpo`.\n- **Nature commerciale :** la relance est de la prospection, pas un message de service ; `CT-03` ne s'y applique pas, mais le consentement est vérifié à chaque envoi.\n- **Minimisation :** liste fermée d'attributs, fenêtre de 3 ans (`CT-05`), navigation des seules sessions connectées, pas de copie des coordonnées.\n- **Conservation :** purge quotidienne des données de relance 3 ans après le dernier contact (4.5). Les données de relance sont un nouveau stockage de données clients, à déclarer au registre des droits (P05) pour les demandes d'accès, d'effacement et d'opposition.\n- **Accès :** SSO interne ; rôles `crm` (règles, modèles), `finance` (plafonds, tableau), `dpo` (avis), `admin`. Le tableau ne montre que des agrégats (6.6). Les actions sensibles sont journalisées (9.4).\n- **Hébergement :** dans l'UE (`CT-08`), y compris l'environnement de démonstration et le service d'envoi. L'obligation d'utiliser le cloud d'Orvanne pour ce projet est à confirmer (`Q34`).\n- **Données de test et de démonstration :** synthétiques, ou anonymisées et validées par la DPO (`CT-04`, `H19`).\n\n## Volumétrie et performance\n\n| Grandeur | Valeur | Base |\n|---|---|---|\n| Délai de la relance actuelle | 24 h après l'abandon | B05-N1 |\n| Conversion de la relance actuelle | « 2 et quelques % » | B05-N2 |\n| Paniers abandonnés par jour | **inconnu** (« aucune idée, beaucoup ») | B05-F5 ; mesure à faire au cadrage (tâche 1.2) |\n| Effet du pic | ×2 sur les volumes, par analogie avec les colis (35 000 / jour, 70 000 au pic) | B01-N1, B01-N2 ; **estimation** à confirmer pour les paniers |\n| Ordre de grandeur indicatif | Si les paniers abandonnés étaient 2 à 3 fois plus nombreux que les colis expédiés, soit environ 200 000 par jour au pic, le débit moyen resterait inférieur à 3 paniers / s | **estimation**, à remplacer par la mesure |\n| Historique exploité | 3 ans au plus avant le dernier contact ; navigation des clients connectés, sans doute pas avant 2023 | `CT-05`, B05-N4 |\n\nCes volumes restent modestes pour une base relationnelle et un planificateur à file de messages. Le point sensible est la concentration des envois sur certaines heures si les règles choisissent les mêmes moments : le planificateur lisse les envois dans la tolérance du critère 2.6 et respecte le débit admis par l'outil d'e-mailing (à qualifier). Le test de charge vise 2 fois le volume de pointe mesuré au cadrage (9.5).\n\n## Stratégie de test\n\n| Niveau | Contenu | Exigences |\n|---|---|---|\n| Unitaire | Éligibilité (client anonyme, sans consentement, opposé, panier commandé) ; évaluation des règles par priorité et relance par défaut ; plafonds (10 %, 15 % Orvanne+, Orvanne+ invérifiable, plafond abaissé) ; filtre de fenêtre de 3 ans et de navigation connectée ; tirage du témoin ; attribution des commandes | 1, 2.1, 2.2, 2.4, 3, 4, 6.1, 6.2 |\n| Calcul | CA incrémental sur un jeu synthétique aux résultats connus d'avance ; vérification des agrégats et de l'absence de donnée nominative dans les exports | 6.3, 6.4, 6.6, 7.4 |\n| Intégration | Vitrine (paniers, remise individuelle), le Lac (extraction), consentements et oppositions, outil d'e-mailing, avec des bouchons puis en recette | 1.1, 1.5, 3.2, 4.1, 5.1, 5.4 |\n| Verrous de conformité | Envoi en production, canaux, mobile et modèle refusés sans avis de la DPO enregistré ; interrupteur général | 4.4, 5.2, 8.2, 9.1, 9.6 |\n| Performance | 2 fois le volume de pointe mesuré, pendant 1 h ; écart d'envoi inférieur à la tolérance | 2.6, 9.5 |\n| Démonstration | Vérification qu'aucun connecteur d'envoi n'existe et que le jeu ne contient aucune donnée réelle ; répétition avec le marketing | 7 |\n| Recette métier | Marketing : création, test sur échantillon et activation de règles et de modèles ; finance : plafonds et tableau | 2.3, 3.3, 3.5, 6.3, 6.5 |\n| Lot 2 | Modèle soumis aux contrôles, comparaison aux règles, retour aux règles par paramètre | 8 |\n| Données | Jeux synthétiques uniquement dans tous les environnements hors production (`CT-04`) | 9.3 |\n", "tasks.md": "# Plan d'implémentation : relance personnalisée des paniers abandonnés\n\nLe plan suit les trois lots de `requirements.md` :\n- **Lot 0** (tâche 2) : démonstration pour le comité commerce du 8 décembre 2026, hors production, sur données fictives. Elle ne constitue pas une mise en production (`H19`).\n- **Lot 1** (tâches 3 à 8) : relance par règles, e-mail seul. Mise en production au plus tôt le 12 janvier 2027, après le gel (`CT-07`) et après l'avis de la DPO (`CT-01`).\n- **Lot 2** (tâche 9) : canaux supplémentaires et modèle d'IA, après les avis de la DPO correspondants.\n\n- [ ] 1. Prérequis et cadrage (aucune dépendance ; 1.4 à lancer en premier pour la démo)\n  - [ ] 1.1 Soumettre l'analyse du traitement à la DPO : base légale et portée du consentement newsletter, profilage et analyse d'impact, remise ciblée, définition du dernier contact, canaux, usage du mobile, mentions de l'e-mail (Q18, Q19, Q36)\n    - Livrable : avis écrit de la DPO, versé au dossier du projet\n    - _Exigences : 1.3, 1.4, 4.4, 4.6, 5.2, 9.1_\n  - [ ] 1.2 Cadrer les données avec l'équipe du Lac : contenu réel (commandes, navigation des clients connectés et date de début), liste des attributs utilisables, volume de paniers abandonnés par jour en temps normal et au pic (Q19)\n    - Livrable : note de données et volume de pointe retenu pour le dimensionnement\n    - _Exigences : 4.1, 4.3, 9.5_\n  - [ ] 1.3 Qualifier les intégrations avec la DSI : détection actuelle des paniers abandonnés et délai d'abandon, mécanisme de remise individuelle de Vitrine et sa durée de validité, système portant l'appartenance à Orvanne+, outil d'e-mailing (envoi unitaire, débit, hébergement UE), hébergement du projet (Q34)\n    - Livrable : contrats d'interface Vitrine, consentements, outil d'e-mailing\n    - _Exigences : 1.1, 3.2, 3.6, 5.1, 9.2_\n  - [ ] 1.4 Constituer un jeu de données synthétique : clients (dont membres Orvanne+), paniers, commandes sur 3 ans et au-delà, navigation connectée et non connectée, consentements et oppositions, cas aux bornes (CT-04)\n    - _Exigences : 7.2, 9.3_\n  - [ ] 1.5 Atelier marketing et finance : méthode du CA incrémental, part du groupe témoin, fenêtre d'attribution, plafonds de remise (Q33), relance unique ou séquence\n    - Livrable : méthode validée et valeurs initiales des paramètres\n    - _Exigences : 1.7, 3.3, 6.1, 6.2, 6.4_\n\n- [ ] 2. Démonstration du comité commerce, lot 0 (dépend de 1.4 ; livraison au plus tard le 8 décembre 2026)\n  - [ ] 2.1 Monter un environnement de démonstration isolé, hébergé dans l'UE, sans connecteur d'envoi ni route réseau vers la production ou l'outil d'e-mailing\n    - _Exigences : 7.5, 7.6, 9.2_\n  - [ ] 2.2 Charger le jeu synthétique (ou une version anonymisée validée par la DPO) et vérifier l'absence de toute donnée réelle\n    - _Exigences : 7.2, 7.3_\n  - [ ] 2.3 Développer un prototype du moteur de règles (règles de relance et de remise, plafonds) et l'écran de restitution par panier : message, moment, canal, remise, règle appliquée\n    - Le moteur sert de base à la tâche 4.2\n    - _Exigences : 7.1_\n  - [ ] 2.4 Produire le tableau de CA incrémental simulé, marqué « simulation sur données fictives », avec la méthode provisoire de `design.md`\n    - _Exigences : 7.4_\n  - [ ] 2.5 Répéter la démonstration avec Capucine Lorrain et ajuster son contenu à la réponse à Q20\n    - _Exigences : 7.1, 7.4_\n\n- [ ] 3. Socle de données du lot 1 (dépend de 1.1, 1.2 et 1.3)\n  - [ ] 3.1 Créer le schéma de la base de relance (PanierCandidat, Décision, Relance, Remise, règles, modèles, Paramètre, Journal) avec versions et journal\n    - _Exigences : 2.5, 2.7, 9.4_\n  - [ ] 3.2 Développer le collecteur de paniers abandonnés depuis Vitrine, avec rejet des paniers sans client identifié ou sans e-mail\n    - _Exigences : 1.1, 1.2_\n  - [ ] 3.3 Construire la vue de personnalisation : extraction quotidienne du Lac, liste fermée d'attributs, fenêtre de 3 ans avant le dernier contact, navigation des seules sessions connectées\n    - _Exigences : 4.1, 4.2, 4.3, 4.6_\n  - [ ] 3.4 Implémenter la purge quotidienne des données de relance 3 ans après le dernier contact\n    - _Exigences : 4.5_\n  - [ ] 3.5 Écrire les tests du socle : paniers anonymes, données hors fenêtre, navigation non connectée, purge\n    - _Exigences : 1.1, 1.2, 4.2, 4.3, 4.5_\n\n- [ ] 4. Éligibilité, moteur de règles et back-office (dépend de 3.1 et 2.3)\n  - [ ] 4.1 Développer le contrôle d'éligibilité : consentement à la prospection par canal, opposition, panier commandé, verrou sur le mobile\n    - _Exigences : 1.3, 1.4, 4.4_\n  - [ ] 4.2 Industrialiser le moteur de règles derrière l'interface « décideur » : priorité des règles, relance par défaut (e-mail, 24 h), refus des critères non autorisés\n    - _Exigences : 2.1, 2.2, 2.4_\n  - [ ] 4.3 Développer le back-office des règles et des modèles de message : création, test sur échantillon, activation, désactivation, versions, journal\n    - _Exigences : 2.3, 2.7, 9.4_\n  - [ ] 4.4 Enregistrer pour chaque relance programmée la règle et sa version, le modèle, l'heure prévue, le canal et la remise\n    - _Exigences : 2.5_\n  - [ ] 4.5 Écrire les tests unitaires de l'éligibilité et du moteur de règles\n    - _Exigences : 1.3, 1.4, 2.1, 2.2, 2.4_\n\n- [ ] 5. Remises (dépend de 4.2 et 1.3)\n  - [ ] 5.1 Implémenter les règles de remise : aucune remise sans règle active, remise au taux de la règle\n    - _Exigences : 3.1, 3.2_\n  - [ ] 5.2 Implémenter les plafonds par catégorie (10 %, 15 % Orvanne+), le refus d'activation, la suspension sur baisse de plafond, le plafond général si Orvanne+ est invérifiable, et la journalisation des modifications\n    - _Exigences : 3.3, 3.4, 3.5, 3.6_\n  - [ ] 5.3 Réserver l'échantillon témoin sans remise de chaque règle de remise\n    - _Exigences : 3.7_\n  - [ ] 5.4 Intégrer la création de la remise individuelle dans Vitrine, utilisable par le seul client destinataire\n    - _Exigences : 3.2_\n  - [ ] 5.5 Écrire les tests des remises : plafonds aux bornes, plafond abaissé, Orvanne+ invérifiable, échantillon témoin\n    - _Exigences : 3.1, 3.3, 3.4, 3.6, 3.7_\n\n- [ ] 6. Planification et envoi (dépend de 4 et 5)\n  - [ ] 6.1 Développer le planificateur : heure prévue, tolérance d'envoi, lissage, une relance au plus par panier\n    - _Exigences : 1.7, 2.6_\n  - [ ] 6.2 Re-vérifier l'éligibilité au moment de l'envoi et annuler la relance si le panier est commandé\n    - _Exigences : 1.5, 1.6_\n  - [ ] 6.3 Intégrer l'outil d'e-mailing, avec nouvelles tentatives et statut « non envoyée » motivé\n    - _Exigences : 5.1, 5.4_\n  - [ ] 6.4 Implémenter le registre des canaux : e-mail seul actif, verrou des autres canaux sans avis de la DPO, choix du canal parmi ceux consentis\n    - _Exigences : 5.2, 5.3_\n  - [ ] 6.5 Ajouter l'interrupteur général de retour à la relance actuelle\n    - _Exigences : 9.6_\n  - [ ] 6.6 Écrire les tests de l'envoi : re-vérification, annulation, doublon, tolérance, échec d'envoi, interrupteur\n    - _Exigences : 1.5, 1.6, 1.7, 2.6, 5.4, 9.6_\n\n- [ ] 7. Mesure du CA incrémental (dépend de 1.5 et 6.1)\n  - [ ] 7.1 Implémenter l'affectation au hasard au groupe témoin, qui reçoit la relance actuelle\n    - _Exigences : 6.1_\n  - [ ] 7.2 Implémenter l'attribution des commandes du Lac aux relances selon la fenêtre paramétrée\n    - _Exigences : 6.2_\n  - [ ] 7.3 Développer le tableau : indicateurs par période et par règle pour les deux groupes, CA incrémental avec méthode, tailles et période, agrégats seulement\n    - _Exigences : 6.3, 6.4, 6.6_\n  - [ ] 7.4 Restreindre l'accès aux rôles marketing et finance, journaliser les accès, ajouter l'export agrégé pour le comité commerce\n    - _Exigences : 6.5, 9.4_\n  - [ ] 7.5 Tester le calcul sur un jeu synthétique aux résultats connus d'avance\n    - _Exigences : 6.1, 6.2, 6.4_\n\n- [ ] 8. Recette et mise en service du lot 1 (dépend de 6 et 7)\n  - [ ] 8.1 Tester la charge à 2 fois le volume de pointe mesuré en 1.2, pendant 1 h\n    - _Exigences : 2.6, 9.5_\n  - [ ] 8.2 Vérifier l'hébergement dans l'UE de tous les composants et l'absence de donnée de production hors production\n    - _Exigences : 9.2, 9.3_\n  - [ ] 8.3 Faire la recette métier avec le marketing (règles, modèles, test sur échantillon) et la finance (plafonds, tableau)\n    - _Exigences : 2.1, 2.3, 3.3, 6.3_\n  - [ ] 8.4 Enregistrer l'avis de la DPO, vérifier le verrou d'envoi, puis mettre en service au plus tôt le 12 janvier 2027, e-mail seul\n    - _Exigences : 9.1_\n\n- [ ] 9. Lot 2 : canaux supplémentaires et modèle d'IA (dépend de 8 et des avis de la DPO correspondants)\n  - [ ] 9.1 Activer, canal par canal, les notifications de l'application, le SMS et les messageries mobiles nommées, après avis de la DPO\n    - _Exigences : 5.2, 5.3_\n  - [ ] 9.2 Brancher le modèle d'IA derrière l'interface « décideur », soumis aux mêmes contrôles, avec retour aux règles par paramètre\n    - _Exigences : 8.1, 8.5_\n  - [ ] 9.3 Mettre en place le verrou d'activation du modèle tant que l'avis de la DPO n'est pas enregistré\n    - _Exigences : 8.2_\n  - [ ] 9.4 Enregistrer la version du modèle et les principaux facteurs de chaque décision\n    - _Exigences : 8.3_\n  - [ ] 9.5 Mesurer le CA incrémental du modèle par rapport aux règles sur un groupe de comparaison\n    - _Exigences : 8.4_\n  - [ ] 9.6 Écrire les tests et faire la recette du lot 2\n    - _Exigences : 8.1, 8.2, 8.4, 8.5_\n"}, "registre-droits-rgpd": {"requirements.md": "# Exigences : registre et traitement des demandes d'exercice de droits RGPD\n\n<!-- Projet P05, slug registre-droits-rgpd. Commanditaire : direction juridique et conformité (DPO).\n     Parties prenantes : DSI (comité d'architecture), service client, comité des risques. Source : B07.\n     Dépendances : P01, P02, P03, P04, P06, P07 (nouveaux stockages de données personnelles à inscrire au catalogue des systèmes). -->\n\n## Introduction\n\nLes clients d'Orvanne demandent à accéder à leurs données, à les faire rectifier ou effacer, ou à s'opposer à la prospection. Ces demandes arrivent par l'adresse dédiée, par courrier, par le chat et par les réseaux sociaux. L'équipe de la DPO (2 personnes) les suit aujourd'hui dans un classeur partagé.\n\nSur les neuf premiers mois de 2026, Orvanne a enregistré 412 demandes, dont 61 % de demandes d'effacement. Dix-sept ont été traitées au-delà du délai légal d'un mois. La dernière revue interne a relevé qu'aucune preuve d'exécution n'est conservée et que les données restent dans le Lac et dans les sauvegardes après leur effacement dans Vitrine.\n\nLe projet remplace le classeur par un registre unique qui suit l'échéance de chaque demande, trace les actions réalisées dans chaque système, conserve la preuve de clôture, remet les exports d'accès et produit un tableau de bord trimestriel pour le comité des risques.\n\nLe projet est livré en deux lots (`H31`) :\n- **Lot 1** (exigences 1 à 11) : registre, compte à rebours, saisie par le service client, traçabilité manuelle des actions dans chaque système, effacement avec isolation des données légales, export d'accès, tableau de bord. Il est attendu avant le prochain contrôle interne, dont la date n'est pas connue (`Q30`). Le gel des mises en production du 16 novembre au 11 janvier (`CT-07`) commence une semaine après la note B07 : la mise en production du lot 1 a donc lieu au plus tôt le 12 janvier 2027.\n- **Lot 2** (exigence 12) : orchestration automatisée des actions dans Vitrine, Comptoir, Hangar, le Lac, l'outil d'e-mailing et les nouveaux systèmes.\n\n## Glossaire\n\n- **Demande** : demande d'exercice de droits adressée par une personne à Orvanne (accès, rectification, effacement, opposition à la prospection).\n- **Demandeur** : personne qui exerce ses droits ; en général un client.\n- **Équipe de la DPO** : la déléguée à la protection des données et son équipe (2 personnes), qui instruisent et clôturent les demandes.\n- **Échéance** : date limite de réponse, à un mois de la date de réception, ou plus tard en cas de prolongation.\n- **Prolongation** : report motivé de l'échéance de deux mois.\n- **Catalogue des systèmes** : liste des systèmes d'Orvanne qui stockent des données clients, avec leur responsable et leur mode de traitement (`manuel` ou `automatisé`).\n- **Système concerné** : système du catalogue dans lequel une action doit être réalisée pour une demande.\n- **Action** : opération réalisée dans un système concerné (extraction, rectification, suppression, anonymisation, conservation légale, opposition enregistrée, aucune donnée trouvée), avec son auteur, sa date et sa preuve.\n- **Donnée isolée** : donnée conservée malgré un effacement au titre d'une obligation légale (exemple : factures, 10 ans), avec sa date de fin de conservation.\n- **Preuve de clôture** : document ou référence qui atteste la réponse apportée au demandeur et l'exécution de la demande.\n- **Export d'accès** : document lisible qui rassemble les données d'un demandeur, remis par un canal sécurisé.\n\n## Exigences\n\n### Exigence 1 : registre unique des demandes (lot 1)\n\n**User story :** En tant que membre de l'équipe de la DPO, je veux enregistrer toutes les demandes dans un registre unique, afin de ne plus dépendre d'un classeur partagé et de savoir à tout moment où en est chaque demande.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT enregistrer chaque demande avec son canal, sa date de réception, son type, l'état de vérification de l'identité, les systèmes concernés, son échéance, son statut et sa preuve de clôture. _Source : B07-D1_\n2. LE SYSTÈME DOIT proposer pour le canal une liste paramétrable, initialisée avec l'adresse dédiée, le courrier, le chat et les réseaux sociaux. _Source : B07-D1, B07-D18_\n3. LE SYSTÈME DOIT proposer pour le type une liste paramétrable, initialisée avec l'accès, la rectification, l'effacement et l'opposition à la prospection. _Source : B07-D1_\n4. LE SYSTÈME DOIT attribuer à chaque demande un identifiant unique, jamais réutilisé. _Source : B07-D1_\n5. LE SYSTÈME DOIT gérer les statuts `reçue`, `en cours`, `prolongée` et `clôturée`, et enregistrer chaque changement de statut avec son auteur et son horodatage. _Source : B07-D1, CT-10_\n6. LE SYSTÈME DOIT enregistrer pour la vérification d'identité son état (`non vérifiée` ou `vérifiée`), le moyen utilisé choisi dans une liste paramétrable, son auteur et sa date. _Source : B07-D1_\n7. LE SYSTÈME DOIT permettre de rechercher une demande par identifiant, nom ou adresse e-mail du demandeur, type, statut, canal et période de réception. _Source : B07-D1, B07-D17_\n8. LE SYSTÈME DOIT permettre d'importer les demandes non clôturées du classeur partagé actuel en conservant leur date de réception d'origine. _Source : B07-D1_\n9. SI une demande est créée pour un demandeur qui a déjà une demande non clôturée du même type, ALORS LE SYSTÈME DOIT afficher un avertissement avec un lien vers la demande existante, sans bloquer la création. _Source : B07-D1_\n\n### Exigence 2 : catalogue des systèmes concernés (lot 1)\n\n**User story :** En tant que membre de l'équipe de la DPO, je veux une liste à jour des systèmes qui stockent des données clients, afin de n'oublier aucun système lors du traitement d'une demande.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT tenir un catalogue des systèmes stockant des données clients, initialisé avec Vitrine, Comptoir, Hangar, le Lac et l'outil d'e-mailing. _Source : B07-D5, B07-D1_\n2. LE SYSTÈME DOIT permettre à l'équipe de la DPO d'ajouter, de modifier ou de désactiver un système du catalogue sans nouvelle mise en production, en indiquant son responsable et son mode de traitement (`manuel` ou `automatisé`). _Source : B07-D5, H31_\n3. QUAND une demande est créée, LE SYSTÈME DOIT proposer comme systèmes concernés tous les systèmes actifs du catalogue, chaque retrait d'un système exigeant un motif. _Source : B07-D1, B07-D5_\n\n### Exigence 3 : compte à rebours et alertes (lot 1)\n\n**User story :** En tant que membre de l'équipe de la DPO, je veux être alertée avant l'échéance de chaque demande, afin qu'aucune demande ne soit plus traitée au-delà du délai légal.\n\n#### Critères d'acceptation\n\n1. QUAND une demande est créée, LE SYSTÈME DOIT fixer son échéance à un mois après sa date de réception, décompté en jours calendaires. _Source : B07-D4, H29_\n2. LE SYSTÈME DOIT afficher pour chaque demande non clôturée le nombre de jours calendaires restant avant l'échéance. _Source : B07-D2, H29_\n3. QUAND une demande non clôturée atteint J+15 après sa date de réception, LE SYSTÈME DOIT envoyer une alerte à l'équipe de la DPO. _Source : B07-D2, H29_\n4. QUAND une demande non clôturée atteint J+25 après sa date de réception, LE SYSTÈME DOIT envoyer une seconde alerte à l'équipe de la DPO et marquer la demande comme urgente dans les listes. _Source : B07-D2, H29_\n5. SI l'échéance d'une demande est dépassée sans clôture, ALORS LE SYSTÈME DOIT marquer la demande « hors délai », alerter l'équipe de la DPO et conserver ce marquage après la clôture. _Source : B07-D4, B07-D2_\n6. LE SYSTÈME DOIT permettre à un administrateur de l'équipe de la DPO de modifier le délai de réponse et les seuils d'alerte sans nouvelle mise en production, chaque modification étant journalisée. _Source : H29, CT-10_\n7. LE SYSTÈME DOIT afficher en page d'accueil les demandes non clôturées triées par échéance croissante. _Source : B07-D2, B07-D17_\n\n### Exigence 4 : prolongation du délai (lot 1)\n\n**User story :** En tant que membre de l'équipe de la DPO, je veux prolonger le délai d'une demande complexe en motivant ma décision, afin de rester dans le cadre légal et d'en garder la trace.\n\n#### Critères d'acceptation\n\n1. QUAND un membre de l'équipe de la DPO prolonge une demande, LE SYSTÈME DOIT exiger un motif écrit, passer la demande au statut `prolongée` et journaliser la décision. _Source : B07-D3, CT-10_\n2. QUAND une demande est prolongée, LE SYSTÈME DOIT calculer la nouvelle échéance selon le paramètre de prolongation, fixé par défaut à deux mois ajoutés à l'échéance initiale. _Source : B07-D3, H29_\n3. QUAND une demande est prolongée, LE SYSTÈME DOIT recalculer ses alertes selon les seuils paramétrés pour les demandes prolongées. _Source : H29_\n4. LE SYSTÈME NE DOIT PAS permettre de prolonger une demande de plus de deux mois au total. _Source : B07-D3_\n5. LE SYSTÈME DOIT réserver la prolongation aux membres de l'équipe de la DPO. _Source : B07-D3, B07-D18_\n\n### Exigence 5 : enregistrement des demandes par le service client (lot 1)\n\n**User story :** En tant que conseiller du service client, je veux enregistrer dans le registre une demande reçue sur mes canaux, afin qu'elle soit traitée dans le délai par l'équipe de la DPO.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT permettre à un conseiller du service client d'enregistrer une demande avec son canal, sa date de réception, son type et le message d'origine du demandeur, en texte ou en pièce jointe. _Source : B07-D18_\n2. QUAND un conseiller enregistre une demande, LE SYSTÈME DOIT retenir comme date de réception la date d'envoi du message du demandeur, et non la date de saisie. _Source : B07-D18, H29_\n3. QUAND un conseiller enregistre une demande, LE SYSTÈME DOIT notifier l'équipe de la DPO. _Source : B07-D18_\n4. LE SYSTÈME DOIT limiter l'accès du service client à la création des demandes et à la consultation de leur statut et de leur échéance, sans accès aux pièces d'identité, aux exports ni aux preuves. _Source : B07-D18, B07-D6, CT-01_\n5. OÙ l'intégration avec Comptoir est disponible, LE SYSTÈME DOIT permettre l'enregistrement d'une demande depuis Comptoir sans ressaisir l'identité ni les coordonnées du client. _Source : B07-D18, B07-D20_\n\n### Exigence 6 : traçabilité des actions et clôture (lot 1)\n\n**User story :** En tant que membre de l'équipe de la DPO, je veux tracer chaque action réalisée dans chaque système et conserver la preuve de clôture, afin de démontrer l'exécution effective lors d'un contrôle.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT enregistrer, pour chaque système concerné d'une demande, l'action réalisée, son auteur, sa date et une preuve sous forme de pièce jointe ou de référence. _Source : B07-D1, H31, CT-10_\n2. LE SYSTÈME DOIT proposer les actions selon le type de demande : extraction pour l'accès, rectification, suppression, anonymisation ou conservation légale pour l'effacement, opposition enregistrée pour l'opposition, et « aucune donnée trouvée » pour tous les types. _Source : B07-D6, B07-D7, H31_\n3. SI au moins un système concerné n'a pas d'action enregistrée, ALORS LE SYSTÈME DOIT refuser la clôture de la demande et indiquer les systèmes manquants. _Source : B07-D1, CT-10_\n4. QUAND un membre de l'équipe de la DPO clôture une demande, LE SYSTÈME DOIT exiger une preuve de clôture et une issue, `exécutée` ou `non exécutée` avec un motif. _Source : B07-D1_\n5. SI l'identité du demandeur n'est pas vérifiée, ALORS LE SYSTÈME DOIT refuser la clôture avec l'issue `exécutée`. _Source : B07-D1_\n6. QUAND une demande est clôturée, LE SYSTÈME DOIT interdire la modification de la demande, de ses actions et de ses preuves, toute correction ultérieure étant ajoutée comme un complément daté et signé par son auteur. _Source : B07-D1, CT-10_\n\n### Exigence 7 : effacement et isolation des données à conserver (lot 1)\n\n**User story :** En tant que membre de l'équipe de la DPO, je veux distinguer les données supprimées, anonymisées et conservées au titre d'une obligation légale, afin d'effacer tout ce qui peut l'être sans enfreindre les obligations de conservation.\n\n#### Critères d'acceptation\n\n1. QUAND une action est enregistrée pour une demande d'effacement, LE SYSTÈME DOIT exiger son mode : suppression, anonymisation ou conservation au titre d'une obligation légale. _Source : B07-D7_\n2. SI des données sont conservées au titre d'une obligation légale, ALORS LE SYSTÈME DOIT exiger leur catégorie, l'obligation légale invoquée et leur date de fin de conservation. _Source : B07-D8_\n3. LE SYSTÈME DOIT proposer une liste paramétrable des obligations légales de conservation, initialisée avec les factures et une durée de 10 ans. _Source : B07-D8_\n4. QUAND la date de fin de conservation d'une donnée isolée est atteinte, LE SYSTÈME DOIT alerter l'équipe de la DPO pour achever l'effacement. _Source : B07-D7, B07-D8_\n5. LE SYSTÈME NE DOIT PAS permettre de retirer le Lac des systèmes concernés d'une demande d'effacement. _Source : B07-D5, B07-D7_\n\n### Exigence 8 : export d'accès remis par un canal sécurisé (lot 1)\n\n**User story :** En tant que demandeur, je veux recevoir mes données dans un document lisible, par un moyen sûr, afin de savoir ce qu'Orvanne détient sur moi sans risque qu'un tiers y accède.\n\n#### Critères d'acceptation\n\n1. QUAND toutes les extractions d'une demande d'accès sont enregistrées, LE SYSTÈME DOIT constituer un export unique, lisible sans outil technique, qui présente les données par système avec des libellés en français. _Source : B07-D6_\n2. LE SYSTÈME NE DOIT PAS remettre un export tant que l'identité du demandeur n'est pas vérifiée. _Source : B07-D6, B07-D1_\n3. LE SYSTÈME DOIT remettre l'export par un lien de téléchargement personnel, valable pendant une durée paramétrable, dont l'ouverture exige un code de vérification transmis séparément du lien. _Source : B07-D6_\n4. SI le lien expire sans téléchargement, ALORS LE SYSTÈME DOIT le désactiver et alerter l'équipe de la DPO. _Source : B07-D6_\n5. QUAND le demandeur télécharge l'export, LE SYSTÈME DOIT enregistrer la date et l'heure du téléchargement comme preuve de remise. _Source : B07-D6, CT-10_\n6. OÙ la demande a été reçue par courrier, LE SYSTÈME DOIT permettre d'enregistrer une remise par courrier, avec la référence d'envoi comme preuve. _Source : B07-D6, B07-D1_\n7. LE SYSTÈME DOIT supprimer le fichier d'export à l'issue d'un délai paramétrable après sa remise ou l'expiration du lien, en conservant uniquement la preuve de remise et l'empreinte du fichier. _Source : B07-D6, CT-01_\n\n### Exigence 9 : tableau de bord trimestriel pour le comité des risques (lot 1)\n\n**User story :** En tant que membre du comité des risques, je veux un tableau de bord trimestriel des demandes, afin de suivre le respect des délais et la conformité du traitement.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT produire pour chaque trimestre civil un tableau de bord indiquant au minimum, par type et par canal : les demandes reçues, clôturées, en cours, prolongées et traitées hors délai, ainsi que le délai médian de traitement. _Source : B07-D9, B07-D4, B07-D3_\n2. LE SYSTÈME DOIT indiquer dans le tableau de bord le nombre de demandes clôturées sans preuve d'exécution pour au moins un système, issues de l'import du classeur. _Source : B07-D9, B07-D1_\n3. LE SYSTÈME NE DOIT PAS faire figurer de donnée personnelle dans le tableau de bord. _Source : B07-D9, CT-01_\n4. LE SYSTÈME DOIT permettre l'export du tableau de bord au format PDF et donner au comité des risques un accès en lecture limité à ce seul tableau de bord. _Source : B07-D9, CT-01_\n\n### Exigence 10 : prise en main sans formation lourde (lot 1)\n\n**User story :** En tant que membre de l'équipe de la DPO ou conseiller du service client, je veux un outil simple, afin de l'utiliser sans formation lourde.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT permettre à chaque membre de l'équipe de la DPO de réaliser sans assistance, avec pour seul support l'aide intégrée aux écrans, les scénarios de recette : enregistrer, vérifier l'identité, prolonger, tracer une action, clôturer, remettre un export. _Source : B07-D17_\n2. LE SYSTÈME DOIT permettre à un conseiller du service client d'enregistrer une demande sans assistance, avec pour seul support l'aide intégrée à l'écran de saisie. _Source : B07-D17, B07-D18_\n3. LE SYSTÈME DOIT présenter les écrans en français, avec les termes du glossaire de cette spec pour les types, statuts et actions. _Source : B07-D17_\n\n### Exigence 11 : sécurité, conservation et hébergement (lot 1)\n\n**User story :** En tant que DPO, je veux que le registre protège les données qu'il contient et garde la trace de chaque opération, afin qu'il soit lui-même conforme et opposable lors d'un contrôle.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT journaliser, sans possibilité de modification ni de suppression par les utilisateurs, toute consultation, création, modification, prolongation, action, clôture et remise d'export, avec l'utilisateur et l'horodatage. _Source : CT-10, B07-D1_\n2. LE SYSTÈME DOIT restreindre les accès selon quatre rôles : équipe de la DPO, administrateur de l'équipe de la DPO, service client et comité des risques. _Source : CT-01, B07-D18, B07-D9_\n3. LE SYSTÈME DOIT chiffrer les pièces jointes, les preuves et les exports au repos et en transit. _Source : B07-D6, CT-01_\n4. LE SYSTÈME DOIT conserver chaque demande clôturée pendant une durée paramétrable fixée par la DPO, puis la supprimer avec ses pièces jointes et ses preuves. _Source : CT-01, B07-D1_\n5. LE SYSTÈME DOIT être hébergé dans l'Union européenne. _Source : CT-08_\n6. LE SYSTÈME DOIT authentifier les utilisateurs internes par l'authentification interne existante d'Orvanne, sans compte propre à l'outil. _Source : B07-D20_\n7. LE SYSTÈME DOIT utiliser exclusivement des données synthétiques ou anonymisées dans les environnements de développement, de test et de démonstration. _Source : CT-04_\n\n### Exigence 12 : orchestration des actions dans les systèmes (lot 2)\n\n**User story :** En tant que membre de l'équipe de la DPO, je veux que le registre déclenche lui-même les actions dans les systèmes concernés et en recueille la preuve, afin de réduire les manipulations et les oublis.\n\n#### Critères d'acceptation\n\n1. OÙ un système du catalogue est en mode `automatisé`, LE SYSTÈME DOIT lui transmettre l'action correspondant au type de demande, après vérification de l'identité et validation de la liste des systèmes concernés par un membre de l'équipe de la DPO. _Source : B07-D5, B07-D7, H31_\n2. OÙ l'orchestration est active, LE SYSTÈME DOIT couvrir Vitrine, Comptoir, Hangar, le Lac et l'outil d'e-mailing. _Source : B07-D5_\n3. QUAND un système automatisé renvoie le compte rendu d'une action, LE SYSTÈME DOIT l'enregistrer comme action et preuve pour ce système. _Source : B07-D5, CT-10_\n4. SI un système automatisé signale une erreur ou ne renvoie pas de compte rendu dans le délai paramétré, ALORS LE SYSTÈME DOIT alerter l'équipe de la DPO et repasser l'action en traitement manuel. _Source : B07-D5, H31_\n5. QUAND une demande d'effacement est orchestrée, LE SYSTÈME DOIT transmettre à chaque système les catégories de données à isoler au titre d'une obligation légale. _Source : B07-D8, B07-D5_\n6. QUAND une demande d'accès est orchestrée, LE SYSTÈME DOIT intégrer à l'export d'accès les extractions renvoyées par les systèmes. _Source : B07-D5, B07-D6_\n7. QUAND une demande d'opposition à la prospection est orchestrée, LE SYSTÈME DOIT transmettre l'opposition à l'outil d'e-mailing. _Source : B07-D5_\n8. LE SYSTÈME DOIT publier un contrat d'interface unique, que tout nouveau système stockant des données clients implémente pour passer en mode `automatisé`. _Source : B07-D5_\n\n## Hors périmètre\n\n- Première version avant le prochain contrôle interne (`B07-D19`) : échéance de projet, pas une exigence du système. Elle fixe le lot 1 (introduction et `tasks.md`) ; sa date dépend de `Q30` et du gel `CT-07`.\n- Soumission de tout nouveau traitement à la DPO (`B07-D10`) : règle transverse portée par `CT-01`, appliquée par chaque projet. Le registre lui-même y est soumis (tâche 1.1).\n- Usage du numéro de mobile (`B07-D11`) : règle portée par `CT-02`. Le registre n'utilise pas le mobile, y compris pour transmettre le code de l'export.\n- Absence d'offre commerciale dans un message de service (`B07-D12`) : règle portée par `CT-03`.\n- Conservation des données de prospection 3 ans au plus (`B07-D13`) : règle portée par `CT-05`, appliquée par P04.\n- Purge des historiques de prospection de plus de 3 ans (`B07-D14`) : chantier sans porteur ni échéance, distinct de l'outil de registre (`Q31`). Aucun projet ne le reprend à ce jour.\n- Photos et pièces jointes comme données personnelles (`B07-D15`) : règle portée par `CT-06`, appliquée par P02 et P03. Leurs stockages entreront au catalogue des systèmes (exigence 2).\n- Données de production pour les démonstrations et les tests (`B07-D16`) : règle portée par `CT-04`, appliquée au registre par le critère 11.7.\n- Repérage automatique des demandes arrivant par le chat ou les réseaux sociaux : la note B07 constate le problème (`B07-F2`) sans demander de fonction. Le projet fournit la saisie par le service client (exigence 5).\n- Traitement des sauvegardes lors d'un effacement : le constat le signale, mais le traitement attendu n'est pas décrit (`B07-F1`). Il reste à spécifier après la réponse à `Q30`.\n\n## Hypothèses\n\n| Id | Hypothèse | Conflit | Réversible |\n|---|---|---|---|\n| H29 | Le compte à rebours d'une demande de droits part de sa date de réception, en jours calendaires ; les seuils d'alerte (J+15, J+25) et l'échéance après prolongation sont des paramètres. | — | oui |\n| H31 | La V1 du registre, attendue avant le prochain contrôle interne, couvre le registre, le compte à rebours, la saisie par le service client, la preuve de clôture, l'export d'accès et le tableau de bord ; les actions dans chaque système sont tracées manuellement. L'orchestration automatisée dans Vitrine, Comptoir, Hangar, le Lac et l'outil d'e-mailing (B07-D5) vient en V2. | — | oui |\n\n## Questions ouvertes\n\n| Id | Question | Destinataire | Bloquante |\n|---|---|---|---|\n| Q30 | Quelle est la date du prochain contrôle interne ? Le compte à rebours part-il de la réception ou de la vérification d'identité ? Comment traiter le Lac et les sauvegardes lors d'un effacement ? | Hélène Marsac | non (date du lot 1 ; traitement des sauvegardes non spécifié, voir Hors périmètre) |\n| Q31 | Qui porte la purge des historiques de prospection de plus de 3 ans, et pour quelle échéance ? | Hélène Marsac ; Capucine Lorrain | non |\n| Q34 | L'exigence d'hébergement dans le cloud d'Orvanne (B01) s'applique-t-elle à tous les projets, ou un hébergement dans l'UE chez un éditeur est-il admis (B03, B07-D20) ? | DSI (comité d'architecture) | non (critère 11.5) |\n\n### Points à remonter à l'analyste (sans question dans `work/analyse.json`)\n\nCes points flous de la fiche B07 n'ont pas de question associée. La spec les traite par un paramètre ou une valeur prudente, à faire confirmer par la DPO :\n\n- **Moyens de vérification de l'identité** (`B07-F3`) : liste paramétrable (critère 1.6). Les critères 6.5 et 8.2 interdisent une clôture `exécutée` et la remise d'un export sans identité vérifiée ; ce choix prudent est à confirmer.\n- **Canal sécurisé et format de l'export** (`B07-F4`) : lien personnel à durée limitée et code transmis séparément (critère 8.3), document lisible (critère 8.1). Mécanisme proposé, à valider.\n- **Choix entre suppression et anonymisation** (`B07-F7`) : laissé à l'appréciation de l'équipe de la DPO, action par action (critère 7.1).\n- **Contenu du tableau de bord trimestriel** (`B07-F9`) : indicateurs minimaux déduits du constat de B07 (critères 9.1 et 9.2), à valider.\n- **Rectification et opposition** (`B07-F15`) : traitées par le même circuit que les autres types, sans règle propre.\n- **Échéance du lot 1 et gel** : si le prochain contrôle interne a lieu avant le 12 janvier 2027, `B07-D19` entre en conflit avec `CT-07`. Ce conflit n'est pas enregistré dans l'analyse.\n- **Localisation des factures à isoler** (`B07-D8`) : le système qui les détient n'est pas cité.\n- **Durée de conservation du registre lui-même** et délai de suppression des exports (critères 8.7 et 11.4) : paramètres à fixer par la DPO.\n", "design.md": "# Conception : registre et traitement des demandes d'exercice de droits RGPD\n\n## Vue d'ensemble\n\nLa solution est une **application interne de registre**, hébergée dans l'Union européenne et reliée à l'authentification interne d'Orvanne. Elle remplace le classeur partagé de l'équipe de la DPO. Elle comprend :\n\n- le **registre** des demandes et le **catalogue des systèmes** qui stockent des données clients ;\n- un **moteur d'échéances** qui calcule les échéances et émet les alertes J+15, J+25 et « hors délai » ;\n- un **écran de saisie** pour le service client, accessible depuis Comptoir si l'intégration est possible ;\n- la **traçabilité des actions** par système, avec preuves, et la **clôture** contrôlée ;\n- un **générateur d'export d'accès** et un **espace de remise** externe, seul composant exposé au demandeur ;\n- un **tableau de bord trimestriel** agrégé pour le comité des risques ;\n- au lot 2, un **orchestrateur** qui transmet les actions aux systèmes en mode `automatisé` et recueille leurs comptes rendus.\n\nChoix structurants :\n\n| Choix | Raison | Alternative écartée |\n|---|---|---|\n| Développement interne sur les composants existants (authentification, hébergement, Comptoir) | Préférence exprimée par la DPO (B07-D20) ; budget non arrêté (B07-F13) | Achat d'un produit de gestion des droits : possible si le comité d'architecture le décide (Q34), la spec fonctionnelle reste valable |\n| Lot 1 à traçabilité manuelle, orchestration au lot 2 | Échéance rapprochée (B07-D19) ; la traçabilité manuelle corrige déjà l'absence de preuve (H31) | Orchestration dès la V1 : cinq intégrations à livrer avant le contrôle interne |\n| Catalogue des systèmes paramétrable, avec un mode `manuel` ou `automatisé` par système | Les projets P01, P02, P03, P06 et P07 créent de nouveaux stockages ; un système passe en `automatisé` sans refonte du registre (B07-D5) | Liste de systèmes codée en dur |\n| Délai, seuils d'alerte et prolongation paramétrables | Point de départ et prolongation non précisés (B07-F5, B07-F6, H29) | Coder J+15 / J+25 / +2 mois en dur |\n| Espace de remise séparé de l'application interne | Seul composant accessible depuis Internet ; surface d'exposition réduite (B07-D6) | Envoi de l'export en pièce jointe d'e-mail : pas de contrôle d'accès ni de preuve de remise |\n| Registre en écriture seule après clôture, avec compléments datés | Preuve opposable lors d'un contrôle (B07-D1, CT-10) | Modification libre, comme dans le classeur |\n\nLes technologies citées ci-dessous sont des **propositions** : la source B07 n'en impose aucune.\n\n## Architecture\n\n```mermaid\nflowchart LR\n  subgraph Utilisateurs internes\n    DPO[Équipe de la DPO]\n    SC[Service client]\n    CR[Comité des risques]\n  end\n  subgraph Registre des droits\n    UI[Application web du registre]\n    REG[(Registre : demandes, actions, preuves, catalogue, paramètres)]\n    ECH[Moteur d'échéances]\n    EXP[Générateur d'export]\n    TDB[Tableau de bord trimestriel]\n    JRN[(Journal d'audit en ajout seul)]\n    DOC[(Stockage chiffré des pièces et exports)]\n    ORC[Orchestrateur - lot 2]\n  end\n  AUTH[Authentification interne Orvanne]\n  CPT[Comptoir]\n  MAIL[Service d'e-mail interne]\n  REM[Espace de remise externe]\n  DEM[Demandeur]\n  DPO --> UI\n  SC --> UI\n  SC -. option .-> CPT\n  CPT -. lien contextuel ou composant .-> UI\n  CR --> TDB\n  UI --> AUTH\n  UI --> REG\n  UI --> DOC\n  UI --> JRN\n  ECH --> REG\n  ECH -- alertes --> MAIL\n  EXP --> DOC\n  EXP --> REM\n  REM -- lien et code --> DEM\n  REM -- preuve de remise --> REG\n  TDB --> REG\n  ORC -- actions --> P[Passerelle]\n  P --> V[Vitrine]\n  P --> CPT\n  P --> H[Hangar]\n  P --> EM[Outil d'e-mailing]\n  ORC -- traitement par lots --> LAC[le Lac]\n  ORC -- comptes rendus --> REG\n```\n\n## Composants et interfaces\n\n| Composant | Responsabilité | Interfaces (entrée / sortie) | Exigences | Lot |\n|---|---|---|---|---|\n| Application web du registre | Création, recherche, instruction et clôture des demandes ; aide intégrée aux écrans ; écrans en français | Navigateur ; authentification interne ; API interne du registre | 1, 4, 6, 7, 10 | 1 |\n| Registre | Stocke les demandes, statuts, vérifications d'identité, systèmes concernés, actions, preuves, données isolées, catalogue et paramètres | Base relationnelle (proposition : PostgreSQL) | 1, 2, 6, 7, 11.4 | 1 |\n| Import du classeur | Reprise unique des demandes non clôturées du classeur, avec leur date de réception d'origine et leur historique d'actions | Fichier tableur exporté du classeur ; rapport d'import (lignes reprises, rejetées, motif) | 1.8, 9.2 | 1 |\n| Catalogue des systèmes | Liste des systèmes stockant des données clients, responsable, mode `manuel` ou `automatisé`, statut actif | Écran d'administration, rôle administrateur DPO | 2, 7.5, 12.8 | 1 |\n| Moteur d'échéances | Calcule l'échéance (réception + 1 mois), les alertes J+15, J+25, l'état « hors délai », la prolongation et la fin de conservation des données isolées | Passage quotidien planifié et recalcul à chaque modification ; alertes par le service d'e-mail interne et dans l'application | 3, 4, 7.4 | 1 |\n| Écran de saisie du service client | Enregistrement d'une demande, du message d'origine et de la date d'envoi ; consultation du statut et de l'échéance | Application web ; en option, lien contextuel ou composant dans Comptoir (capacités d'extension de Comptoir à vérifier) | 5 | 1 |\n| Générateur d'export | Assemble les extractions par système en un document lisible (proposition : PDF avec sommaire et libellés en français, accompagné des données au format CSV) | Lit les pièces d'extraction ; écrit l'export chiffré dans le stockage | 8.1, 12.6 | 1 |\n| Espace de remise | Page de téléchargement externe : lien personnel à jeton aléatoire, code de vérification à usage unique, durée de validité, compteur de tentatives, preuve de téléchargement | HTTPS exposé sur Internet ; envoi du lien et du code par deux e-mails distincts ; pas de SMS (CT-02) | 8.2 à 8.7 | 1 |\n| Tableau de bord trimestriel | Indicateurs agrégés par type et par canal, sans donnée personnelle ; export PDF | Vue agrégée calculée sur le registre ; rôle comité des risques | 9 | 1 |\n| Journal d'audit | Trace en ajout seul de toutes les consultations et opérations | Table ou flux en ajout seul, droits d'écriture réservés à l'application | 11.1 | 1 |\n| Stockage des pièces | Pièces jointes, preuves et exports, chiffrés au repos, purgés selon les durées paramétrées | Stockage objet chiffré (proposition) | 8.7, 11.3, 11.4 | 1 |\n| Orchestrateur | Transmet les actions aux systèmes `automatisé`, suit les comptes rendus, gère les délais et le repli manuel | Contrat d'interface unique (`rechercher`, `extraire`, `rectifier`, `effacer`, `opposer`) ; messages via Passerelle pour Vitrine, Comptoir, Hangar et l'outil d'e-mailing ; traitement par lots pour le Lac | 12 | 2 |\n\n## Flux principaux\n\n### Enregistrement et instruction d'une demande (lot 1)\n\n```mermaid\nsequenceDiagram\n  participant SC as Service client\n  participant UI as Registre\n  participant M as Moteur d'échéances\n  participant DPO as Équipe de la DPO\n  SC->>UI: enregistrer (canal, date d'envoi du client, type, message d'origine)\n  UI->>UI: avertir si une demande du même type est ouverte pour ce demandeur\n  UI->>M: calculer l'échéance (date de réception + 1 mois)\n  UI-->>DPO: notification de nouvelle demande\n  DPO->>UI: vérifier l'identité (moyen, date)\n  DPO->>UI: valider les systèmes concernés (tous les systèmes actifs par défaut)\n  loop pour chaque système concerné\n    DPO->>UI: tracer l'action et joindre la preuve\n  end\n  M-->>DPO: alertes J+15, J+25, hors délai\n  DPO->>UI: clôturer (issue, preuve de clôture)\n  UI->>UI: refuser si une action manque ou si l'identité n'est pas vérifiée pour une issue « exécutée »\n  UI->>UI: figer la demande\n```\n\n### Remise d'un export d'accès (lot 1)\n\n```mermaid\nsequenceDiagram\n  participant DPO as Équipe de la DPO\n  participant G as Générateur d'export\n  participant R as Espace de remise\n  participant D as Demandeur\n  DPO->>G: constituer l'export (toutes les extractions sont tracées)\n  G->>G: vérifier que l'identité est vérifiée\n  G->>R: déposer l'export chiffré, créer le lien et le code\n  R->>D: e-mail 1 : lien personnel\n  R->>D: e-mail 2 : code de vérification\n  D->>R: ouvrir le lien et saisir le code\n  R->>D: télécharger l'export\n  R->>G: enregistrer la preuve de remise (date, heure)\n  Note over R: à l'expiration du lien ou après le délai paramétré, suppression du fichier ; seules la preuve et l'empreinte restent\n```\n\n### Orchestration d'un effacement (lot 2)\n\n```mermaid\nsequenceDiagram\n  participant DPO as Équipe de la DPO\n  participant O as Orchestrateur\n  participant S as Système automatisé\n  participant R as Registre\n  DPO->>O: valider la liste des systèmes concernés\n  O->>S: effacer(personne, catégories à isoler)\n  alt compte rendu reçu dans le délai\n    S-->>O: supprimé / anonymisé / conservé (catégorie, fin de conservation)\n    O->>R: enregistrer l'action et la preuve\n  else erreur ou délai dépassé\n    O->>R: repasser l'action en traitement manuel\n    O-->>DPO: alerte\n  end\n```\n\n## Modèle de données\n\n| Entité | Attributs principaux | Donnée personnelle | Durée de conservation |\n|---|---|---|---|\n| Demande | identifiant, canal, type, date de réception, date de saisie, auteur de la saisie, origine (`saisie` ou `import`), statut, échéance initiale, échéance prolongée, motif de prolongation, marquage urgent et hors délai, issue, motif de non-exécution | oui (rattachée à un demandeur) | durée paramétrable fixée par la DPO après la clôture (11.4) |\n| Demandeur | nom, adresse e-mail, adresse postale si courrier, identifiant client si connu | oui | celle de la demande |\n| VérificationIdentité | état, moyen, auteur, date, pièce justificative éventuelle | oui (la pièce d'identité est une donnée sensible pour Orvanne) | pièce supprimée dès la vérification faite (proposition à valider par la DPO), trace conservée avec la demande |\n| SystèmeCatalogue | nom, responsable, mode (`manuel` ou `automatisé`), actif, date d'ajout | non (nom du responsable : donnée d'un employé) | conservé |\n| SystèmeConcerné | demande, système, retiré oui ou non, motif de retrait | non | celle de la demande |\n| Action | demande, système, type d'action, mode d'effacement, auteur, date, preuve, mention « antérieure à l'outil » pour les demandes importées | oui (indirectement) | celle de la demande |\n| DonnéeIsolée | action, catégorie, obligation légale, date de fin de conservation | non (référence à la demande) | jusqu'à la date de fin de conservation, puis alerte (7.4) |\n| ObligationLégale | libellé, durée (factures : 10 ans) | non | conservé |\n| PièceJointe / Preuve | type, empreinte, emplacement chiffré, auteur, date | oui | celle de la demande |\n| Export | demande, empreinte, emplacement chiffré, date de création, lien, code (empreinte seulement), validité, date de téléchargement | oui | fichier supprimé après le délai paramétré (8.7) ; preuve et empreinte conservées avec la demande |\n| Paramètre | clé, valeur, auteur, date | non | conservé |\n| Journal | utilisateur, rôle, action, objet, horodatage | oui (identifiant de l'employé) | durée à fixer par la DPO, au moins égale à celle des demandes |\n\n**Demandes importées du classeur** : une action passée peut être reprise avec la mention « antérieure à l'outil, preuve absente ». Ces demandes sont comptées par le critère 9.2, qui rend visible la reprise de l'existant au comité des risques.\n\n## Gestion des erreurs\n\n| Situation | Comportement | Exigence |\n|---|---|---|\n| Demande en doublon possible | Avertissement avec lien vers la demande existante ; création possible | 1.9 |\n| Ligne du classeur incomplète (date de réception absente ou illisible) | Ligne rejetée dans le rapport d'import, à reprendre à la main ; aucune date inventée | 1.8 |\n| Date de réception saisie postérieure à la date de saisie | Saisie refusée avec message | 5.2 |\n| Échec d'envoi d'une alerte par e-mail | Alerte conservée dans l'application, nouvel essai à chaque passage du moteur, incident signalé à la supervision | 3.3, 3.4, 3.5 |\n| Passage quotidien du moteur non exécuté | Rattrapage au passage suivant : toutes les alertes dont le seuil est dépassé partent, avec leur date de seuil | 3.3, 3.4, 3.5 |\n| Clôture demandée avec un système sans action | Refus, liste des systèmes manquants | 6.3 |\n| Clôture `exécutée` sans identité vérifiée | Refus | 6.5 |\n| Retrait du Lac d'une demande d'effacement | Refus ; l'action « aucune donnée trouvée » reste possible | 7.5 |\n| Export demandé alors que l'identité n'est pas vérifiée | Refus | 8.2 |\n| Code de vérification erroné plusieurs fois | Lien bloqué après un nombre de tentatives paramétrable (proposition : 5), alerte à l'équipe de la DPO | 8.3 |\n| Lien expiré sans téléchargement | Lien désactivé, alerte, nouvel envoi possible par l'équipe de la DPO | 8.4 |\n| Adresse e-mail du demandeur absente ou invalide | Remise par courrier enregistrée (8.6) ou demande de coordonnées au demandeur | 8.3, 8.6 |\n| Système automatisé en erreur ou muet au-delà du délai | Repli en traitement manuel et alerte ; jamais de clôture sans action enregistrée | 12.4, 6.3 |\n| Compte rendu d'un système pour une demande déjà clôturée | Ajouté comme complément daté, sans modifier la demande | 6.6, 12.3 |\n\n## Sécurité et RGPD\n\n- **CT-01** : le registre est lui-même un traitement de données personnelles. Son analyse est soumise à la DPO avant le développement (tâche 1.1). Points à faire valider : moyens de vérification de l'identité, durée de conservation des demandes, des pièces d'identité et du journal, mécanisme de remise de l'export, contenu du tableau de bord.\n- **Données traitées** : identité et coordonnées du demandeur, pièce d'identité éventuelle, contenu des demandes, extractions de données clients (exports). Les exports regroupent toutes les données d'une personne : ce sont les pièces les plus sensibles du registre.\n- **Accès** (11.2) : rôles `dpo`, `admin-dpo`, `service-client` et `comite-risques`. Le service client crée et consulte le statut, sans accès aux pièces, exports ni preuves (5.4). Le comité des risques ne voit que des agrégats (9.3, 9.4).\n- **Journalisation** (CT-10, 11.1) : toutes les consultations et opérations sont tracées dans un journal en ajout seul.\n- **Chiffrement** (11.3) : TLS en transit, chiffrement au repos du stockage des pièces et exports (proposition : clés gérées par le service de gestion de clés du cloud d'Orvanne).\n- **Espace de remise** (8.3) : jeton aléatoire non devinable, code à usage unique stocké sous forme d'empreinte, durée de validité et nombre de tentatives limités. Le code n'est pas envoyé par SMS, pour ne pas utiliser le mobile hors de la livraison (CT-02).\n- **Hébergement** (CT-08, 11.5) : Union européenne ; hébergement dans le cloud d'Orvanne à confirmer (Q34).\n- **Données de test** (CT-04, 11.7) : jeux synthétiques uniquement, y compris pour la reprise du classeur, qui est répétée sur une copie anonymisée.\n- **Gel** (CT-07) : aucune mise en production du 16 novembre au 11 janvier.\n\n## Volumétrie et performance\n\n| Grandeur | Valeur | Base |\n|---|---|---|\n| Demandes sur 9 mois | 412 | B07-N2 |\n| Demandes par mois | ≈ 46 | estimation (412 / 9) |\n| Demandes par an | ≈ 550 | estimation |\n| Part d'effacements | 61 %, soit ≈ 28 par mois | B07-N3, estimation |\n| Demandes hors délai sur 9 mois | 17 (≈ 4 %) | B07-N4 |\n| Utilisateurs de l'équipe de la DPO | 2 | B07-N1 |\n| Actions par an (5 systèmes initiaux par demande) | ≈ 2 750 | estimation |\n| Effet du pic de fin d'année sur les demandes | inconnu | aucune source |\n\nCes volumes sont faibles. Le dimensionnement vise 10 fois le volume estimé (≈ 500 demandes par mois) pour absorber la hausse attendue avec la meilleure reconnaissance des demandes reçues par le cha
