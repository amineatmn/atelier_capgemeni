.5 Écrire les tests des indicateurs sur un jeu synthétique aux résultats connus et faire valider les définitions par l'approvisionnement\n    - _Exigences : 9.1, 9.2, 9.3, 9.4, 9.5_\n\n- [ ] 10. Conservation des données (dépend de 1.1 et 2.1)\n  - [ ] 10.1 Implémenter la purge des comptes externes inactifs et la pseudonymisation des e-mails des réservations selon les durées fixées avec la DPO\n    - _Exigences : 11.3_\n  - [ ] 10.2 Vérifier que seules les données de contact autorisées sont collectées dans les écrans et l'API\n    - _Exigences : 11.2_\n\n- [ ] 11. Recette et mise en service du pilote E1 (dépend de 3 à 10)\n  - [ ] 11.1 Faire réaliser l'audit RGAA du portail et tester le parcours complet sur smartphone\n    - _Exigences : 1.5_\n  - [ ] 11.2 Vérifier l'absence de texte en dur avec une pseudo-langue\n    - _Exigences : 10.1, 10.2_\n  - [ ] 11.3 Faire la recette métier avec le chef de quai et le poste de garde de E1 sur une journée synthétique rejouée de 70 camions\n    - _Exigences : 2.5, 6.1, 6.2, 6.4, 7.1, 7.2, 7.6, 8.1, 8.3, 8.5_\n  - [ ] 11.4 Faire la recette du parcours de réservation avec 2 ou 3 fournisseurs pilotes, sur l'environnement de recette et des données synthétiques\n    - _Exigences : 1.1, 3.1, 4.1, 5.1, 5.2, 11.4_\n  - [ ] 11.5 Décider avec le chef de quai E1 du traitement des fournisseurs hors pilote (saisie par forçage ou quais bloqués)\n    - _Exigences : 6.2, 6.4_\n  - [ ] 11.6 Déployer dans l'Union européenne, hors période de gel, créer les comptes des fournisseurs pilotes et ouvrir la réservation sur E1\n    - _Exigences : 11.1, 1.3, 2.6_\n"}, "espace-vendeur-marketplace": {"requirements.md": "# Exigences : évolutions de l'espace vendeur de la marketplace\n\n<!-- Projet P07, slug espace-vendeur-marketplace. Commanditaire : direction marketplace.\n     Parties prenantes : finance, comptabilité, chargés de compte, service client (Comptoir), DSI. Sources : B09 (MKP-01 à MKP-12).\n     Les défauts MKP-07 et MKP-11 (lenteur) sont spécifiés dans P08 (correctifs-espace-vendeur). -->\n\n## Introduction\n\nLes vendeurs partenaires de la marketplace d'Orvanne disposent déjà d'un espace vendeur, dont le système porteur n'est pas nommé dans les sources (B09-F15). Le tableau de la direction marketplace (B09) recense 12 demandes saisies entre le 02/09/2026 et le 03/11/2026. Les vendeurs veulent suivre leurs ventes sans appeler leur chargé de compte, télécharger les factures de commission que la comptabilité produit chaque mois en PDF, et comprendre leurs reversements. Les vendeurs du top 20 demandent à modifier eux-mêmes leur IBAN (aujourd'hui par e-mail au chargé de compte), alors que la finance interdit, depuis l'incident de juin, toute modification de coordonnées bancaires sans double validation interne. Deux alertes de retard d'expédition sont demandées : au chargé de compte au-delà de 2 % sur 30 jours glissants, au vendeur au-delà de 5 % sur 7 jours.\n\nLe projet est découpé en trois lots, pour tenir compte du gel des mises en production du 16 novembre au 11 janvier (`CT-07`), des échéances exprimées et de la dépendance à P08 :\n- **Lot 1a** (exigences 3, 4, 6, 7, critères 10.1, 10.2, 10.4 et exigence 12) : taux de retard, alerte au vendeur (MKP-08, échéance 15/01/2027) et modification encadrée de l'IBAN (MKP-04, « ASAP »). Mise en production au plus tôt le 12 janvier 2027. Une mise en production avant le 16 novembre n'est pas prévue : elle supposerait l'avis de la DPO (`CT-01`) et la réponse à `Q25` en moins de deux semaines.\n- **Lot 1b** (exigences 1, 2 et 5) : vue des ventes (MKP-01, T1 2027), factures de commission (MKP-02) et alerte aux chargés de compte (MKP-03, « fin mars », sans année). Ce lot est livré après les correctifs de P08, qui portent sur les mêmes données de ventes.\n- **Lot 2** (exigences 8, 9, 11 et critères 10.3, 10.5 à 10.7) : détail des reversements (MKP-11), réponses aux questions des clients (MKP-09, S1 2027), ouverture aux vendeurs européens (MKP-10, 2027) et tableau de bord sur mobile (MKP-12, T2 2027).\n\n## Glossaire\n\n- **Vendeur** : partenaire qui vend ses articles sur Vitrine via la marketplace et dispose d'un compte dans l'espace vendeur.\n- **Espace vendeur** : portail existant réservé aux vendeurs (ventes, export des ventes, reversements).\n- **Chargé de compte** : collaborateur d'Orvanne qui suit un portefeuille de vendeurs.\n- **Facture de commission** : facture mensuelle, au format PDF, que la comptabilité émet à chaque vendeur pour la commission prélevée par Orvanne.\n- **Reversement** : versement par Orvanne au vendeur du produit de ses ventes, sur son IBAN en vigueur.\n- **IBAN en vigueur** : dernier IBAN du vendeur ayant reçu la double validation interne ; c'est le seul utilisé pour les reversements.\n- **Double validation interne** : approbation d'une modification de coordonnées bancaires par deux collaborateurs distincts d'Orvanne habilités par la finance.\n- **Retard d'expédition** : commande que le vendeur expédie en retard, selon la définition unique fournie par la direction marketplace (`Q26`).\n- **Taux de retard d'expédition** : part des commandes d'un vendeur en retard d'expédition sur une fenêtre de calcul donnée.\n- **Règle d'alerte** : combinaison paramétrable d'un seuil, d'une fenêtre de calcul et d'un destinataire (vendeur ou chargé de compte).\n\n## Exigences\n\n### Exigence 1 : vue des ventes du vendeur (lot 1b)\n\n**User story :** En tant que vendeur, je veux voir en un coup d'œil mes ventes du jour, de la semaine et du mois, afin de suivre mon activité sans appeler mon chargé de compte.\n\n#### Critères d'acceptation\n\n1. QUAND un vendeur ouvre son tableau de bord, LE SYSTÈME DOIT afficher le nombre de commandes et le montant des ventes du vendeur pour le jour en cours, la semaine en cours et le mois en cours. _Source : B09-D1_\n2. LE SYSTÈME DOIT afficher les trois périodes sur le même écran, sans autre action du vendeur que l'ouverture du tableau de bord. _Source : B09-D1_\n3. LE SYSTÈME DOIT afficher la date et l'heure de la dernière mise à jour des chiffres de ventes. _Source : B09-D1_\n4. LE SYSTÈME DOIT calculer les chiffres du tableau de bord à partir des mêmes données que l'export des ventes, de sorte qu'une même période donne le même nombre de commandes et le même montant dans les deux. _Source : B09-D1_\n\n### Exigence 2 : factures de commission (lot 1b)\n\n**User story :** En tant que vendeur, je veux télécharger mes factures de commission, afin d'être autonome pour ma comptabilité.\n\n#### Critères d'acceptation\n\n1. QUAND la comptabilité dépose la facture mensuelle de commission d'un vendeur au format PDF, LE SYSTÈME DOIT la rendre téléchargeable dans l'espace vendeur de ce vendeur. _Source : B09-D2, B09-D3_\n2. LE SYSTÈME DOIT lister les factures de commission du vendeur par mois, de la plus récente à la plus ancienne. _Source : B09-D2_\n3. LE SYSTÈME DOIT restituer au téléchargement le fichier PDF déposé par la comptabilité, identique octet pour octet. _Source : B09-D3_\n4. SI une facture déposée ne peut être rattachée à aucun vendeur, ALORS LE SYSTÈME DOIT la refuser, ne pas la publier et signaler le refus à la comptabilité. _Source : B09-D3_\n\n### Exigence 3 : calcul du taux de retard d'expédition (lot 1a)\n\n**User story :** En tant que membre de la direction marketplace, je veux un calcul unique du taux de retard d'expédition, afin que les alertes aux vendeurs et aux chargés de compte reposent sur la même mesure.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT calculer le taux de retard d'expédition de chaque vendeur selon une définition unique du retard d'expédition, enregistrée et versionnée dans les paramètres, et commune à toutes les règles d'alerte. _Source : B09-D5, B09-D13, H25_\n2. LE SYSTÈME DOIT calculer le taux sur la fenêtre propre à chaque règle d'alerte : 30 jours glissants pour la règle des chargés de compte, 7 jours pour la règle du vendeur. _Source : B09-D5, B09-D13, H25_\n3. LE SYSTÈME DOIT recalculer les taux de tous les vendeurs à la fréquence paramétrée. _Source : B09-D12, H25_\n4. LE SYSTÈME DOIT permettre à un administrateur de la direction marketplace de modifier le seuil, la fenêtre et le destinataire de chaque règle d'alerte sans nouvelle mise en production. _Source : H25_\n5. LE SYSTÈME DOIT conserver pour chaque calcul le vendeur, la fenêtre, le nombre de commandes en retard, le nombre de commandes prises en compte, le taux obtenu et la version de la définition appliquée. _Source : H25_\n6. SI aucune définition du retard d'expédition n'est enregistrée, ALORS LE SYSTÈME DOIT refuser l'activation des règles d'alerte. _Source : H25_\n\n### Exigence 4 : alerte au vendeur (lot 1a)\n\n**User story :** En tant que chargé de compte, je veux que le vendeur soit alerté dès que son taux de retard dépasse 5 % sur 7 jours, afin qu'il corrige ses délais d'expédition et que la qualité de service se maintienne.\n\n#### Critères d'acceptation\n\n1. QUAND le taux de retard d'expédition d'un vendeur calculé sur 7 jours devient strictement supérieur à 5 %, LE SYSTÈME DOIT émettre une alerte à ce vendeur. _Source : B09-D12, B09-D13, H25_\n2. LE SYSTÈME DOIT afficher l'alerte dans l'espace vendeur et l'envoyer par les autres canaux paramétrés pour la règle. _Source : B09-D12, H25_\n3. LE SYSTÈME DOIT indiquer dans l'alerte le taux constaté, le seuil, la fenêtre de calcul, le nombre de commandes en retard et la liste de ces commandes. _Source : B09-D12_\n4. QUAND une alerte est émise à un vendeur, LE SYSTÈME DOIT la rendre visible au chargé de compte de ce vendeur. _Source : B09-D12_\n\n### Exigence 5 : alerte aux chargés de compte (lot 1b)\n\n**User story :** En tant que chargé de compte, je veux être alerté quand un vendeur dépasse 2 % de commandes expédiées en retard sur 30 jours glissants, afin d'intervenir auprès de lui.\n\n#### Critères d'acceptation\n\n1. QUAND le taux de retard d'expédition d'un vendeur calculé sur 30 jours glissants devient strictement supérieur à 2 %, LE SYSTÈME DOIT émettre une alerte au chargé de compte de ce vendeur. _Source : B09-D4, B09-D5, H25_\n2. LE SYSTÈME DOIT présenter au chargé de compte la liste de ses vendeurs en alerte, triée par taux décroissant, avec le taux, la fenêtre et la date du début du dépassement. _Source : B09-D4_\n3. SI aucun chargé de compte n'est rattaché au vendeur, ALORS LE SYSTÈME DOIT adresser l'alerte au destinataire de repli paramétré par la direction marketplace. _Source : B09-D4, H25_\n\n### Exigence 6 : demande de modification de l'IBAN par le vendeur (lot 1a)\n\n**User story :** En tant que vendeur, je veux modifier mon IBAN moi-même dans l'espace vendeur, afin d'éviter l'échange par e-mail avec mon chargé de compte et de recevoir mes reversements plus vite.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT permettre au vendeur de saisir une demande de modification de son IBAN dans son espace vendeur. _Source : B09-D6, H24_\n2. SI l'IBAN saisi n'a pas une structure et une clé de contrôle valides, ALORS LE SYSTÈME DOIT refuser la saisie et indiquer l'erreur au vendeur. _Source : B09-D6_\n3. PENDANT QUE la demande est en attente de double validation, LE SYSTÈME DOIT continuer à utiliser l'IBAN en vigueur pour les reversements. _Source : B09-D7, H24_\n4. LE SYSTÈME DOIT afficher au vendeur l'état de sa demande : en attente de validation, validée ou refusée. _Source : H24_\n5. QUAND une demande est refusée, LE SYSTÈME DOIT informer le vendeur du refus et lui indiquer que l'IBAN en vigueur reste utilisé. _Source : H24_\n\n### Exigence 7 : double validation interne des coordonnées bancaires (lot 1a)\n\n**User story :** En tant que responsable de la finance, je veux qu'aucune modification de coordonnées bancaires ne prenne effet sans double validation interne, afin de lutter contre la fraude.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME NE DOIT PAS appliquer une modification de coordonnées bancaires avant sa validation par deux collaborateurs internes distincts. _Source : B09-D7, H24_\n2. SI un collaborateur qui a déjà validé une demande tente de donner la seconde validation, ALORS LE SYSTÈME DOIT refuser cette validation. _Source : B09-D7_\n3. LE SYSTÈME DOIT réserver la validation des demandes aux collaborateurs dotés du rôle de valideur, attribué selon les règles fixées par la finance. _Source : B09-D7, H24_\n4. QUAND la seconde validation est donnée, LE SYSTÈME DOIT faire du nouvel IBAN l'IBAN en vigueur pour les reversements suivants et en informer le vendeur. _Source : H24_\n5. QUAND un valideur refuse une demande, LE SYSTÈME DOIT clore la demande, enregistrer le motif et conserver l'IBAN en vigueur. _Source : B09-D7, H24_\n6. LE SYSTÈME DOIT journaliser chaque saisie, validation et refus d'une demande de modification d'IBAN, avec l'auteur, l'horodatage et l'identifiant de la demande, sans IBAN en clair dans le journal. _Source : B09-D7, CT-10_\n\n### Exigence 8 : détail des reversements (lot 2)\n\n**User story :** En tant que vendeur, je veux comprendre de quoi se compose chaque reversement, afin de rapprocher les montants reçus de mes ventes sans solliciter mon chargé de compte.\n\n#### Critères d'acceptation\n\n1. QUAND un vendeur consulte ses reversements, LE SYSTÈME DOIT lister chaque reversement avec sa date et son montant. _Source : B09-D18_\n2. QUAND un vendeur ouvre un reversement, LE SYSTÈME DOIT afficher le détail ligne à ligne des éléments qui le composent, dont la somme est égale au montant reversé. _Source : B09-D18_\n3. LE SYSTÈME DOIT associer à chaque ligne de détail un libellé explicatif et, pour une ligne de commission, un lien vers la facture de commission correspondante. _Source : B09-D18, B09-D2_\n4. SI la somme des lignes de détail diffère du montant reversé, ALORS LE SYSTÈME DOIT ne pas afficher ce détail au vendeur et signaler l'écart à la finance. _Source : B09-D18_\n\n### Exigence 9 : réponses aux questions des clients (lot 2)\n\n**User story :** En tant que vendeur, je veux répondre aux questions des clients depuis l'espace vendeur, afin d'améliorer leur satisfaction.\n\n#### Critères d'acceptation\n\n1. QUAND un client adresse une question à un vendeur, LE SYSTÈME DOIT la présenter à ce vendeur dans son espace vendeur. _Source : B09-D14_\n2. QUAND le vendeur répond depuis l'espace vendeur, LE SYSTÈME DOIT transmettre la réponse au client par le canal retenu, Comptoir ou messagerie dédiée. _Source : B09-D14_\n3. LE SYSTÈME DOIT conserver l'historique de chaque échange (messages, auteurs, horodatages) et l'afficher au vendeur. _Source : B09-D14_\n4. OÙ le canal Comptoir est retenu, LE SYSTÈME DOIT rendre les échanges entre vendeurs et clients consultables par le service client dans Comptoir. _Source : B09-D14_\n5. LE SYSTÈME DOIT limiter les données du client visibles par le vendeur à la liste validée par la DPO. _Source : B09-D14, CT-01_\n6. SI l'avis de la DPO sur ce traitement n'est pas enregistré, ALORS LE SYSTÈME DOIT maintenir la fonction désactivée. _Source : CT-01_\n7. LE SYSTÈME DOIT supprimer les échanges au terme de la durée de conservation paramétrée, fixée avec la DPO. _Source : CT-01_\n\n### Exigence 10 : ouverture aux vendeurs européens (lots 1a et 2)\n\n**User story :** En tant que membre de la direction marketplace, je veux ouvrir l'espace vendeur aux vendeurs européens, en commençant par l'Allemagne et l'Espagne, afin de développer la marketplace.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT stocker les textes des écrans, des alertes et des e-mails de l'espace vendeur hors du code, de sorte qu'une langue s'ajoute sans développement. _Source : CT-11, H26_\n2. LE SYSTÈME DOIT proposer l'espace vendeur en français en V1. _Source : H26_\n3. OÙ une langue supplémentaire est activée, LE SYSTÈME DOIT permettre au vendeur de la choisir et l'appliquer aux écrans, aux alertes et aux e-mails qu'il reçoit. _Source : B09-D15, CT-11, H26_\n4. SI un texte n'existe pas dans la langue choisie par le vendeur, ALORS LE SYSTÈME DOIT afficher le texte français. _Source : H26_\n5. LE SYSTÈME DOIT permettre d'ouvrir l'espace vendeur pays par pays, selon le pays d'établissement du vendeur, par paramétrage et sans développement. _Source : B09-D15, B09-D16_\n6. LE SYSTÈME DOIT proposer l'Allemagne et l'Espagne parmi les pays activables dès la première ouverture hors de France. _Source : B09-D16_\n7. LE SYSTÈME DOIT accepter les IBAN de tous les pays ouverts aux vendeurs, dont l'Allemagne et l'Espagne. _Source : B09-D6, B09-D16_\n\n### Exigence 11 : tableau de bord vendeur sur mobile (lot 2)\n\n**User story :** En tant que vendeur, je veux consulter mon tableau de bord sur mobile, afin de suivre mon activité en déplacement.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT proposer sur smartphone le tableau de bord vendeur, avec les mêmes chiffres de ventes (exigence 1) et les mêmes alertes (exigence 4) que sur ordinateur. _Source : B09-D19, CT-09_\n2. LE SYSTÈME DOIT afficher le tableau de bord vendeur sur un écran de smartphone sans défilement horizontal. _Source : B09-D19, CT-09_\n3. LE SYSTÈME DOIT rendre conformes au RGAA les écrans destinés aux vendeurs créés ou modifiés par ce projet. _Source : CT-09_\n\n### Exigence 12 : exigences non fonctionnelles\n\n**User story :** En tant que DSI, je veux un espace vendeur cloisonné, hébergé dans l'UE et traçable, afin de protéger les données des vendeurs et des clients.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT limiter l'accès de chaque vendeur à ses propres ventes, factures, alertes, reversements, coordonnées bancaires et échanges avec les clients. _Source : B09-D1, B09-D2, B09-D6_\n2. LE SYSTÈME DOIT être hébergé dans l'Union européenne. _Source : CT-08_\n3. LE SYSTÈME DOIT journaliser chaque action réalisée par un collaborateur d'Orvanne pour le compte d'un vendeur, avec l'auteur, l'action, l'objet et l'horodatage. _Source : CT-10_\n4. LE SYSTÈME DOIT respecter, sur les écrans créés par ce projet, le seuil de temps de réponse fixé dans la spec bugfix P08. _Source : H27_\n5. LE SYSTÈME NE DOIT PAS utiliser de données de production non anonymisées dans les environnements de recette et de démonstration. _Source : CT-04_\n6. LE SYSTÈME DOIT journaliser chaque modification de la définition du retard d'expédition et des règles d'alerte, avec l'auteur, l'horodatage, l'ancienne et la nouvelle valeur. _Source : H25_\n\n## Hors périmètre\n\n- Suivi des retours et des litiges par le vendeur, MKP-06 (`B09-D8`) : il dépend du circuit des retours marketplace, prévu en V2 du portail de retours (conflit `C11`, hypothèse `H10`). Renvoyé vers P02.\n- Export des ventes en erreur au-delà de 50 000 lignes, MKP-07 (`B09-D9`) : défaut de l'existant. Renvoyé vers P08.\n- Index sur la table des lignes de commande et export asynchrone, MKP-07 (`B09-D10`, `B09-D11`) : solutions techniques proposées par la DSI, traitées comme pistes de conception dans la spec bugfix. Renvoyées vers P08.\n- Lenteur de l'espace vendeur, MKP-11 (`B09-D17`) : défaut de l'existant, à mesurer puis corriger. Renvoyé vers P08. Le seuil qui en sortira s'applique aussi aux nouveaux écrans (critère 12.4). La seconde partie de MKP-11, la compréhension des reversements (`B09-D18`), est traitée ici (exigence 8).\n- Échéances exprimées (`B09-D1` « T1 2027 », `B09-D4` « fin mars », `B09-D6` « ASAP », `B09-D12` « 15/01/2027 », `B09-D14` « S1 2027 », `B09-D15` « 2027 », `B09-D19` « T2 2027 ») : ce ne sont pas des exigences du système. Elles déterminent le découpage en lots de l'introduction et de `tasks.md`.\n- Choix entre une application mobile et un site adapté pour MKP-12 : décision de conception, proposée dans `design.md` (site adapté) et soumise à la question Q-P07-7.\n- Inscription, contrat et fiscalité des vendeurs européens : non décrits dans les sources (B09-F12). Aucun projet ne les reprend à ce stade (question Q-P07-6).\n\n## Hypothèses\n\n| Id | Hypothèse | Conflit | Réversible |\n|---|---|---|---|\n| H10 | La V1 exclut les articles marketplace : le portail les affiche comme non éligibles avec un renvoi vers le circuit actuel. Les retours marketplace (circuit vendeur, étiquettes distinctes) et leur suivi par le vendeur (MKP-06) forment la V2. | C11 | oui |\n| H24 | Le vendeur saisit son nouvel IBAN dans l'espace vendeur. Le changement ne prend effet qu'après une double validation interne ; d'ici là, l'ancien IBAN reste utilisé et le vendeur voit l'état de sa demande. | C25 | oui |\n| H25 | Deux règles d'alerte distinctes et paramétrables (seuil, fenêtre, destinataire) : 2 % sur 30 jours glissants pour les chargés de compte, 5 % sur 7 jours pour le vendeur. Elles reposent sur une même définition du retard d'expédition, à fournir par la direction marketplace. | C26 | oui |\n| H26 | Les textes de l'espace vendeur (écrans, e-mails) sont externalisés pour qu'une langue s'ajoute sans développement. La V1 est en français. | — | oui |\n| H27 | Pour MKP-11, la spec bugfix P08 mesure les temps de réponse de l'espace vendeur et fixe un seuil chiffré avec la direction marketplace ; ce seuil vaut aussi pour les écrans de P07. | — | oui |\n\n## Questions ouvertes\n\nLes questions `Qnn` viennent de `work/analyse.json`. Les questions `Q-P07-n` sont nées de la rédaction : elles n'existent pas encore dans l'analyse et sont à y ajouter par l'analyste, qui leur attribuera un identifiant définitif.\n\n| Id | Question | Destinataire | Bloquante |\n|---|---|---|---|\n| Q25 | Un IBAN saisi par le vendeur puis validé par deux personnes en interne respecte-t-il MKP-05 ? Qui sont les deux valideurs ? | Finance (DAF) ; direction marketplace | non (rôle de valideur du critère 7.3 à paramétrer avant la recette du lot 1a) |\n| Q26 | Qu'est-ce qu'une commande « expédiée en retard » pour un vendeur ? Les deux alertes (2 % sur 30 jours, 5 % sur 7 jours) doivent-elles coexister ? | Direction marketplace | non dans l'analyse ; la définition est requise avant le développement du calcul (exigence 3, tâche 1.3) |\n| Q11 | Les retours marketplace entrent-ils en V1 ou en V2 du portail de retours ? Qui fournit les étiquettes et le circuit vers les vendeurs ? | Direction de l'expérience client ; direction marketplace ; Yanis Mercadier | non (MKP-06, hors périmètre) |\n| Q27 | Dans quelles langues proposer l'espace vendeur (anglais, allemand, espagnol) ? Pour quelle version ? | Direction marketplace | non (critère 10.3) |\n| Q34 | L'hébergement dans le cloud d'Orvanne s'applique-t-il à tous les projets, ou un hébergement dans l'UE chez un éditeur est-il admis ? | DSI (comité d'architecture) | non |\n| Q35 | La conformité RGAA s'applique-t-elle à l'espace vendeur ? | DSI (comité d'architecture) | non (critère 11.3 appliqué par défaut) |\n| Q36 | Quand la DPO peut-elle examiner les traitements de P07 (coordonnées bancaires, échanges vendeur-client) ? Lesquels exigent une analyse d'impact ? | Hélène Marsac | non (prérequis des lots 1a et 2) |\n| Q-P07-1 | Par quel canal le vendeur répond-il aux clients : Comptoir ou une messagerie dédiée (B09-F10) ? Les questions portent-elles sur une commande, sur un article avant achat, ou les deux ? Le service client doit-il voir les échanges ? | Direction marketplace ; service client (Yanis Mercadier) | oui (conception de l'exigence 9, lot 2) |\n| Q-P07-2 | Quel système porte l'espace vendeur aujourd'hui (B09-F15) ? D'où viennent les données de ventes, d'expédition des vendeurs et de reversements ? Combien de vendeurs actifs, et combien de commandes marketplace par jour, pic compris ? | DSI ; direction marketplace | non pour la spec ; oui pour l'architecture détaillée et le dimensionnement (tâche 1.2) |\n| Q-P07-3 | Le montant des ventes s'entend-il TTC ou HT, net des annulations et des retours ? La semaine et le mois sont-ils calendaires ? | Direction marketplace | non (critère 1.1) |\n| Q-P07-4 | De quoi se compose un reversement (ventes, commission, retenues, autres) et quel système le calcule ? Qu'est-ce que les vendeurs ne comprennent pas aujourd'hui ? | Finance ; direction marketplace | non (contenu du critère 8.3) |\n| Q-P07-5 | Comment la comptabilité transmet-elle les factures PDF (dépôt, nommage, identifiant du vendeur) ? Sur combien de mois les factures restent-elles consultables ? | Comptabilité | non (critère 2.1) |\n| Q-P07-6 | Que suppose l'ouverture aux vendeurs européens au-delà de la langue et de l'IBAN (inscription, contrat, fiscalité, factures) ? | Direction marketplace ; finance | non (hors périmètre à ce stade) |\n| Q-P07-7 | Pour MKP-12, un site adapté au mobile suffit-il, ou une application est-elle attendue (B09-F11) ? | Direction marketplace | non (proposition : site adapté) |\n| Q-P07-8 | Par quels canaux alerter le vendeur (espace vendeur, e-mail) ? Faut-il répéter l'alerte tant que le taux reste au-dessus du seuil ? Faut-il un nombre minimal de commandes pour calculer un taux ? Où est enregistré le rattachement d'un vendeur à son chargé de compte ? | Direction marketplace ; chargés de compte | non (critères 4.2 et 5.3 paramétrables) |\n", "design.md": "# Conception : évolutions de l'espace vendeur de la marketplace\n\n## Vue d'ensemble\n\nLe projet étend l'espace vendeur existant (système porteur à identifier, `Q-P07-2`) avec des services séparés par domaine :\n\n- un **service ventes** qui calcule les chiffres du jour, de la semaine et du mois à partir des mêmes données que l'export des ventes corrigé par P08 (lot 1b) ;\n- un **service factures** qui publie les PDF déposés par la comptabilité (lot 1b) ;\n- un **moteur de taux de retard** et un **service d'alertes**, avec une définition unique du retard d'expédition et deux règles paramétrées (lots 1a et 1b) ;\n- un **service coordonnées bancaires** qui reçoit les demandes de modification d'IBAN et applique la double validation interne (lot 1a) ;\n- des **connecteurs** vers le système de reversement de la finance et vers le canal des questions clients (lot 2) ;\n- un **catalogue de textes** et un **paramétrage par pays** pour l'ouverture européenne (lots 1a et 2).\n\nChoix structurants :\n\n| Choix | Raison | Alternative écartée |\n|---|---|---|\n| Un seul calcul du taux de retard, deux règles d'alerte paramétrées (seuil, fenêtre, destinataire) | C26 n'est pas arbitré ; H25 fait coexister les deux règles sur une même définition | Deux calculs indépendants : les vendeurs et les chargés de compte verraient des taux incohérents |\n| Demande d'IBAN par le vendeur, double validation interne, ancien IBAN en vigueur jusqu'à la seconde validation | H24 concilie MKP-04 et MKP-05 (C25) | Modification directe par le vendeur (interdite par MKP-05) ; statu quo par e-mail (MKP-04 non satisfait) |\n| Vue des ventes calculée sur la source de l'export des ventes, livrée après P08 | Mêmes chiffres partout (critère 1.4) ; P08 corrige d'abord l'accès à ces données | Nouveau flux de ventes dédié : deux sources à réconcilier |\n| Publication des PDF de la comptabilité sans les régénérer | La comptabilité produit déjà les factures (B09-D3) | Génération des factures par l'espace vendeur : double émission comptable |\n| Lecture des reversements à la volée dans le système de la finance, sans copie | Source unique pour les montants, moins de données bancaires dupliquées | Copie quotidienne des reversements dans l'espace vendeur |\n| Questions clients derrière une interface commune, avec deux adaptateurs possibles (Comptoir ou messagerie dédiée) | Le canal n'est pas arbitré (B09-F10, `Q-P07-1`) | Coder un canal avant la décision |\n| Site adapté au mobile plutôt qu'application (proposition) | Une seule base de code et les mêmes chiffres que sur ordinateur (critère 11.1) ; échéance T2 2027 | Application native : deux livraisons à maintenir (`Q-P07-7`) |\n| Textes externalisés dès le lot 1a | H26 ; évite de reprendre les écrans du lot 1a à l'ouverture européenne | Traduire plus tard en reprenant le code |\n\nLes technologies citées ci-dessous sont des **propositions** : les sources n'en imposent aucune.\n\n## Architecture\n\n```mermaid\nflowchart LR\n  subgraph Externes\n    VEN[Vendeur - navigateur ou smartphone]\n    CPTA[Comptabilité]\n    FIN[Système de reversement - finance]\n    CPT[Comptoir]\n    MSG[Messagerie dédiée - option]\n    EM[Service d'envoi e-mail]\n  end\n  subgraph Espace vendeur\n    UI[Écrans vendeur - site adapté au mobile]\n    CAT[(Catalogue de textes)]\n  end\n  subgraph Services P07\n    SV[Service ventes]\n    SF[Service factures]\n    MT[Moteur de taux de retard]\n    SA[Service d'alertes]\n    SCB[Service coordonnées bancaires]\n    CR[Connecteur reversements]\n    CQ[Connecteur questions clients]\n    PAR[(Paramètres : définition du retard, règles, pays)]\n    JRN[(Journal d'audit)]\n  end\n  BO[Back-office marketplace - SSO interne]\n  DV[(Données de ventes et d'expédition - source de l'export, Q-P07-2)]\n\n  VEN --> UI\n  UI --> CAT\n  UI --> SV\n  UI --> SF\n  UI --> SA\n  UI --> SCB\n  UI --> CR\n  UI --> CQ\n  DV --> SV\n  DV --> MT\n  CPTA -- dépôt PDF --> SF\n  MT --> PAR\n  MT -- SeuilFranchi --> SA\n  SA --> EM\n  SA --> BO\n  BO --> PAR\n  BO -- validations --> SCB\n  SCB -- IBAN validé --> FIN\n  CR -- lecture --> FIN\n  CQ --> CPT\n  CQ -.-> MSG\n  SCB --> JRN\n  BO --> JRN\n  SA --> JRN\n```\n\n## Composants et interfaces\n\n| Composant | Responsabilité | Interfaces (entrée / sortie) | Exigences | Lot |\n|---|---|---|---|---|\n| Écrans vendeur | Tableau de bord, factures, alertes, demande d'IBAN, reversements, échanges ; mise en page adaptée au smartphone ; textes lus dans le catalogue | Application web existante étendue ; authentification actuelle de l'espace vendeur | 1, 2, 4.2, 6, 8, 9, 10.3, 11 | 1a, 1b, 2 |\n| Service ventes | Agrégats du jour, de la semaine et du mois en cours ; horodatage de la dernière mise à jour | Entrée : source des données de l'export des ventes (à confirmer, `Q-P07-2`). Sortie : API REST en lecture, filtrée par vendeur | 1, 11.1, 12.1 | 1b |\n| Service factures | Réception des PDF, rattachement au vendeur, stockage, liste et téléchargement | Entrée : dépôt de la comptabilité (proposition : dossier d'échange sécurisé ou API, nommage `<id vendeur>_<AAAA-MM>.pdf`, à valider, `Q-P07-5`). Stockage objet chiffré dans l'UE. Sortie : API REST | 2, 12.1 | 1b |\n| Moteur de taux de retard | Calcul du taux de chaque vendeur sur chaque fenêtre, selon la définition versionnée ; trace de chaque calcul ; publication de l'événement `SeuilFranchi` | Entrée : commandes et dates d'expédition (`DV`), paramètres. Sortie : table `CalculTaux`, événement | 3 | 1a |\n| Service d'alertes | Application des règles ; création des alertes ; diffusion dans l'espace vendeur, par e-mail et dans le back-office ; destinataire de repli | Entrée : `SeuilFranchi`. Sortie : alertes, e-mails (service d'envoi à identifier), file des chargés de compte | 4, 5 | 1a (vendeur), 1b (chargés de compte) |\n| Back-office marketplace | Paramétrage de la définition et des règles ; liste des vendeurs en alerte ; file de validation des IBAN ; gestion des rôles de valideur ; paramétrage des pays | Application web interne, SSO, rôles `admin-marketplace`, `charge-de-compte`, `valideur-iban` | 3.4, 5.2, 7, 10.5, 12.6 | 1a, 1b, 2 |\n| Service coordonnées bancaires | Contrôle de l'IBAN (structure, clé ISO 13616, pays ouvert) ; cycle de vie de la demande ; double validation ; transmission de l'IBAN validé au système de reversement | Entrée : écrans vendeur, back-office. Sortie : API du système de reversement (à identifier avec la finance) | 6, 7, 10.7 | 1a (10.7 en lot 2) |\n| Connecteur reversements | Lecture des reversements et de leurs lignes ; contrôle de la somme ; lien vers la facture de commission | Entrée : système de reversement de la finance (`Q-P07-4`). Sortie : API REST en lecture | 8 | 2 |\n| Connecteur questions clients | Réception des questions, envoi des réponses, historique ; filtrage des données client selon la liste de la DPO | Interface commune ; adaptateur Comptoir ou adaptateur messagerie dédiée (`Q-P07-1`) | 9 | 2 |\n| Catalogue de textes | Textes des écrans, alertes et e-mails par langue ; repli sur le français | Fichiers de ressources versionnés (proposition), chargés sans mise en production de code | 10.1 à 10.4 | 1a, 2 |\n| Journal d'audit | Traces des demandes d'IBAN, validations, refus, actions pour le compte d'un vendeur, modifications de paramètres | Écriture seule pour les services ; lecture par la finance et la DSI | 7.6, 12.3, 12.6 | 1a |\n\n### Définition du retard d'expédition : proposition à soumettre (Q26)\n\nLa définition appartient à la direction marketplace (H25). En attendant sa réponse, la conception prévoit les champs suivants dans l'entité `DéfinitionRetard`, sans les activer :\n\n- **Date de référence** : date limite d'expédition de la commande (proposition : date de commande plus délai d'expédition annoncé par le vendeur). Sa source reste à identifier (`Q-P07-2`).\n- **Commande en retard** : commande expédiée après sa date limite, ou toujours non expédiée à cette date.\n- **Dénominateur** : commandes dont la date limite d'expédition tombe dans la fenêtre de calcul.\n- **Fenêtre glissante** : les N derniers jours révolus à la date du calcul.\n\nLe moteur refuse l'activation des règles tant qu'aucune version de la définition n'est validée (critère 3.6).\n\n### Paramètres des règles d'alerte\n\n| Paramètre | Règle « vendeur » | Règle « chargés de compte » | Base |\n|---|---|---|---|\n| Seuil (dépassement strict) | 5 % | 2 % | B09-D12, B09-D4 |\n| Fenêtre | 7 jours | 30 jours glissants | B09-D13, B09-D5 |\n| Destinataire | vendeur, copie visible du chargé de compte | chargé de compte, repli paramétré | B09-D12, B09-D4, H25 |\n| Canaux | espace vendeur (toujours) + e-mail (proposition) | back-office + e-mail (proposition) | `Q-P07-8` |\n| Fréquence de calcul | proposition : toutes les heures | proposition : une fois par jour | paramètre, sans source |\n| Répétition | proposition : une alerte par franchissement ; nouvelle alerte après retour sous le seuil | idem | `Q-P07-8` |\n\n## Flux principaux\n\n### Calcul du taux et alerte\n\n```mermaid\nsequenceDiagram\n  participant DV as Données de ventes\n  participant M as Moteur de taux\n  participant P as Paramètres\n  participant A as Service d'alertes\n  participant U as Espace vendeur\n  participant B as Back-office\n  M->>P: lire la définition active et les règles\n  alt aucune définition validée\n    M-->>B: règles non activables (critère 3.6)\n  else définition active\n    M->>DV: commandes du vendeur dont la date limite tombe dans la fenêtre\n    M->>M: calculer le taux, enregistrer CalculTaux (version, compteurs)\n    opt taux > seuil et pas d'alerte ouverte pour cette règle\n      M->>A: SeuilFranchi(vendeur, règle, taux)\n      alt règle vendeur\n        A->>U: afficher l'alerte (taux, seuil, fenêtre, commandes)\n        A->>B: rendre visible au chargé de compte\n      else règle chargés de compte\n        A->>B: ajouter à la liste du chargé de compte (ou du repli)\n      end\n      A->>A: e-mail selon les canaux paramétrés\n    end\n  end\n```\n\n### Modification de l'IBAN\n\n```mermaid\nsequenceDiagram\n  participant V as Vendeur\n  participant S as Service coordonnées bancaires\n  participant B as Back-office (valideurs)\n  participant F as Système de reversement\n  participant J as Journal\n  V->>S: nouvel IBAN\n  S->>S: contrôler structure, clé et pays ouvert\n  alt IBAN invalide\n    S-->>V: refus avec l'erreur (critère 6.2)\n  else IBAN valide\n    S->>J: saisie (auteur, horodatage, id demande)\n    S-->>V: état « en attente de validation » ; IBAN en vigueur inchangé\n    B->>S: validation 1 (valideur A)\n    S->>J: validation 1\n    B->>S: validation 2 (valideur B ≠ A)\n    S->>J: validation 2\n    S->>F: transmettre le nouvel IBAN\n    F-->>S: accusé de prise en compte\n    S-->>V: état « validée » ; nouvel IBAN en vigueur\n  end\n  Note over B,S: un refus à l'une des étapes clôt la demande, motif enregistré, vendeur informé\n```\n\n## Modèle de données\n\n| Entité | Attributs principaux | Donnée personnelle | Durée de conservation |\n|---|---|---|---|\n| AgrégatVentes | id vendeur, période (jour, semaine, mois), nombre de commandes, montant, horodatage de calcul | non (données d'entreprise) | recalculable ; 13 mois proposés, à confirmer |\n| FactureCommission | id vendeur, mois, fichier PDF, empreinte SHA-256, date de dépôt, déposant | non, sauf vendeur personne physique (à confirmer avec la DPO) | durée légale de conservation des pièces comptables, à confirmer avec la comptabilité |\n| DéfinitionRetard | version, date de référence, règle de retard, dénominateur, auteur, date de validation | non | conservée (traçabilité des calculs) |\n| RègleAlerte | id, seuil, fenêtre, destinataire, canaux, fréquence, active, auteur | non | conservée |\n| CalculTaux | id vendeur, règle, fenêtre, commandes en retard, commandes prises en compte, taux, version de la définition, horodatage | non | 13 mois proposés, à confirmer |\n| Alerte | id vendeur, règle, taux, date de début du dépassement, liste des id commande, destinataire, canaux, statut d'envoi | non (aucune donnée client) | 13 mois proposés, à confirmer |\n| DemandeIBAN | id demande, id vendeur, IBAN chiffré, titulaire, pays, état, valideur 1, valideur 2, motif de refus, horodatages | oui si le vendeur est une personne physique ; donnée sensible pour la fraude dans tous les cas | à fixer avec la finance et la DPO (CT-01) |\n| ÉchangeClient | id échange, id vendeur, id commande ou article, messages, auteurs, horodatages, statut de transmission | oui (contenu et identité du client) | paramétrable, fixée avec la DPO (critère 9.7) ; intégrée au registre des droits (P05) |\n| ParamètrePays | code pays, ouvert, date d'ouverture, langues proposées | non | conservé |\n| TexteTraduit | clé, langue, texte, version | non | conservé |\n| Journal | auteur, rôle, action, objet, horodatage, ancienne et nouvelle valeur (hors IBAN) | oui (identifiant de l'employé) | 1 an proposé, à confirmer avec la DPO |\n\nLes reversements ne sont pas copiés : ils sont lus dans le système de la finance à chaque consultation.\n\n## Gestion des erreurs\n\n| Situation | Comportement | Exigence |\n|---|---|---|\n| Source des données de ventes indisponible | Affichage des derniers chiffres calculés avec leur horodatage et un bandeau « données en cours de mise à jour » | 1.3 |\n| Écart entre le tableau de bord et l'export sur une même période | Test de cohérence quotidien ; écart signalé à la supervision | 1.4 |\n| Facture déposée sans vendeur identifiable | Refus, fichier non publié, signalement à la comptabilité | 2.4 |\n| Fichier déposé qui n'est pas un PDF lisible | Refus et signalement à la comptabilité | 2.1 |\n| Aucune définition du retard validée | Règles non activables ; message explicite dans le back-office | 3.6 |\n| Date d'expédition ou date limite absente pour une commande | Commande exclue du calcul et comptée à part dans `CalculTaux` ; signalement à la supervision | 3.5 |\n| Calcul interrompu | Reprise au prochain passage ; aucune alerte émise sur un calcul partiel | 3.3 |\n| Échec d'envoi de l'e-mail d'alerte | 3 nouvelles tentatives avec délai croissant ; l'alerte reste affichée dans l'espace vendeur | 4.2 |\n| Aucun chargé de compte rattaché au vendeur | Alerte adressée au destinataire de repli | 5.3 |\n| IBAN invalide (structure, clé) ou pays non ouvert | Refus à la saisie, message dans la langue du vendeur | 6.2, 10.7 |\n| Valideur identique pour les deux validations | Seconde validation refusée | 7.2 |\n| Collaborateur sans rôle de valideur | Action refusée et journalisée | 7.3 |\n| Système de reversement indisponible après la seconde validation | Demande « validée, en cours d'application » ; l'IBAN en vigueur reste l'ancien jusqu'à l'accusé de prise en compte ; nouvelles tentatives et alerte à la finance | 6.3, 7.4 |\n| Somme des lignes d'un reversement différente du montant | Détail masqué au vendeur (montant seul affiché), écart signalé à la finance | 8.4 |\n| Canal des questions clients indisponible | Réponse conservée avec le statut « non transmise », nouvelles tentatives, statut visible du vendeur | 9.2 |\n| Avis de la DPO absent pour les échanges clients | Fonction désactivée par un verrou du back-office | 9.6 |\n| Texte absent dans la langue du vendeur | Texte français affiché ; clé manquante signalée | 10.4 |\n| Temps de réponse supérieur au seuil fixé dans P08 | Alerte de supervision | 12.4 |\n\n## Sécurité et RGPD\n\n- **Avant le développement (CT-01, Q36) :** soumettre à la DPO :\n  - les coordonnées bancaires et le titulaire du compte, quand le vendeur est une personne physique ;\n  - les échanges entre vendeurs et clients, et la liste des données du client visibles par le vendeur (critère 9.5) ;\n  - les durées de conservation du modèle de données ;\n  - le journal d'audit (identifiants des employés).\n- **Coordonnées bancaires (MKP-05) :** propositions à valider avec la finance (`Q25`) :\n  - IBAN chiffré au repos, avec des clés gérées par le service de gestion de clés de la plateforme ;\n  - IBAN masqué à l'affichage, seuls les 4 derniers caractères étant visibles ;\n  - nouvelle authentification du vendeur avant la saisie d'un IBAN ;\n  - e-mail au contact connu du vendeur à chaque demande et à chaque application, pour détecter une demande frauduleuse ;\n  - authentification à deux facteurs pour les valideurs ;\n  - aucun IBAN en clair dans les journaux (critère 7.6).\n- **Cloisonnement (critère 12.1) :** l'identifiant du vendeur est lu dans le jeton de session, jamais dans un paramètre de la requête. Des tests d'accès croisé font partie de la recette.\n- **Actions pour le compte d'un vendeur (CT-10) :** toute action d'un chargé de compte ou d'un valideur est journalisée (critère 12.3).\n- **Hébergement (CT-08) :** dans l'Union européenne ; le choix entre le cloud d'Orvanne et un éditeur hébergé dans l'UE dépend de `Q34`.\n- **Accessibilité et mobile (CT-09) :** les nouveaux écrans visent la conformité au RGAA par défaut, en attendant `Q35`.\n- **Langues (CT-11) :** textes externalisés dès le lot 1a (H26).\n- **Données de test (CT-04) :** jeux synthétiques uniquement, y compris pour les IBAN (IBAN de test valides mais fictifs).\n- **Gel (CT-07) :** aucune mise en production du 16 novembre au 11 janvier.\n- **Droits des personnes :** les échanges vendeur-client sont un nouveau stockage de données clients, à intégrer à l'orchestration des droits de P05.\n\n## Volumétrie et performance\n\n| Grandeur | Valeur | Base |\n|---|---|---|\n| Lignes d'un export de ventes qui échoue aujourd'hui | au-delà de 50 000 | B09-N5 |\n| Vendeurs à l'origine de MKP-04 | top 20 | B09-N6 |\n| Seuils et fenêtres des alertes | 2 % sur 30 jours glissants ; 5 % sur 7 jours | B09-N1 à B09-N4 |\n| Part des demandes de retour portant sur la marketplace | 35 % | B04-N7 |\n| Effet du pic de fin d'année | environ ×2 sur les volumes | glossaire (B01, B02) |\n| Nombre de vendeurs actifs, commandes marketplace par jour | inconnus | `Q-P07-2` |\n\nLes sources ne donnent ni le nombre de vendeurs ni le volume de commandes de la marketplace. Le dimensionnement repose donc sur des **valeurs de travail, sans source**, à remplacer par la réponse à `Q-P07-2` :\n\n- un vendeur « gros volume » avec 100 000 lignes de commande sur 30 jours (2 fois le seuil de B09-N5, pour couvrir le pic) ;\n- 10 000 vendeurs pour le calcul des taux, valeur volontairement haute.\n\nLe calcul des taux est linéaire en nombre de commandes sur 30 jours. Il s'appuie sur un index (vendeur, date limite d'expédition) et ne lit que la fenêtre utile. Le service ventes sert des agrégats précalculés, pour ne pas reproduire la lenteur traitée par P08. Le seuil de temps de réponse des nouveaux écrans est celui que fixera P08 (H27).\n\n## Stratégie de test\n\n| Niveau | Contenu | Exigences |\n|---|---|---|\n| Unitaire | Agrégats jour, semaine, mois aux bornes (minuit, lundi, 1er du mois) ; calcul du taux aux bornes (exactement 5 % et 2 % : pas d'alerte ; 5,01 % et 2,01 % : alerte) ; fenêtres de 7 et 30 jours ; refus sans définition ; contrôle de l'IBAN (clé fausse, pays non ouvert, IBAN allemand et espagnol valides) ; cycle de vie de la demande d'IBAN ; contrôle de somme des reversements ; repli de langue | 1.1, 3, 4.1, 5.1, 6.2, 7, 8.4, 10.4, 10.7 |\n| Intégration | Dépôt de factures par la comptabilité (fichier valide, orphelin, non PDF) ; transmission de l'IBAN au système de reversement et indisponibilité de celui-ci ; lecture des reversements ; adaptateur du canal des questions retenu ; envoi des e-mails d'alerte | 2, 4.2, 7.4, 8, 9 |\n| Sécurité | Accès croisé entre deux vendeurs sur chaque API ; validation par un collaborateur sans rôle ; double validation par la même personne ; absence d'IBAN en clair dans les journaux et les traces techniques | 7.2, 7.3, 7.6, 12.1, 12.3 |\n| Cohérence | Tableau de bord et export des ventes sur 30 périodes tirées au hasard dans le jeu synthétique | 1.4 |\n| Performance | Calcul des taux de 10 000 vendeurs, dont un à 100 000 lignes sur 30 jours ; temps de réponse des écrans comparé au seuil de P08 | 3.3, 12.4 |\n| Accessibilité et mobile | Audit RGAA des nouveaux écrans ; tableau de bord sur smartphone sans défilement horizontal (proposition : largeur de 360 px) | 11.2, 11.3 |\n| Recette métier | Finance : double validation sur une demande synthétique. Chargés de compte : liste des vendeurs en alerte. Vendeurs pilotes : tableau de bord, factures, reversements. Comptabilité : dépôt des factures d'un mois | 1, 2, 4, 5, 6, 7, 8 |\n| Données | Jeux synthétiques uniquement (CT-04) | 12.5 |\n", "tasks.md": "# Plan d'implémentation : évolutions de l'espace vendeur de la marketplace\n\nLe plan suit les trois lots de `requirements.md`. Aucune mise en production n'a lieu pendant le gel du 16 novembre au 11 janvier (CT-07). Le développement peut se poursuivre pendant le gel.\n\n- **Lot 1a** (tâches 1 à 6) : taux de retard, alerte au vendeur, modification encadrée de l'IBAN. Mise en production au plus tôt le 12 janvier 2027, pour l'échéance de MKP-08 du 15/01/2027.\n- **Lot 1b** (tâches 7 et 8) : vue des ventes, factures de commission, alerte aux chargés de compte. Mise en production au T1 2027, après les correctifs de P08 (MKP-03 : « fin mars »).\n- **Lot 2** (tâches 9 à 13) : reversements, questions des clients, ouverture européenne, mobile. S1 et T2 2027.\n\n- [ ] 1. Prérequis et cadrage (aucune dépendance ; tâches parallélisables)\n  - [ ] 1.1 Soumettre à la DPO les traitements de P07 : coordonnées bancaires des vendeurs personnes physiques, échanges vendeur-client et données du client visibles par le vendeur, journal, durées de conservation (CT-01, Q36)\n    - Livrable : avis écrit de la DPO, liste des données du client autorisées, durées de conservation\n    - _Exigences : 9.5, 9.6, 9.7_\n  - [ ] 1.2 Identifier avec la DSI le système qui porte l'espace vendeur, la source des données de ventes et d'expédition, le système de reversement, le rattachement vendeur - chargé de compte et les volumes réels, pic compris (Q-P07-2, Q-P07-8)\n    - Livrable : contrats d'interface et fiche de volumétrie remplaçant les valeurs de travail de `design.md`\n    - _Exigences : 1.4, 3.3, 5.3, 7.4_\n  - [ ] 1.3 Obtenir de la direction marketplace la définition du retard d'expédition (Q26) et de la finance les règles d'attribution du rôle de valideur (Q25)\n    - Livrable : définition validée, prête à saisir comme version 1 de `DéfinitionRetard` ; liste des rôles de valideur\n    - _Exigences : 3.1, 7.3_\n  - [ ] 1.4 Fixer avec la comptabilité le mode de dépôt des factures PDF, leur nommage et la profondeur d'historique (Q-P07-5)\n    - Livrable : contrat de dépôt des factures\n    - _Exigences : 2.1_\n  - [ ] 1.5 Constituer un jeu de données synthétique : 10 000 vendeurs dont un à 100 000 lignes sur 30 jours, cas aux bornes des seuils, IBAN de test fictifs français, allemands et espagnols, factures PDF de test (CT-04)\n    - _Exigences : 12.5_\n  - [ ] 1.6 Faire confirmer par le comité d'architecture l'h
