lerte au vendeur au-delà de 5 % sur 7 jours"}], "gravite": "mineur", "arbitre": "Direction marketplace", "hypothese": "H25", "question": "Q26"}], "hypotheses": [{"id": "H01", "enonce": "Le canal de l'alerte est un paramètre. La V1 envoie un e-mail à tous les clients concernés. Le SMS n'est activé qu'après analyse de la DPO (CT-02) et accord budgétaire, pour les seuls clients dont le mobile est connu.", "justification": "Couvre les clients sans mobile (B02-D5), respecte CT-02, et le passage au SMS ne demande pas de refonte.", "conflit": "C01", "reversible": true}, {"id": "H02", "enonce": "Le seuil de retard est un paramètre calculé à partir de la date promise affichée sur Vitrine, avec deux niveaux : « à surveiller » à J+1 matin (liste du service client, tableau de bord) et « en retard » à J+2, soit 48 h (alerte au client). La signification des « rouges » (B01-D4) reste à définir.", "justification": "Répond aux deux usages sans trancher à la place des métiers ; l'alerte client à J+2 limite les messages pour des colis livrés le lendemain.", "conflit": "C02", "reversible": true}, {"id": "H03", "enonce": "L'alerte part automatiquement (B01-D8). Le service client reçoit chaque matin, avant les envois du jour, la liste des commandes concernées (B02-D15), ce qui répond à B02-D14. Aucune alerte si un dossier est ouvert dans Comptoir (B02-D7). La validation préalable pour les clients Premium (B02-D8) est une option paramétrable, désactivée tant que la catégorie Premium n'est pas définie.", "justification": "Concilie l'automatisation et l'information du service client ; la catégorie Premium n'existe dans aucune source (B02-F1).", "conflit": "C04", "reversible": true}, {"id": "H04", "enonce": "Le tableau de bord est rafraîchi à chaque arrivée de statuts dans Passerelle et affiche l'heure de la dernière mise à jour. La fréquence cible est fixée après mesure de la fraîcheur des statuts des 3 transporteurs.", "justification": "Évite de promettre un temps réel que la source quotidienne ne permet pas (B01-F1, B01-F4).", "conflit": "C05", "reversible": true}, {"id": "H05", "enonce": "Le retard est évalué par colis. Le client reçoit au plus un message par commande, qui liste les colis en retard.", "justification": "Conserve la descente jusqu'au colis (B01-D3) sans multiplier les messages pour une même commande.", "conflit": "C06", "reversible": true}, {"id": "H06", "enonce": "L'alerte de retard ne contient ni code promo ni offre commerciale. Une éventuelle offre relève d'un message marketing distinct, hors P01, soumis aux règles de consentement.", "justification": "CT-03 est une règle de conformité émise par la DPO et reprise par le service client (B02-D10).", "conflit": "C07", "reversible": true}, {"id": "H07", "enonce": "Le déclencheur du remboursement est un paramètre (premier scan transporteur, réception en entrepôt, contrôle qualité). La V1 rembourse après le contrôle qualité en entrepôt ; le statut « reçu » précède « remboursé ».", "justification": "Option la plus prudente financièrement (1 retour sur 5 non conforme, cartons vides : B04-N2, B04-N3), cohérente avec EF-06 ; le remboursement anticipé s'active par paramètre si le codir le décide.", "conflit": "C08", "reversible": true}, {"id": "H08", "enonce": "Le délai d'éligibilité est un paramètre par catégorie de client : 14 jours après livraison pour tous, 30 jours pour les membres Orvanne+.", "justification": "Aligné sur l'engagement affiché aujourd'hui sur le site (B04-D4) en attendant la relecture des CGV ; passer à 30 jours pour tous est un changement de paramètre.", "conflit": "C09", "reversible": true}, {"id": "H09", "enonce": "Les frais de retour sont un paramètre par motif, avec une valeur initiale de 0 pour tous les motifs. La retenue de 4,90 hors défaut ou erreur de préparation (B04-D7, unité supposée en euros) s'active sans développement si elle est décidée et inscrite dans les CGV.", "justification": "Une retenue absente des CGV exposerait Orvanne ; la gratuité est la position du CDC et du marketing pour le lancement.", "conflit": "C10", "reversible": true}, {"id": "H10", "enonce": "La V1 exclut les articles marketplace : le portail les affiche comme non éligibles avec un renvoi vers le circuit actuel. Les retours marketplace (circuit vendeur, étiquettes distinctes) et leur suivi par le vendeur (MKP-06) forment la V2.", "justification": "Respecte le périmètre du CDC et le circuit distinct (B04-D10) ; l'enjeu de 35 % des demandes (B04-N7) justifie une V2 planifiée.", "conflit": "C11", "reversible": true}, {"id": "H11", "enonce": "En V1, le montant remboursé ne dépend pas de la note A / B / C. Une note C déclenche un signalement pour traitement manuel par le service client, sans réduction automatique.", "justification": "La légalité d'une réduction est contestée (B04-D12) ; une réduction automatique non fondée serait difficile à rattraper auprès du client.", "conflit": "C12", "reversible": true}, {"id": "H12", "enonce": "Le portail est accessible sans compte, par numéro de commande et adresse e-mail d'achat ; un client connecté y accède aussi depuis son compte. EF-03 s'applique aux deux parcours, et l'accès sans compte ne donne accès qu'à la commande saisie.", "justification": "Préserve l'objectif O1 (moins de 3 minutes) et lève la contradiction interne du CDC (B03-F1) sans supprimer de parcours.", "conflit": "C13", "reversible": true}, {"id": "H13", "enonce": "Le portail produit, avec l'étiquette, un RMA en PDF à imprimer et placer dans le colis. Le cas du client sans imprimante reste ouvert.", "justification": "Répond au besoin de l'entrepôt de retrouver la commande (B04-D15) sans modifier l'étiquette transporteur.", "conflit": "C14", "reversible": true}, {"id": "H14", "enonce": "Le pilote est mis en service au plus tôt le 12 janvier, après le gel et après consultation de la DPO (CT-01). Si la date des soldes d'hiver ne laisse pas de fenêtre suffisante, le pilote est décalé après les soldes plutôt que mis en production pendant le gel.", "justification": "Le CDC est en relecture (v0.3) et plusieurs règles attendent le codir ; aucune mise en production n'est possible pendant le gel.", "conflit": "C15", "reversible": true}, {"id": "H15", "enonce": "La photo est facultative : une déclaration est valide sans photo. Les douchettes équipées proposent la photo ; l'ajout d'une photo depuis un autre terminal (téléphone de chef d'équipe) est prévu en V2.", "justification": "Deux tiers des douchettes de E2 n'ont pas d'appareil photo (B06-N5) ; rendre la photo obligatoire bloquerait la déclaration.", "conflit": "C16", "reversible": true}, {"id": "H16", "enonce": "Le déploiement sur E2 a lieu au plus tôt le 12 janvier, après le gel et l'avis de la DPO sur les photos (CT-06). Si l'inventaire de janvier a lieu avant, il se fait avec la fiche papier actuelle.", "justification": "Respecte CT-07 ; la date de l'inventaire n'est pas connue (B06-F12).", "conflit": "C17", "reversible": true}, {"id": "H17", "enonce": "La V1 de la relance n'utilise que l'e-mail, pour les clients ayant consenti aux communications commerciales, sous réserve que la DPO confirme la portée du consentement newsletter. SMS, notifications et messageries mobiles sont ajoutés après analyse de la DPO (CT-01, CT-02).", "justification": "Seul canal déjà utilisé pour la relance (B05-N1) ; les autres canaux supposent une analyse que le marketing a reportée (B05-F7).", "conflit": "C18", "reversible": true}, {"id": "H18", "enonce": "La personnalisation n'utilise que les commandes du Lac et, pour les clients connectés, la navigation disponible, limitées aux 3 ans précédant le dernier contact du client. L'historique depuis 2014 n'est pas exploité.", "justification": "Conforme à CT-05 et aux données réellement disponibles selon l'équipe du Lac (B05-F2).", "conflit": "C19", "reversible": true}, {"id": "H19", "enonce": "La démo du comité commerce du 8 décembre utilise des données anonymisées ou synthétiques, sur un environnement hors production. Une démo n'étant pas une mise en production, le gel ne s'y applique pas.", "justification": "CT-04 interdit les données de production non anonymisées pour une démo.", "conflit": "C20", "reversible": true}, {"id": "H20", "enonce": "La durée de créneau est un paramètre par site, ajouté aux paramètres de R4, avec 30 minutes par défaut (R2). Chaque site fixe sa valeur lors du paramétrage ; un camion complet consomme deux créneaux.", "justification": "Couvre les trois positions sans trancher la valeur, qui relève de chaque site.", "conflit": "C21", "reversible": true}, {"id": "H21", "enonce": "Le nombre de quais est saisi par site (R4) ; la valeur de E1 est celle que le chef de quai fournira pour le 04/12.", "justification": "L'écart 6 / 4 n'est pas expliqué (B08-F1) ; un paramètre évite de le figer dans la spec.", "conflit": "C22", "reversible": true}, {"id": "H22", "enonce": "R1 s'applique en V1 : toute réservation exige une commande d'achat. Pour les messageries et petits colis sans commande, le chef de quai bloque un quai sur une plage fixe (R7). Leur prise en charge dans le portail est reportée.", "justification": "Utilise une fonction déjà retenue (R7) pour libérer le quai occupé chaque matin, sans élargir le périmètre contesté.", "conflit": "C23", "reversible": true}, {"id": "H23", "enonce": "La V1 enregistre les heures prévues et réelles d'arrivée, qui alimentent l'indicateur de ponctualité. La notation des fournisseurs est en V2 ; les pénalités restent hors périmètre tant qu'elles ne sont pas décidées.", "justification": "Constitue l'année d'historique demandée par l'approvisionnement sans engager de pénalité.", "conflit": "C24", "reversible": true}, {"id": "H24", "enonce": "Le vendeur saisit son nouvel IBAN dans l'espace vendeur. Le changement ne prend effet qu'après une double validation interne ; d'ici là, l'ancien IBAN reste utilisé et le vendeur voit l'état de sa demande.", "justification": "Supprime l'échange par e-mail (MKP-04) tout en respectant la règle de la finance née de l'incident de juin (MKP-05).", "conflit": "C25", "reversible": true}, {"id": "H25", "enonce": "Deux règles d'alerte distinctes et paramétrables (seuil, fenêtre, destinataire) : 2 % sur 30 jours glissants pour les chargés de compte, 5 % sur 7 jours pour le vendeur. Elles reposent sur une même définition du retard d'expédition, à fournir par la direction marketplace.", "justification": "Les deux demandes visent des destinataires différents et peuvent coexister ; seule la définition du retard doit être commune.", "conflit": "C26", "reversible": true}, {"id": "H26", "enonce": "Les textes du portail fournisseurs et de l'espace vendeur (écrans, e-mails) sont externalisés pour qu'une langue s'ajoute sans développement. La V1 est en français.", "justification": "CT-11 : 15 % des livraisons viennent de fournisseurs étrangers (B08-N13) et l'espace vendeur s'ouvre à l'Allemagne et à l'Espagne ; les langues ne sont pas décidées.", "conflit": null, "reversible": true}, {"id": "H27", "enonce": "Pour MKP-11, la spec bugfix commence par mesurer les temps de réponse des pages de l'espace vendeur ; le comportement attendu (seuil chiffré) est fixé avec la direction marketplace à partir de cette mesure. Les solutions de la DSI pour MKP-07 (index, export asynchrone) sont des pistes de conception, pas des exigences.", "justification": "« Trop lent » n'est ni chiffré ni localisé (B09-F8) ; une spec bugfix exige un comportement attendu vérifiable.", "conflit": null, "reversible": true}, {"id": "H28", "enonce": "Le délai de déclaration des litiges transporteurs est un paramètre, avec 7 jours comme valeur provisoire ; le dossier de casse affiche la date limite de déclaration.", "justification": "Le délai n'est pas confirmé (B06-F6) et la moitié des litiges est déclarée hors délai (B06-N2).", "conflit": null, "reversible": true}, {"id": "H29", "enonce": "Le compte à rebours d'une demande de droits part de sa date de réception, en jours calendaires ; les seuils d'alerte (J+15, J+25) et l'échéance après prolongation sont des paramètres.", "justification": "Le point de départ et le traitement de la prolongation ne sont pas précisés (B07-F5, B07-F6).", "conflit": null, "reversible": true}, {"id": "H30", "enonce": "La V1 de la relance choisit le message, le moment et la remise par des règles paramétrables et explicables ; un modèle d'IA (B05-D2) vient en V2, une fois les données confirmées et l'avis de la DPO rendu.", "justification": "La nature de « l'intelligence » n'est pas tranchée (B05-F1), les données disponibles sont incertaines (B05-F2) et la démo doit être prête pour le 8 décembre.", "conflit": null, "reversible": true}, {"id": "H31", "enonce": "La V1 du registre, attendue avant le prochain contrôle interne, couvre le registre, le compte à rebours, la saisie par le service client, la preuve de clôture, l'export d'accès et le tableau de bord ; les actions dans chaque système sont tracées manuellement. L'orchestration automatisée dans Vitrine, Comptoir, Hangar, le Lac et l'outil d'e-mailing (B07-D5) vient en V2.", "justification": "L'échéance est rapprochée et le budget n'est pas arrêté (B07-F13) ; la traçabilité manuelle corrige déjà l'absence de preuve d'exécution.", "conflit": null, "reversible": true}], "questions": [{"id": "Q01", "question": "Quel canal pour l'alerte de retard : e-mail, SMS (budget, avis DPO sur l'usage du mobile), ou les deux selon la disponibilité du mobile ?", "destinataire": "Solène Garrigue, Yanis Mercadier ; avis d'Hélène Marsac", "projets": ["P01"], "bloquante": false}, {"id": "Q02", "question": "À partir de quand une commande est-elle « en retard » : J+1 matin ou 48 h après la date promise ? Le seuil peut-il différer entre la liste du service client, le tableau de bord et l'alerte client ? Que signifient les « rouges » du tableau de bord ?", "destinataire": "Solène Garrigue, Yanis Mercadier", "projets": ["P01"], "bloquante": false}, {"id": "Q03", "question": "Le pic tombe pendant le gel du 16/11 au 11/01. Une dérogation est-elle envisageable pour un tableau de bord interne, sans envoi aux clients, avant le 16/11 ? Sinon, confirmez-vous une mise en service au T1 2027 ?", "destinataire": "DSI (Bertrand Lacassagne)", "projets": ["P01"], "bloquante": true}, {"id": "Q04", "question": "Qu'est-ce qu'un client Premium (lien avec Orvanne+) ? La liste du matin suffit-elle à « savoir » qu'un message part, ou faut-il une validation ? Quel délai de validation pour les Premium, et que se passe-t-il sans validation ?", "destinataire": "Yanis Mercadier ; Capucine Lorrain pour le lien avec Orvanne+", "projets": ["P01"], "bloquante": false}, {"id": "Q05", "question": "À quelle fréquence Passerelle reçoit-elle les statuts des 3 transporteurs ? Quel délai de rafraîchissement du tableau de bord est acceptable pour la logistique ?", "destinataire": "Solène Garrigue ; DSI (équipe Passerelle)", "projets": ["P01"], "bloquante": false}, {"id": "Q06", "question": "Pour une commande à plusieurs colis, le client reçoit-il un message par colis en retard ou un seul message par commande ?", "destinataire": "Solène Garrigue, Yanis Mercadier", "projets": ["P01"], "bloquante": false}, {"id": "Q07", "question": "Confirmez-vous l'abandon du code promo dans les messages de retard (CT-03) ? Souhaitez-vous à la place un message commercial distinct, soumis au consentement ?", "destinataire": "Capucine Lorrain ; Hélène Marsac", "projets": ["P01", "P04"], "bloquante": false}, {"id": "Q08", "question": "À quel moment rembourser un retour : premier scan transporteur, réception ou contrôle en entrepôt ? Un remboursement anticipé est-il prévu pour certains clients, lesquels ?", "destinataire": "DAF, puis codir ; chiffrage par Odile (contrôle de gestion)", "projets": ["P02"], "bloquante": false}, {"id": "Q09", "question": "Quel délai de retour s'applique : 14 jours pour tous et 30 jours pour Orvanne+, ou 30 jours pour tous ? Que disent les CGV ?", "destinataire": "Direction de l'expérience client ; direction juridique et conformité", "projets": ["P02"], "bloquante": false}, {"id": "Q10", "question": "Les retours sont-ils gratuits pour tous, ou 4,90 € sont-ils retenus hors défaut et erreur de préparation ? Si la gratuité vaut « pour le lancement », jusqu'à quand ?", "destinataire": "DAF ; direction de l'expérience client ; Capucine Lorrain", "projets": ["P02"], "bloquante": false}, {"id": "Q11", "question": "Les retours marketplace (35 % des demandes) entrent-ils en V1 ou en V2 du portail ? Qui fournit les étiquettes et le circuit vers les vendeurs ?", "destinataire": "Direction de l'expérience client ; direction marketplace ; Yanis Mercadier", "projets": ["P02", "P07"], "bloquante": false}, {"id": "Q12", "question": "Est-il légal de réduire le montant remboursé selon la note de contrôle qualité (C, voire B) ? Si oui, quels montants pour A, B et C ?", "destinataire": "Direction juridique et conformité", "projets": ["P02", "P03"], "bloquante": false}, {"id": "Q13", "question": "Le portail doit-il fonctionner sans compte (§3) ou pour un client connecté (EF-03), ou les deux ? Quelle vérification pour l'accès sans compte ?", "destinataire": "Inès Rouvière ; direction de l'expérience client", "projets": ["P02"], "bloquante": false}, {"id": "Q14", "question": "Le RMA doit-il être imprimé par le client ? Que faire pour un client sans imprimante qui dépose avec un QR code ?", "destinataire": "Karim Benhaddou ; Inès Rouvière", "projets": ["P02"], "bloquante": false}, {"id": "Q15", "question": "Quelle est la date des soldes d'hiver visée, et quel est le périmètre du pilote ? Une mise en service entre le 12 janvier et les soldes est-elle réaliste après consultation de la DPO ?", "destinataire": "Inès Rouvière ; direction de l'expérience client ; DSI", "projets": ["P02"], "bloquante": false}, {"id": "Q16", "question": "La photo est-elle obligatoire pour une déclaration de casse ? Faut-il équiper les chefs d'équipe de téléphones ou renouveler des douchettes ?", "destinataire": "Karim Benhaddou ; DSI", "projets": ["P03"], "bloquante": false}, {"id": "Q17", "question": "À quelle date a lieu l'inventaire de janvier sur E2 ?", "destinataire": "Karim Benhaddou", "projets": ["P03"], "bloquante": false}, {"id": "Q18", "question": "Le consentement newsletter couvre-t-il une relance personnalisée des paniers abandonnés, les remises ciblées et chaque canal (e-mail, notifications, SMS, messageries) ? Quelle analyse faut-il avant le développement ?", "destinataire": "Hélène Marsac", "projets": ["P04"], "bloquante": false}, {"id": "Q19", "question": "Quelles données la relance peut-elle utiliser (commandes, navigation des clients connectés) et sur quelle profondeur, compte tenu de la limite de 3 ans ? Que contient réellement le Lac ?", "destinataire": "Hélène Marsac ; équipe du Lac (Théo Bazin)", "projets": ["P04"], "bloquante": false}, {"id": "Q20", "question": "Une démo sur données anonymisées ou synthétiques convient-elle au comité commerce du 8 décembre ? Qu'attendez-vous précisément de la démo ?", "destinataire": "Capucine Lorrain ; Hélène Marsac", "projets": ["P04"], "bloquante": false}, {"id": "Q21", "question": "La durée de créneau peut-elle être fixée par site ? Quelle valeur pour E1 (30 minutes ou une heure) et pour E2 ?", "destinataire": "Grégory Thibaudeau ; Rémi Vasseur ; Karim Benhaddou", "projets": ["P06"], "bloquante": false}, {"id": "Q22", "question": "E1 a 6 quais de réception aujourd'hui, le paramétrage cible en indique 4 : pourquoi cet écart ?", "destinataire": "Rémi Vasseur", "projets": ["P06"], "bloquante": false}, {"id": "Q23", "question": "Les messageries et petits colis sans commande d'achat entrent-ils dans le périmètre ? Un quai réservé sur une plage fixe suffit-il en V1 ?", "destinataire": "Grégory Thibaudeau ; Rémi Vasseur", "projets": ["P06"], "bloquante": false}, {"id": "Q24", "question": "À partir de quand la ponctualité alimente-t-elle la notation des fournisseurs ? Les pénalités sont-elles envisagées, et sur quelle base contractuelle ?", "destinataire": "Nadège Courtois ; Grégory Thibaudeau", "projets": ["P06"], "bloquante": false}, {"id": "Q25", "question": "Un IBAN saisi par le vendeur puis validé par deux personnes en interne respecte-t-il MKP-05 ? Qui sont les deux valideurs ?", "destinataire": "Finance (DAF) ; direction marketplace", "projets": ["P07"], "bloquante": false}, {"id": "Q26", "question": "Qu'est-ce qu'une commande « expédiée en retard » pour un vendeur ? Les deux alertes (2 % sur 30 jours, 5 % sur 7 jours) doivent-elles coexister ?", "destinataire": "Direction marketplace", "projets": ["P07"], "bloquante": false}, {"id": "Q27", "question": "Dans quelles langues proposer le portail fournisseurs et l'espace vendeur (anglais, allemand, espagnol) ? Pour quelle version ?", "destinataire": "Grégory Thibaudeau ; direction marketplace", "projets": ["P06", "P07"], "bloquante": false}, {"id": "Q28", "question": "Quelles pages de l'espace vendeur sont jugées lentes, et quel temps de réponse est attendu ? Combien de vendeurs se plaignent ?", "destinataire": "Direction marketplace ; DSI", "projets": ["P08"], "bloquante": false}, {"id": "Q29", "question": "Quel est le délai contractuel de déclaration d'un litige à chaque transporteur (7 jours ?) ? Qui est « le transport » à prévenir ?", "destinataire": "Service transport (à identifier via Karim Benhaddou)", "projets": ["P03"], "bloquante": false}, {"id": "Q30", "question": "Quelle est la date du prochain contrôle interne ? Le compte à rebours part-il de la réception ou de la vérification d'identité ? Comment traiter le Lac et les sauvegardes lors d'un effacement ?", "destinataire": "Hélène Marsac", "projets": ["P05"], "bloquante": false}, {"id": "Q31", "question": "Qui porte la purge des historiques de prospection de plus de 3 ans, et pour quelle échéance ?", "destinataire": "Hélène Marsac ; Capucine Lorrain", "projets": ["P04", "P05"], "bloquante": false}, {"id": "Q32", "question": "Qui doit suivre le taux de retour par produit, et le Lac peut-il le produire ?", "destinataire": "Odile (contrôle de gestion) ; équipe du Lac", "projets": ["P02"], "bloquante": false}, {"id": "Q33", "question": "La relance doit-elle reposer sur un modèle d'IA dès la V1, ou des règles suffisent-elles ? Les plafonds de remise (10 %, 15 % pour Orvanne+) sont-ils validés par la finance ?", "destinataire": "Capucine Lorrain ; finance", "projets": ["P04"], "bloquante": false}, {"id": "Q34", "question": "L'exigence d'hébergement dans le cloud d'Orvanne (B01) s'applique-t-elle à tous les projets, ou un hébergement dans l'UE chez un éditeur est-il admis (B03, B07-D20) ?", "destinataire": "DSI (comité d'architecture)", "projets": ["P01", "P02", "P03", "P04", "P05", "P06", "P07", "P08"], "bloquante": false}, {"id": "Q35", "question": "La conformité RGAA s'applique-t-elle au portail fournisseurs et à l'espace vendeur ?", "destinataire": "DSI (comité d'architecture)", "projets": ["P02", "P06", "P07"], "bloquante": false}, {"id": "Q36", "question": "Quand pouvez-vous examiner les traitements des projets P01, P02, P03, P04, P06 et P07 (CT-01) ? Lesquels exigent une analyse d'impact ?", "destinataire": "Hélène Marsac", "projets": ["P01", "P02", "P03", "P04", "P06", "P07"], "bloquante": false}, {"id": "Q37", "question": "La saisie de la note A / B / C des retours se fait-elle sur la même application douchette que la casse ? En V1 du portail de retours ou plus tard ?", "destinataire": "Karim Benhaddou ; Inès Rouvière", "projets": ["P02", "P03"], "bloquante": false}, {"id": "Q38", "question": "L'entrepôt E3 entre-t-il dans le périmètre de la prise de rendez-vous ?", "destinataire": "Grégory Thibaudeau", "projets": ["P06"], "bloquante": false}, {"id": "Q39", "question": "Quelle base de référence et quelle période de mesure pour la baisse de 30 % des contacts WISMO et la baisse de 60 % des contacts liés aux retours ?", "destinataire": "Yanis Mercadier ; direction de l'expérience client", "projets": ["P01", "P02"], "bloquante": false}]}, "fiches": [{"doc_id": "B01", "fichier": "B01_email_direction-logistique.txt", "format": "email", "emetteur": {"nom": "Solène Garrigue", "fonction": "Directrice des opérations logistiques", "direction": "Direction des opérations logistiques"}, "autres_parties": [{"nom": "Bertrand Lacassagne", "fonction": null, "role": "destinataire"}, {"nom": "Inès Rouvière", "fonction": "Cheffe de projet digital, DSI", "role": "copie"}, {"nom": "Karim Benhaddou", "fonction": "Exploitation entrepôt E2", "role": "copie"}], "date": "2026-10-14", "resume": "La direction logistique demande, avant le pic de fin d'année, un tableau de bord temps réel des colis en retard et une alerte SMS automatique aux clients. Un colis est en retard 48 h après la date promise.", "demandes": [{"id": "B01-D1", "type": "fonctionnelle", "enonce": "Tableau de bord des colis en retard pour les équipes transport et les responsables d'entrepôt.", "citation": "Un tableau de bord des retards, mis à jour en temps réel, pour mes équipes transport et pour les responsables d'entrepôt.", "acteurs": ["Équipes transport", "Responsables d'entrepôt"], "systemes": [], "priorite_exprimee": "priorité numéro un de la direction logistique", "echeance_exprimee": "opérationnel pour le pic", "statut_source": "demande"}, {"id": "B01-D2", "type": "non_fonctionnelle", "enonce": "Le tableau de bord est mis à jour en temps réel.", "citation": "mis à jour en temps réel", "acteurs": [], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B01-D3", "type": "fonctionnelle", "enonce": "Ventilation des colis en retard par transporteur, par entrepôt (E1, E2, E3) et par région, avec descente jusqu'au colis.", "citation": "Je veux voir les colis en retard par transporteur, par entrepôt (E1, E2, E3) et par région, avec la possibilité de descendre jusqu'au colis.", "acteurs": ["Équipes transport", "Responsables d'entrepôt"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_ stion.txt", "format": "notes_reunion", "emetteur": {"nom": "Odile", "fonction": null, "direction": "Contrôle de gestion"}, "autres_parties": [{"nom": "Karim B.", "fonction": "Exploitation E2", "role": "participant"}, {"nom": "Yanis M.", "fonction": "Service client", "role": "participant"}, {"nom": "Capucine L.", "fonction": "Marketing", "role": "participant"}, {"nom": "Inès R.", "fonction": null, "role": "excusée, destinataire des notes"}, {"nom": null, "fonction": "DAF", "role": "mentionné"}], "date": "2026-10-29", "resume": "Notes non relues d'une réunion sur le portail retours (cahier des charges en v0.3). Les participants divergent sur le moment du remboursement, la gratuité des retours, l'inclusion des retours marketplace en V1 et le montant remboursé selon la note qualité A / B / C. Plusieurs idées sont évoquées (photos avant réception, appli sur douchettes, bon d'achat majoré) et des actions sont fixées avant le codir.", "demandes": [{"id": "B04-D1", "type": "fonctionnelle", "enonce": "L'exploitation E2 veut voir les photos des colis retour avant leur réception en entrepôt.", "citation": "Veut voir les photos AVANT réception", "acteurs": ["Exploitation E2"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B04-D2", "type": "regle_metier", "enonce": "Position de la finance : le remboursement intervient après le contrôle en entrepôt, et non au premier scan.", "citation": "remboursement au 1er scan = NON pour la finance. On rembourse après contrôle en entrepôt, point.", "acteurs": ["Finance", "Client"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B04-D3", "type": "regle_metier", "enonce": "Position du marketing : rembourser au dépôt du colis, au moins pour les bons clients, comme argument commercial.", "citation": "Capucine pas d'accord : les concurrents remboursent au dépôt, c'est un argument commercial, \"au moins pour les bons clients\"", " e. Finance OK sur le principe", "acteurs": ["Client", "Marketing", "Finance"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "idee"}, {"id": "B04-D15", "type": "regle_metier", "enonce": "Le RMA est imprimé et placé dans le colis pour permettre de retrouver la commande.", "citation": "le RMA doit être imprimé DANS le colis, sinon on ne retrouve pas la commande", "acteurs": ["Client", "Exploitation entrepôt"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B04-D16", "type": "indicateur", "enonce": "Suivi du taux de retour par produit, à voir avec le Lac.", "citation": "stats : qui suit le taux de retour par produit ? demander au Lac", "acteurs": [], "systemes": ["Lac"], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "idee"}, {"id": "B04-D17", "type": "echeance", "enonce": "Le contrôle de gestion chiffre le coût du remboursement anticipé avant le codir.", "citation": "Odile : chiffrer le coût du remboursement anticipé -> avant le codir", "acteurs": ["Contrôle de gestion"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": "avant le codir", "statut_source": "demande"}], "chiffres": [{"id": "B04-N1", "libelle": "Colis retour reçus par jour à E2", "valeur": "1100", "unite": "colis/jour (approximatif)", "citation": "E2 reçoit ~1 100 colis retour / jour"}, {"id": "B04-N2", "libelle": "Part des retours non conformes à l'ouverture", "valeur": "1 sur 5", "unite": "colis", "citation": "1 sur 5 n'est pas conforme à l'ouverture"}, {"id": "B04-N3", "libelle": "Cartons vides constatés ce mois-ci", "valeur": "2", "unite": "occurrences/mois", "citation": "carton vide vu 2 fois ce mois-ci"}, {"id": "B04-N4", "libelle": "Délai de retour affiché sur le site", "valeur": "14", "unite": "jours", "citation": "le site dit 14 jours"}, {"id": "B04-N5", "libelle": "Délai de retour des membres Orvanne+", "valeur": "30", "unite": "jours", "citation": "30 jours c'est seulement pour les membres Orvanne+"}, {"id": "B04-N6", "libelle": "Montant retenu sur le remboursement hors défaut ou erreur de préparation", "valeur": "4,90", "unite": "non précisée (euros implicites)", "citation": "Sinon 4,90 retenus sur le remboursement"}, {"id": "B04-N7", "libelle": "Part des demandes de retour portant sur des articles marketplace", "valeur": "35", "unite": "%", "citation": "35 % des demandes de retour concernent des articles marketplace"}, {"id": "B04-N8", "libelle": "Délai de contrôle actuel après réception", "valeur": "3 à 6", "unite": "jours", "citation": "délai de contrôle aujourd'hui : 3 à 6 jours après réception"}, {"id": "B04-N9", "libelle": "Délai de contrôle en janvier", "valeur": "10", "unite": "jours", "citation": "10 en janvier"}, {"id": "B04-N10", "libelle": "Majoration du bon d'achat proposé à la place du remboursement", "valeur": "5", "unite": "%", "citation": "avec +5 %"}, {"id": "B04-N11", "libelle": "Fréquence des étiquettes transporteur illisibles", "valeur": "1 sur 10", "unite": "colis", "citation": "étiquette transporteur illisible 1 fois sur 10"}, {"id": "B04-N12", "libelle": "Version du cahier des charges du portail retours", "valeur": "0.3", "unite": "version", "citation": "le CDC portail retours circule en v0.3"}], "systemes_cites": ["Lac"], "points_flous": [{"id": "B04-F1", "description": "Les notes n'ont pas été relues et la DSI (Inès R.) était absente : rien n'est formellement validé en séance.", "citation": "notes Odile (pas relues)"}, {"id": "B04-F2", "description": "Contradiction interne sur le moment du remboursement (après contrôle pour la finance, au dépôt pour le marketing). Les « bons clients » ne sont pas définis (Orvanne+ ?). La décision est renvoyée au DAF et au codir.", "citation": "Sinon provision fraude à revoir, voir avec le DAF"}, {"id": "B04-F3", "description": "Contradiction interne sur les frais de retour : 4,90 retenus hors défaut, ou gratuité pour le lancement. La durée du « lancement » n'est pas définie.", "citation": "\"on avait dit gratuit pour le lancement\""}, {"id": "B04-F4", "description": "L'unité du montant de 4,90 n'est pas écrite.", "citation": "4,90 retenus"}, {"id": "B04-F5", "description": "Désaccord non tranché sur la légalité d'un remboursement réduit selon la note C ; les montants pour A et B ne sont pas donnés.", "citation": "Karim dit oui pour C, Yanis dit que légalement non"}, {"id": "B04-F6", "description": "Le délai de 14 jours vient de l'affichage du site ; sa conformité aux CGV reste à vérifier.", "citation": "relire les CGV sur le délai"}, {"id": "B04-F7", "description": "Le volume de retours est approximatif et ne porte que sur E2 ; les volumes exacts sont à produire.", "citation": "sortir les volumes exacts de retours par jour"}, {"id": "B04-F8", "description": "On ne sait pas qui prend les photos « avant réception » (le client lors de la demande ?) ni à quel moment.", "citation": "Veut voir les photos AVANT réception"}, {"id": "B04-F9", "description": "Tension interne : marketplace demandé en V1 alors que ces retours suivent un autre circuit, avec d'autres étiquettes, hors entrepôts Orvanne.", "citation": "Donc autre circuit, autres étiquettes"}, {"id": "B04-F10", "description": "L'appli sur douchettes n'est pas dans le cahier des charges : son inclusion dans le périmètre n'est pas décidée.", "citation": "Pas dans le CDC"}, {"id": "B04-F11", "description": "Le délai de contrôle retarde le remboursement ; aucun objectif de délai n'est fixé.", "citation": "Le client attend son argent pendant ce temps"}, {"id": "B04-F12", "description": "Les conditions de l'accord de la finance sur le bon d'achat majoré ne sont pas précisées.", "citation": "Finance OK sur le principe"}, {"id": "B04-F13", "description": "Le responsable du suivi du taux de retour par produit n'est pas identifié.", "citation": "qui suit le taux de retour par produit ?"}, {"id": "B04-F14", "description": "Ni la date du codir ni celle de la prochaine réunion ne sont fixées.", "citation": "prochaine réunion : à caler"}]}, {"doc_id": "B05", "fichier": "B05_messagerie_marketing.txt", "format": "messagerie", "emetteur": {"nom": "Capucine Lorrain", "fonction": null, "direction": "Marketing"}, "autres_parties": [{"nom": "Théo Bazin", "fonction": null, "role": "participant"}, {"nom": "Hélène", "fonction": null, "role": "mentionné (données personnelles)"}], "date": "2026-11-03", "resume": "Le marketing veut remplacer la relance unique des paniers abandonnés (même e-mail à 24 h) par une relance personnalisée par IA : message, moment, canal et remise choisis pour chaque client. Il demande aussi un code promo dans les messages de retard de livraison et une démo sur données réelles pour le comité commerce du 8 décembre. Plusieurs points sont contestés ou laissés ouverts (données disponibles, RGPD, périmètre, volumétrie).", "demandes": [{"id": "B05-D1", "type": "fonctionnelle", "enonce": "Relance des paniers abandonnés qui choisit, pour chaque client, le message, le moment et le canal.", "citation": "je voudrais un truc intelligent qui choisit le bon message, le bon moment et le bon canal pour chaque client", "acteurs": ["Marketing", "Client"], "systemes": [], "priorite_exprimee": "c'est LE sujet de l'année prochaine", "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B05-D2", "type": "non_fonctionnelle", "enonce": "Le choix de la relance repose sur de l'intelligence artificielle.", "citation": "de l'IA évidemment", "acteurs": [], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B05-D3", "type": "fonctionnelle", "enonce": "Exploiter l'historique d'achats depuis 2014 et les données de navigation pour personnaliser la relance.", "citation": "on a tout l'historique d'achats depuis 2014 et la navigation, autant s'en servir", "acteurs": [], "systemes": ["Lac"], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B05-D4", "type": "fonctionnelle", "enonce": "Canaux de relance : e-mail, notifications de l'application, SMS et, si possible, messageries mobiles.", "citation": "mail, notifs de l'appli, SMS, et les messageries mobiles si on peut", "acteurs": ["Client"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B05-D5", "type": "fonctionnelle", "enonce": "Proposer une remise au client qui hésite, mais pas à celui qui aurait acheté sans remise.", "citation": "il faudrait que ça propose une remise quand le client hésite, mais pas à ceux qui auraient acheté de toute façon", "acteurs": ["Client"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B05-D6", "type": "regle_metier", "enonce": "Plafond provisoire de remise : 10 % maximum, 15 pour les clients Orvanne+.", "citation": "mets 10 % max pour l'instant, 15 pour les Orvanne+", "acteurs": ["Client", "Client Orvanne+"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": "pour l'instant", "statut_source": "demande"}, {"id": "B05-D7", "type": "fonctionnelle", "enonce": "Ajouter un code promo dans les messages de retard de livraison préparés par la logistique.", "citation": "dans les messages de retard de livraison que prépare la logistique, je voudrais qu'on glisse un code promo", "acteurs": ["Client", "Logistique"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B05-D8", "type": "contrainte", "enonce": "Faire valider l'usage des données personnelles avec Hélène.", "citation": "il faut voir avec Hélène pour les données perso, non ?", "acteurs": ["Hélène"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B05-D9", "type": "regle_metier", "enonce": "Le consentement newsletter existant est jugé suffisant par le marketing ; la question des données personnelles est reportée.", "citation": "on verra après, on a le consentement newsletter de toute façon", "acteurs": ["Marketing"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": "on verra après", "statut_source": "demande"}, {"id": "B05-D10", "type": "echeance", "enonce": "Démo pour le comité commerce du 8 décembre, même sommaire.", "citation": "il me faut une démo pour le comité commerce du 8 décembre. même un truc moche", "acteurs": ["Comité commerce"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": "comité commerce du 8 décembre", "statut_source": "demande"}, {"id": "B05-D11", "type": "contrainte", "enonce": "La démo utilise les données des vrais clients.", "citation": "oui sur les vrais clients, sinon ça ne parlera à personne", "acteurs": ["Client"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B05-D12", "type": "indicateur", "enonce": "Tableau présentant le chiffre d'affaires incrémental de la relance.", "citation": "et un tableau avec le CA incrémental", "acteurs": ["Comité commerce", "Marketing"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}], "chiffres": [{"id": "B05-N1", "libelle": "Délai actuel d'envoi de l'e-mail de relance", "valeur": "24", "unite": "heures", "citation": "on envoie le même mail de relance à tout le monde 24h après"}, {"id": "B05-N2", "libelle": "Taux de conversion actuel de la relance", "valeur": "2 et quelques", "unite": "%", "citation": "ça convertit à 2 et quelques %"}, {"id": "B05-N3", "libelle": "Début de l'historique d'achats disponible", "valeur": "2014", "unite": "année", "citation": "l'historique d'achats depuis 2014"}, {"id": "B05-N4", "libelle": "Début des données de navigation (selon Théo Bazin, non confirmé)", "valeur": "2023", "unite": "année", "citation": "pas avant 2023 je crois"}, {"id": "B05-N5", "libelle": "Plafond provisoire de remise", "valeur": "10", "unite": "%", "citation": "mets 10 % max pour l'instant"}, {"id": "B05-N6", "libelle": "Plafond provisoire de remise pour les clients Orvanne+", "valeur": "15", "unite": "% (unité implicite)", "citation": "15 pour les Orvanne+"}, {"id": "B05-N7", "libelle": "Date du comité commerce (démo attendue)", "valeur": "2026-12-08", "unite": "date", "citation": "comité commerce du 8 décembre"}], "systemes_cites": ["Lac"], "points_flous": [{"id": "B05-F1", "description": "La nature de l'« intelligence » n'est pas tranchée : règles ou modèle. « De l'IA » n'est pas défini.", "citation": "intelligent comment ? des règles ou un modèle ?"}, {"id": "B05-F2", "description": "Contradiction sur les données disponibles : le marketing suppose que le Lac contient tout, y compris la navigation depuis 2014 ; Théo Bazin indique que le Lac n'a que les commandes et que la navigation ne concerne que les clients connectés, sans doute pas avant 2023.", "citation": "le Lac a les commandes. la navigation c'est seulement pour les clients connectés, et pas avant 2023 je crois"}, {"id": "B05-F3", "description": "Les critères d'un client « qui hésite » et d'un client « qui aurait acheté de toute façon » ne sont pas définis.", "citation": "quand le client hésite"}, {"id": "B05-F4", "description": "Les plafonds de remise sont provisoires, sans validation de la finance ; l'unité du plafond Orvanne+ (15) est implicite.", "citation": "je verrai avec la finance. mets 10 % max pour l'instant"}, {"id": "B05-F5", "description": "La volumétrie n'est pas connue.", "citation": "aucune idée, beaucoup. tu peux regarder ?"}, {"id": "B05-F6", "description": "Contestation du périmètre : selon Théo Bazin, le code promo dans les messages de retard relève du projet retards, pas de la relance paniers.", "citation": "ça c'est pas chez moi, c'est le projet retards"}, {"id": "B05-F7", "description": "Contradiction sur les données personnelles : Théo Bazin demande de voir avec Hélène ; le marketing reporte la question et juge le consentement newsletter suffisant, sans préciser s'il couvre les SMS, notificat oudrais c'est que le gars il scanne le colis avec sa douchette", "acteurs": ["Préparateur", "Cariste"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B06-D2", "type": "fonctionnelle", "enonce": "La déclaration comporte une ou deux photos du colis abîmé.", "citation": "il prend une photo ou deux", "acteurs": ["Préparateur", "Cariste"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B06-D3", "type": "fonctionnelle", "enonce": "Le type de dégât est choisi dans une liste.", "citation": "il choisit le type de dégât dans une liste", "acteurs": ["Préparateur", "Cariste"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B06-D4", "type": "fonctionnelle", "enonce": "La validation de la déclaration crée automatiquement le dossier de casse.", "citation": "et hop ça part ça crée le dossier tout seul", "acteurs": [], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B06-D5", "type": "fonctionnelle", "enonce": "La déclaration prévient automatiquement le chef d'équipe et le transport.", "citation": "ça prévient le chef d'équipe et le transport", "acteurs": ["Chef d'équipe", "Transport"], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B06-D6", "type": "contrainte", "enonce": "Toutes les douchettes ne disposent pas d'un appareil photo : seules les nouvelles en ont un.", "citation": "les douchettes elles ont pas toutes un appareil photo les nouvelles oui les anciennes non", "acteurs": [], "systemes": [], "priorite_exprimee": null, "echeance_exprimee": null, "statut_source": "demande"}, {"id": "B06-D7", "type": "fonctionnelle", "enonce": "Piste : réaliser la déclaration (ou la photo) sur les téléphones des chefs d'équipe plutôt que sur les douchettes.", "citation": "peut-être sur les téléphones ac et dans les sauvegardes après leur effacement dans Vitrine"}, {"id": "B07-F2", "description": "La manière de repérer les demandes arrivant par le chat et les réseaux sociaux n'est pas décrite.", "citation": "où elles ne sont pas toujours reconnues comme telles"}, {"id": "B07-F3", "description": "Le mode de vérification de l'identité du demandeur n'est pas précisé.", "citation": "identité vérifiée ou non"}, {"id": "B07-F4", "description": "Le « canal sécurisé » de remise de l'export n'est pas défini, ni le format de l'export lisible.", "citation": "remis au demandeur par un canal sécurisé"}, {"id": "B07-F5", "description": "Le point de départ du compte à rebours (date de réception, date de vérification d'identité ?) et le décompte en jours calendaires ou ouvrés ne sont pas précisés.", "citation": "des alertes à J+15 et J+25"}, {"id": "B07-F6", "description": "Les alertes J+15 et J+25 ne sont pas définies pour une demande prolongée de deux mois ; on ne sait pas si la prolongation s'ajoute au mois initial.", "citation": "la possibilité de prolonger le délai de deux mois en motivant la décision"}, {"id": "B07-F7", "description": "Le critère de choix entre suppression et anonymisation n'est pas donné.", "citation": "la suppression ou l'anonymisation"}, {"id": "B07-F8", "description": "Le mécanisme d'intégration de « tout nouveau système » stockant des données clients n'est pas décrit.", "citation": "tout nouveau système qui stockerait des données clients"}, {"id": "B07-F9", "description": "Le contenu du tableau de bord trimestriel (indicateurs) n'est pas défini.", "citation": "Un tableau de bord trimestriel pour le comité des risques."}, {"id": "B07-F10", "description": "La notion de « dernier contact du client » n'est pas définie (commande, ouverture d'e-mail, contact service client ?).", "citation": "après le dernier contact du client"}, {"id": "B07-F11", "description": "Le chantier de purge des historiques de prospection est cité sans porteur ni échéance ; son rattachement à l'outil demandé n'est pas précisé.", "citation": "ce chantier n'a pas commencé"}, {"id": "B07-F12", "description": "La date du prochain contrôle interne, qui fixe l'échéance, n'est pas donnée.", "citation": "avant le prochain contrôle interne"}, {"id": "B07-F13", "description": "Le budget n'est pas arrêté, et la préférence pour une solution intégrée n'est pas une exigence ferme.", "citation": "Le budget n'est pas arrêté"}, {"id": "B07-F14", "description": "Implicite : les projets d'alertes de retard, de portail de retours et de personnalisation marketing n'ont pas été soumis à la déléguée à la protection des données ; leur conformité reste à analyser.", "citation": "Je n'ai été consultée ni sur les alertes de retard, ni sur le portail de retours, ni sur les projets de personnalisation du marketing."}, {"id": "B07-F15", "description": "Les types de demandes listés dans le constat (accès, rectification, effacement, opposition) ne sont pas tous traités dans le besoin : rien n'est décrit pour la rectification et l'opposition à la prospection.", "citation": "accéder à leurs données, les faire rectifier ou effacer, ou s'opposer à la prospection"}]}, {"doc_id": "B08", "fichier": "B08_compte-rendu-atelier_approvisionnement.md", "format": "compte_rendu", "emetteur": {"nom": "Inès Rouvière", "fonction": "Animation de l'atelier et rédaction du compte rendu", "direction": "DSI"}, "autres_parties": [{"nom": "Grégory Thibaudeau", "fonction": "Approvisionnement et transport amont", "role": "participant"}, {"nom": "Karim Benhaddou", "fonction": "Exploitation E2", "role": "participant"}, {"nom": "Nadège Courtois", "fonction": "Achats", "role": "participant"}, {"nom": "Rémi Vasseur", "fonction": "Chef de quai E1", "role": "participant"}], "date": "2026-11-12", "resume": "L'atelier retient un portail web sur lequel les fournisseurs ou leurs transporteurs réservent un créneau de déchargement, pour remplacer les prises de rendez-vous par téléphone et e-mail notées dans des ta F11", "description": "La suite d'un créneau perdu n'est pas décrite (camion refoulé, remis en file, nouveau créneau ?).", "citation": "au-delà le créneau est perdu"}, {"id": "B08-F12", "description": "L'accès des fournisseurs et transporteurs au portail (création de compte, authentification) n'est pas abordé.", "citation": "Un portail web sur lequel le fournisseur ou son transporteur réserve un créneau de déchargement."}, {"id": "B08-F13", "description": "Le site E3 n'est pas évoqué : on ne sait pas s'il entre dans le périmètre.", "citation": "E1 reçoit environ 70 camions par jour sur 6 quais de réception, E2 une quarantaine."}, {"id": "B08-F14", "description": "Les échéances sont imprécises : année du pilote « au printemps » non donnée, chiffrage « décembre » sans date.", "citation": "Démarrage du pilote souhaité sur E1 au printemps."}]}, {"doc_id": "B09", "fichier": "B09_tableau_marketplace.csv", "format": "tableau", "emetteur": {"nom": null, "fonction": null, "direction": "Direction marketplace"}, "autres_parties": [], "date": "2026-11-03", "resume": "Tableau de 12 demandes (MKP-01 à MKP-12) sur l'espace vendeur de la marketplace, saisies entre le 02/09/2026 et le 03/11/2026 et émanant des vendeurs, des chargés de compte, de la finance, de la DSI et de la direction marketplace. Il couvre le suivi des ventes, les factures, les alertes de retard, les coordonnées bancaires, les retours et litiges, la performance, la relation client, l'ouverture européenne et l'accès mobile. Deux lignes décrivent des défauts de l'existant (MKP-07, MKP-11).", "demandes": [{"id": "B09-D1", "type": "fonctionnelle", "enonce": "MKP-01 : le vendeur voit en un coup d'œil ses ventes du jour, de la semaine et du mois.", "citation": "Voir en un coup d'œil mes ventes du jour, de la semaine et du mois", "acteurs": ["Vendeurs"], "systemes": [], "priorite_exprimee": "P1", "echeance_exprimee": "T1 2027", "statut_source": "demande"}, {"id": "B09-D2", "type": "fonctionnelle", "enonce": "MKP-02 : le v atut_source": "demande"}], "chiffres": [{"id": "B09-N1", "libelle": "Seuil d'alerte chargés de compte : part de commandes expédiées en retard (MKP-03)", "valeur": "2", "unite": "%", "citation": "dépasse 2 % de commandes expédiées en retard"}, {"id": "B09-N2", "libelle": "Fenêtre de calcul du taux de retard (MKP-03)", "valeur": "30", "unite": "jours glissants", "citation": "Calcul sur 30 jours glissants"}, {"id": "B09-N3", "libelle": "Seuil d'alerte vendeur : taux de retard (MKP-08)", "valeur": "5", "unite": "%", "citation": "son taux de retard dépasse 5 %"}, {"id": "B09-N4", "libelle": "Fenêtre de calcul du taux de retard (MKP-08)", "valeur": "7", "unite": "jours", "citation": "Calcul sur 7 jours"}, {"id": "B09-N5", "libelle": "Volume d'export au-delà duquel l'export des ventes tombe en erreur (MKP-07)", "valeur": "50000", "unite": "lignes", "citation": "au-delà de 50 000 lignes"}, {"id": "B09-N6", "libelle": "Segment de vendeurs à l'origine de MKP-04", "valeur": "20", "unite": "vendeurs (top 20)", "citation": "Vendeur (top 20)"}, {"id": "B09-N7", "libelle": "Échéance datée de MKP-08", "valeur": "2027-01-15", "unite": "date", "citation": "15/01/2027"}, {"id": "B09-N8", "libelle": "Date de demande la plus ancienne (MKP-01, MKP-02)", "valeur": "2026-09-02", "unite": "date", "citation": "02/09/2026"}, {"id": "B09-N9", "libelle": "Date de demande la plus récente (MKP-12)", "valeur": "2026-11-03", "unite": "date", "citation": "03/11/2026"}], "systemes_cites": ["Comptoir"], "points_flous": [{"id": "B09-F1", "description": "Le tableau n'a pas de date unique : chaque ligne a sa date_demande, du 02/09/2026 au 03/11/2026. La date de la fiche retenue est la plus récente (2026-11-03, MKP-12), considérée comme la dernière mise à jour connue du tableau.", "citation": "03/11/2026"}, {"id": "B09-F2", "description": "Émetteur sans nom ni fonction : la direction marketplace est déduite du README du challenge ; les lignes ont des origines variées (vendeurs, chargés de compte, finance, DSI, direction marketplace).", "citation": "Direction marketplace"}, {"id": "B09-F3", "description": "Échelles de priorité hétérogènes et non comparables : P1, P2, P3, Haute, urgent, 1, moyenne, ou vide.", "citation": "moyenne"}, {"id": "B09-F4", "description": "Échéances hétérogènes, parfois sans année ni date précise : fin mars, T1, ASAP, 2027, S1 2027 ; MKP-02, MKP-05, MKP-07 et MKP-11 n'en ont pas.", "citation": "fin mars"}, {"id": "B09-F5", "description": "Contradiction interne : MKP-04 demande que le vendeur modifie son IBAN lui-même (urgent), MKP-05 interdit toute modification de coordonnées bancaires sans double validation interne.", "citation": "Aucune modification de coordonnées bancaires sans double validation interne"}, {"id": "B09-F6", "description": "Contradiction interne entre deux alertes de retard : MKP-03 (2 %, 30 jours glissants, destinée aux chargés de compte, P2, fin mars) et MKP-08 (5 %, 7 jours, destinée au vendeur, P1, 15/01/2027). La définition d'une commande « en retard » n'est pas donnée, ni le lien entre « commandes expédiées en retard » et « taux de retard ».", "citation": "Calcul sur 7 jours"}, {"id": "B09-F7", "description": "Défaut à corriger : MKP-07 décrit une anomalie de l'existant (export en erreur au-delà de 50 000 lignes) et impose une solution technique (index, export asynchrone) plutôt qu'un besoin. Candidat à une spec bugfix.", "citation": "L'export des ventes tombe en erreur au-delà de 50 000 lignes"}, {"id": "B09-F8", "description": "Défaut à corriger : MKP-11 est un verbatim d'enquête sans bénéfice, priorité ni échéance ; « trop lent » n'est pas chiffré et les pages concernées ne sont pas précisées ; le problème de compréhension des reversements n'est pas détaillé.", "citation": "Verbatim de l'enquête"}, {"id": "B09-F9", "description": "MKP-06 n'a pas de bénéfice attendu ; « litiges » n'est pas défini et l'échéance « T1 » n'a pas d'année.", "citation": "Suivre mes retours et mes litiges"}, {"id": "B09-F10", "description": "MKP-09 : le canal n'est pas arbitré entre Comptoir et une messagerie dédiée.", "citation": "Via Comptoir ou une messagerie dédiée"}, {"id": "B09-F11", "description": "MKP-12 : la forme n'est pas arbitrée entre application et site adapté ; le lien avec la vue des ventes de MKP-01 est implicite.", "citation": "Application ou site adapté"}, {"id": "B09-F12", "description": "MKP-10 : seuls l'Allemagne et l'Espagne sont cités ; les autres pays et ce que l'ouverture implique pour l'espace vendeur ne sont pas décrits.", "citation": "Allemagne et Espagne d'abord"}, {"id": "B09-F13", "description": "MKP-05 : l'incident de juin qui motive la règle n'est pas décrit, et les rôles de la double validation interne ne sont pas précisés.", "citation": "Suite à l'incident de juin"}, {"id": "B09-F14", "description": "MKP-02 : les factures existent déjà en PDF mensuel ; on ne sait pas si la demande se limite à leur mise à disposition dans l'espace vendeur.", "citation": "La comptabilité produit les factures en PDF chaque mois"}, {"id": "B09-F15", "description": "Implicite : l'espace vendeur existe déjà (MKP-04, MKP-11), son périmètre actuel et le système qui le porte ne sont pas nommés.", "citation": "L'espace vendeur est trop lent"}]}], "specs": {"alertes-retards-livraison": {"requirements.md": "# Exigences : détection des retards de livraison, suivi colis dans Comptoir et information du client\n\n<!-- Projet P01, slug alertes-retards-livraison. Commanditaire : direction des opérations logistiques.\n     Parties prenantes : service client, DSI, direction juridique et conformité (DPO), marketing.\n     Sources : B01, B02, B05 (demande exclue), B07 (contraintes CT-01 à CT-04). Identifiants : work/fiches/ et work/analyse.json. -->\n\n## Introduction\n\nOrvanne découvre aujourd'hui les retards de livraison quand les clients appellent. Lors du pic de l'an dernier, le taux de service est resté dégradé pendant trois semaines. Le suivi se fait à la main, à partir d'extractions de Hangar et des fichiers que les transporteurs envoient chaque matin. Orvanne expédie environ 35 000 colis par jour en temps normal, et à peu près le double pendant le pic (B01).\n\nLe service client reçoit environ 2 600 contacts par jour, et plus de 5 000 pendant les fêtes. Depuis septembre, 4 contacts sur 10 portent sur l'état d'une commande (WISMO). L'objectif est de baisser ce taux de 30 % (B02).\n\nLe projet couvre quatre besoins qui reposent sur les mêmes données de suivi :\n1. un tableau de bord des retards pour les équipes transport et les responsables d'entrepôt ;\n2. le suivi des colis dans la fiche commande de Comptoir ;\n3. une liste quotidienne des commandes en retard pour le service client ;\n4. un message de retard envoyé automatiquement au client.\n\nLe découpage suit le gel des mises en production du 16 novembre au 11 janvier (`CT-07`) et le découpage V1 / V2 de l'analyse :\n- **Lot 1** (exigences 1 à 3, critères 11.1, 11.2, 11.4, 11.7, 11.8) : outils internes, sans aucun envoi aux clients. **Sa date de mise en service dépend de la question bloquante Q03** (dérogation au gel avant le 16 novembre, ou mise en service après le 11 janvier). La spec ne la fixe pas.\n- **Lot 2** (exigences 4 à 7 et 9, critères 11.3, 11.5, 11.6) : Comptoir et message de retard par e-mail, au premier trimestre 2027.\n- **Lot 3 = V2** (exigences 8 et 10) : validation des messages Premium et canal SMS. Ces options restent désactivées tant que la catégorie Premium n'est pas définie (Q04) et que la DPO n'a pas rendu son avis sur l'usage du mobile (`CT-02`).\n\n## Glossaire\n\n- **Colis** : unité expédiée et suivie par un transporteur ; une commande peut comporter plusieurs colis.\n- **Date promise (J)** : date de livraison affichée au client sur Vitrine au moment de la commande.\n- **J+1, J+2** : premier et deuxième jour suivant la date promise. Selon `H02`, J+2 correspond aux 48 heures après la date promise demandées par la logistique.\n- **Statut transporteur** : événement de suivi d'un colis (pris en charge, en transit, livré, incident…) reçu par Passerelle.\n- **Niveau de retard** : état calculé d'un colis non livré : `à l'heure`, `à surveiller` (J+1) ou `en retard` (J+2). Les seuils sont des paramètres (`H02`).\n- **Niveau d'alerte client** : niveau de retard qui déclenche le message au client ; paramètre, `en retard` par défaut (`H02`).\n- **Délai de rafraîchissement** : délai maximal entre la réception d'un statut par Passerelle et son affichage sur le tableau de bord ; paramètre dont la valeur cible sera fixée après mesure (`H04`).\n- **Dossier ouvert** : demande client en cours de traitement dans Comptoir sur une commande (définition exacte à confirmer, voir « Points à ajouter à l'analyse »).\n- **Client Premium** : catégorie de client citée par le service client ; définition et lien avec Orvanne+ à confirmer (Q04).\n- **Message de retard** : message de service informant un client du retard de sa commande ; il ne contient aucune offre commerciale (`CT-03`).\n- **Liste quotidienne** : liste des commandes concernées par un retard, publiée chaque matin pour le service client.\n- **Administrateur métier** : utilisateur habilité à modifier les seuils, canaux, horaires et options de l'application.\n- **WISMO** : contact client demandant où en est sa commande.\n\n## Exigences\n\n### Exigence 1 : consolidation des statuts de suivi des colis (lot 1)\n\n**User story :** En tant que membre des équipes transport, je veux que les statuts des trois transporteurs soient consolidés automatiquement à partir de Passerelle, afin de ne plus croiser à la main les extractions de Hangar et les fichiers des transporteurs.\n\n#### Critères d'acceptation\n\n1. QUAND Passerelle reçoit un statut transporteur pour un colis, LE SYSTÈME DOIT l'enregistrer dans l'historique de ce colis avec son horodatage d'origine et son horodatage de réception. _Source : B01-D10_\n2. LE SYSTÈME DOIT rattacher chaque colis à sa commande, à son transporteur, à son entrepôt d'expédition (E1, E2 ou E3), à sa région de livraison et à la date promise affichée sur Vitrine. _Source : B01-D3, B02-D6_\n3. LE SYSTÈME DOIT traiter les statuts des trois transporteurs d'Orvanne. _Source : B02-D3_\n4. SI un statut déjà enregistré pour un colis est reçu de nouveau, ALORS LE SYSTÈME DOIT l'ignorer sans créer de doublon dans l'historique. _Source : B01-D10_\n5. SI un code de statut transporteur n'est pas reconnu, ALORS LE SYSTÈME DOIT conserver l'événement avec son code d'origine, ne pas modifier le niveau de retard du colis et signaler le code à la supervision. _Source : B01-D10, B02-D3_\n6. QUAND Passerelle reçoit un lot de statuts, LE SYSTÈME DOIT les rendre visibles sur le tableau de bord dans le délai de rafraîchissement paramétré, sans attendre de traitement quotidien. _Source : B01-D2, H04_\n7. LE SYSTÈME DOIT calculer chaque jour, par transporteur, la médiane et le 95e centile du délai entre l'horodatage d'origine des statuts et leur réception par Passerelle. _Source : B01-D2, H04_\n8. SI aucun statut n'a été reçu d'un transporteur depuis une durée supérieure au seuil paramétré, ALORS LE SYSTÈME DOIT afficher sur le tableau de bord un bandeau signalant l'interruption du flux de ce transporteur. _Source : B01-D10, H04_\n\n### Exigence 2 : détection des retards (lot 1)\n\n**User story :** En tant que responsable transport, je veux que le système calcule le niveau de retard de chaque colis, afin d'agir avant que le client appelle.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT attribuer à chaque colis non livré un niveau de retard `à l'heure`, `à surveiller` ou `en retard`, calculé à partir de la date promise affichée sur Vitrine. _Source : B02-D6, B01-D7, H02_\n2. QUAND le calcul du matin de J+1 constate qu'un colis n'est pas livré, LE SYSTÈME DOIT le passer au niveau `à surveiller`. _Source : B02-D6, H02_\n3. QUAND le calcul du matin de J+2 constate qu'un colis n'est toujours pas livré, LE SYSTÈME DOIT le passer au niveau `en retard`. _Source : B01-D7, H02_\n4. QUAND un colis reçoit le statut « livré », LE SYSTÈME DOIT le retirer du suivi des retards et de la liste quotidienne. _Source : B01-D1, B02-D15_\n5. LE SYSTÈME DOIT permettre à un administrateur métier de modifier, sans nouvelle mise en production, le nombre de jours après la date promise qui déclenche chacun des deux niveaux. _Source : H02_\n6. LE SYSTÈME DOIT recalculer chaque matin le niveau de tous les colis non livrés avant l'heure de publication de la liste quotidienne. _Source : B02-D6, B02-D15, H02_\n7. SI la date promise d'un colis est inconnue, ALORS LE SYSTÈME DOIT l'exclure du calcul des niveaux et le compter à part sur le tableau de bord. _Source : B02-D6_\n\n### Exigence 3 : tableau de bord des retards (lot 1)\n\n**User story :** En tant que membre des équipes transport ou responsable d'entrepôt, je veux un tableau de bord des colis en retard, afin de repérer les dérives par transporteur, par entrepôt et par région, et d'agir dessus.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT afficher le nombre de colis `à surveiller` et `en retard`, ventilé par transporteur, par entrepôt (E1, E2, E3) et par région de livraison. _Source : B01-D1, B01-D3_\n2. QUAND un utilisateur sélectionne une ventilation, LE SYSTÈME DOIT afficher la liste des colis concernés puis, à la sélection d'un colis, sa commande, l'historique de ses statuts, sa date promise et la nouvelle date de livraison si elle est connue. _Source : B01-D3, B01-D6_\n3. LE SYSTÈME DOIT afficher en rouge les colis du niveau paramétré comme prioritaire, `en retard` par défaut, et les placer en tête des listes par ancienneté du retard décroissante. _Source : B01-D4, H02_\n4. LE SYSTÈME DOIT afficher, pour chaque transporteur, la date et l'heure de la dernière mise à jour des données. _Source : B01-D2, H04_\n5. LE SYSTÈME DOIT réserver l'accès au tableau de bord aux équipes transport, aux responsables d'entrepôt et aux administrateurs métier. _Source : B01-D1, CT-01_\n\n### Exigence 4 : suivi des colis dans la fiche commande de Comptoir (lot 2)\n\n**User story :** En tant que conseiller du service client, je veux voir le suivi des colis dans la fiche commande de Comptoir, afin de répondre au client sans ouvrir le site du transporteur.\n\n#### Critères d'acceptation\n\n1. QUAND un conseiller ouvre une fiche commande dans Comptoir, LE SYSTÈME DOIT afficher pour chaque colis de la commande le dernier statut, son horodatage, le niveau de retard et l'historique complet des statuts, sans quitter Comptoir. _Source : B02-D1_\n2. LE SYSTÈME DOIT afficher le suivi des colis dans la fiche commande en moins de 2 secondes, y compris au volume du pic (70 000 colis expédiés par jour). _Source : B02-D2, B01-D1_\n3. LE SYSTÈME DOIT afficher ce suivi pour les colis des trois transporteurs. _Source : B02-D3_\n4. SI le suivi n'est pas disponible dans le délai de 2 secondes, ALORS LE SYSTÈME DOIT afficher la fiche commande sans le suivi, avec un message indiquant que le suivi est momentanément indisponible. _Source : B02-D2_\n\n### Exigence 5 : liste quotidienne des commandes en retard (lot 2)\n\n**User story :** En tant que responsable du service client, je veux chaque matin la liste des commandes concernées par un retard, avant tout envoi aux clients, afin d'anticiper les appels et de savoir quels messages partent.\n\n#### Critères d'acceptation\n\n1. QUAND l'heure de publication paramétrée est atteinte, LE SYSTÈME DOIT mettre à disposition du service client la liste des commandes ayant au moins un colis `à surveiller` ou `en retard`. _Source : B02-D15, H02_\n2. LE SYSTÈME DOIT publier la liste du jour avant le premier envoi de message de retard de la journée et ne déclencher aucun envoi avant cette publication. _Source : B02-D14, H03_\n3. LE SYSTÈME DOIT indiquer pour chaque commande de la liste les colis concernés et leur niveau, le transporteur, la présence d'un dossier ouvert dans Comptoir et l'état du message de retard (prévu dans la journée, envoyé, annulé, non envoyé avec son motif). _Source : B02-D15, B02-D14, B02-D7, H03_\n4. LE SYSTÈME DOIT rendre la liste consultable par les membres du service client dans Comptoir. _Source : B02-D15_\n\n### Exigence 6 : message de retard au client (lot 2)\n\n**User story :** En tant que client, je veux être prévenu quand ma commande est en retard et savoir quand elle arrivera, afin de ne pas avoir à contacter le service client.\n\n#### Critères d'acceptation\n\n1. QUAND au moins un colis d'une commande atteint le niveau d'alerte client, LE SYSTÈME DOIT programmer un message de retard pour cette commande sans intervention manuelle, sous réserve des règles des exigences 7 et 8. _Source : B01-D5, B02-D4, B01-D8, H02, H03_\n2. LE SYSTÈME DOIT permettre à un administrateur métier de choisir le niveau d'alerte client, `en retard` par défaut, sans nouvelle mise en production. _Source : H02_\n3. LE SYSTÈME DOIT envoyer le message de retard par e-mail en V1. _Source : B02-D5, H01_\n4. LE SYSTÈME DOIT envoyer au plus un message de retard par commande, listant tous les colis de la commande qui ont atteint le niveau d'alerte client au moment de l'envoi. _Source : B02-D4, H05_\n5. QUAND une nouvelle date de livraison est connue pour un colis, LE SYSTÈME DOIT l'indiquer dans le message. _Source : B01-D6_\n6. SI aucune nouvelle date de livraison n'est connue pour un colis, ALORS LE SYSTÈME DOIT utiliser le modèle de message sans date estimée. _Source : B01-D6_\n7. QUAND un message de retard est envoyé, LE SYSTÈME DOIT l'enregistrer dans l'historique de la commande consultable dans Comptoir, avec sa date, son canal, la version du modèle et le contenu envoyé. _Source : B02-D14, H03_\n8. SI le service d'envoi renvoie une erreur, ALORS LE SYSTÈME DOIT retenter l'envoi le nombre de fois paramétré puis marquer le message « non envoyé : erreur technique » dans la liste quotidienne. _Source : B02-D14_\n9. SI l'adresse e-mail du client est absente ou invalide, ALORS LE SYSTÈME DOIT ne pas envoyer le message et le marquer « non envoyé : coordonnées » dans la liste quotidienne. _Source : B02-D14, B02-D5_\n10. QUAND la commande est livrée avant l'envoi d'un message programmé ou en attente de validation, LE SYSTÈME DOIT annuler ce message. _Source : B02-D4_\n\n### Exigence 7 : non-envoi en cas de dossier ouvert (lot 2)\n\n**User story :** En tant que responsable du service client, je veux qu'aucun message automatique ne contredise un échange en cours, afin que le client ne reçoive pas deux discours différents.\n\n#### Critères d'acceptation\n\n1. SI un dossier est ouvert dans Comptoir sur la commande, ALORS LE SYSTÈME DOIT ne pas envoyer le message de retard et indiquer le motif « dossier ouvert » dans la liste quotidienne. _Source : B02-D7, H03_\n2. LE SYSTÈME DOIT vérifier l'absence de dossier ouvert au moment de l'envoi, et non au moment du calcul du retard. _Source : B02-D7_\n3. SI Comptoir ne répond pas lors de cette vérification, ALORS LE SYSTÈME DOIT reporter l'envoi et ne jamais envoyer de message sans vérification. _Source : B02-D7_\n\n### Exigence 8 : validation des messages Premium (lot 3, V2, option)\n\n**User story :** En tant que responsable du service client, je veux pouvoir faire valider par un conseiller les messages destinés aux clients Premium, afin de garder la main sur la relation avec ces clients.\n\n#### Critères d'acceptation\n\n1. OÙ la validation des messages Premium est activée, LE SYSTÈME DOIT placer les messages destinés aux clients Premium dans une file de validation de Comptoir au lieu de les envoyer. _Source : B02-D8, H03_\n2. LE SYSTÈME NE DOIT PAS permettre l'activation de la validation Premium tant que la règle d'identification des clients Premium n'est pas paramétrée. _Source : H03_\n3. QUAND un conseiller valide un message de la file, LE SYSTÈME DOIT appliquer de nouveau la règle du critère 7.1 puis envoyer le message. _Source : B02-D8, B02-D7_\n4. QUAND un conseiller rejette un message de la file, LE SYSTÈME DOIT l'abandonner et enregistrer le motif saisi. _Source : B02-D8, CT-10_\n5. SI un message de la file n'est pas traité dans le délai de validation paramétré, ALORS LE SYSTÈME DOIT appliquer l'action d'expiration paramétrée (envoyer ou abandonner) et le signaler au responsable du service client. _Source : B02-D8, H03_\n6. QUAND un conseiller valide ou rejette un message, LE SYSTÈME DOIT journaliser son identifiant, l'action et l'horodatage. _Source : CT-10_\n\n### Exigence 9 : modèles de message (lot 2)\n\n**User story :** En tant que membre de l'équipe du service client, je veux modifier moi-même le texte des messages, afin d'ajuster la communication sans passer par la DSI.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT permettre au service client de créer, modifier, prévisualiser et activer les modèles de message, par canal et par cas (avec ou sans nouvelle date), sans intervention de la DSI. _Source : B02-D9_\n2. LE SYSTÈME DOIT n'accepter dans les modèles que les variables d'une liste fermée de variables de service validée par la DPO. _Source : B02-D10, CT-03, CT-01_\n3. SI un modèle contient un code promotionnel, un lien vers une offre ou un terme de la liste des termes commerciaux interdits, ALORS LE SYSTÈME DOIT refuser son activation. _Source : B02-D10, CT-03, H06_\n4. LE SYSTÈME DOIT conserver l'historique des versions de chaque modèle, avec leur auteur et leur date d'activation. _Source : B02-D9, CT-10_\n5. QUAND un utilisateur prévisualise un modèle, LE SYSTÈME DOIT afficher le message rempli avec des données synthétiques. _Source : B02-D9, CT-04_\n\n### Exigence 10 : canal SMS (lot 3, V2, option)\n\n**User story :** En tant que directrice des opérations logistiques, je veux pouvoir envoyer l'alerte par SMS une fois ce canal autorisé, afin de toucher les clients qui ne lisent pas leurs e-mails.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT permettre à un administrateur métier de choisir le canal d'envoi (e-mail seul, ou SMS avec repli sur l'e-mail) sans nouvelle mise en production. _Source : H01_\n2. OÙ le canal SMS est activé, LE SYSTÈME DOIT envoyer le message par SMS aux clients dont le numéro de mobile est connu, et par e-mail aux autres. _Source : B01-D5, H01_\n3. LE SYSTÈME NE DOIT PAS permettre l'activation du canal SMS tant que l'avis favorable de la DPO sur l'usage du numéro de mobile n'est pas enregistré dans l'application. _Source : CT-02, H01_\n4. OÙ le canal SMS est activé, LE SYSTÈME DOIT refuser l'activation d'un modèle SMS dont la longueur, variables remplacées par leur longueur maximale, dépasse la longueur maximale paramétrée. _Source : B01-D5, H01_\n\n### Exigence 11 : exigences non fonctionnelles\n\n**User story :** En tant que DSI, je veux une solution dimensionnée pour le pic, hébergée chez Orvanne et conforme au RGPD, afin qu'elle tienne quand elle est la plus utile.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT intégrer les statuts de 70 000 colis expédiés par jour, volume du pic, en respectant le délai de rafraîchissement paramétré du critère 1.6. _Source : B01-D1, B01-D2_\n2. LE SYSTÈME DOIT être hébergé dans le cloud d'Orvanne, dans l'Union européenne. _Source : B01-D9, CT-08_\n3. LE SYSTÈME DOIT supprimer les historiques de statuts et de messages à l'issue d'une durée de conservation paramétrable, fixée avec la DPO. _Source : CT-01_\n4. LE SYSTÈME DOIT journaliser les accès au tableau de bord, les modifications de modèles et de paramètres, et les actions des conseillers sur les messages. _Source : CT-10, CT-01_\n5. LE SYSTÈME DOIT produire chaque jour, avec un export, le nombre de messages de retard programmés, envoyés, annulés, non envoyés par motif, validés, rejetés et expirés, pour le suivi du taux de contacts WISMO. _Source : B02-D11_\n6. QUAND la DPO transmet une demande d'accès ou d'effacement concernant un client, LE SYSTÈME DOIT permettre d'extraire ou de supprimer les messages de retard de ce client. _Source : CT-01_\n7. LE SYSTÈME DOIT pouvoir être mis en service avec l'envoi de messages aux clients désactivé, l'activation se faisant par paramètre sans nouvelle mise en production. _Source : B01-D1, B02-D12, CT-07_\n8. LE SYSTÈME DOIT être testé et démontré uniquement avec des données synthétiques ou anonymisées. _Source : CT-04_\n\n## Hors périmètre\n\n- Code promo dans les messages de retard (`B05-D7`) : interdit dans un message de service par `CT-03` (`H06`). Une offre commerciale relèverait d'un message marketing distinct, soumis au consentement ; renvoyée vers aucun projet (conflit C07, Q07).\n- Planning demandé à la DSI pour la fin de la semaine suivante (`B01-D11`) : livrable de gestion de projet, pas une exigence du système. Le découpage en lots de `tasks.md` sert de base à ce planning, sous réserve de Q03 ; renvoyé vers aucun projet.\n- Mise en service au premier trimestre 2027 (`B02-D13`) : échéance de planning, pas un comportement du système. Elle fixe la date du lot 2 dans `tasks.md`.\n- Mesure du taux de contacts WISMO et de sa baisse de 30 % (`B02-D11`, partie mesure) : les contacts sont comptés par les outils du service client, et la base de référence reste à définir (Q39). Le projet fournit les données d'envoi (critère 11.5).\n- Tableau de bord pour le service client (`B02-D15`) : le service client demande une liste, pas un tableau de bord ; il reçoit la liste quotidienne (exigence 5) et le suivi dans Comptoir (exigence 4).\n- Validation manuelle de chaque message par un conseiller (`B01-D8`) : écartée ; seule la validation optionnelle des messages Premium est prévue (exigence 8, `H03`).\n- Accès partagé aux statuts transporteurs avec le portail de retours (P02) : le référentiel de suivi peut servir P02, mais les besoins de P02 sont spécifiés dans P02.\n\n## Hypothèses\n\n| Id | Hypothèse | Conflit | Réversible |\n|---|---|---|---|\n| H01 | Le canal de l'alerte est un paramètre. La V1 envoie un e-mail à tous les clients concernés. Le SMS n'est activé qu'après analyse de la DPO (CT-02) et accord budgétaire, pour les seuls clients dont le mobile est connu. | C01 | oui |\n| H02 | Le seuil de retard est un paramètre calculé à partir de la date promise affichée sur Vitrine, avec deux niveaux : « à surveiller » à J+1 matin (liste du service client, tableau de bord) et « en retard » à J+2, soit 48 h (alerte au client). La signification des « rouges » (B01-D4) reste à définir. | C02 | oui |\n| H03 | L'alerte part automatiquement (B01-D8). Le service client reçoit chaque matin, avant les envois du jour, la liste des commandes concernées (B02-D15), ce qui répond à B02-D14. Aucune alerte si un dossier est ouvert dans Comptoir (B02-D7). La validation préalable pour les clients Premium (B02-D8) est une option paramétrable, désactivée tant que la catégorie Premium n'est pas définie. | C04 | oui |\n| H04 | Le tableau de bord est rafraîchi à chaque arrivée de statuts dans Passerelle et affiche l'heure de la dernière mise à jour. La fréquence cible est fixée après mesure de la fraîcheur des statuts des 3 transporteurs. | C05 | oui |\n| H05 | Le retard est évalué par colis. Le client reçoit au plus un message par commande, qui liste les colis en retard. | C06 | oui |\n| H06 | L'alerte de retard ne contient ni code promo ni offre commerciale. Une éventuelle offre relève d'un message marketing distinct, hors P01, soumis aux règles de consentement. | C07 | oui |\n\nLe conflit C03 (échéance « pour le pic » contre gel des mises en production) est **bloquant** et n'a pas d'hypothèse : la date du lot 1 n'est pas spécifiée (Q03).\n\n## Questions ouvertes\n\n| Id | Question | Destinataire | Bloquante |\n|---|---|---|---|\n| Q01 | Quel canal pour l'alerte de retard : e-mail, SMS (budget, avis DPO sur l'usage du mobile), ou les deux selon la disponibilité du mobile ? | Solène Garrigue, Yanis Mercadier ; avis d'Hélène Marsac | non (activation de l'exigence 10) |\n| Q02 | À partir de quand une commande est-elle « en retard » : J+1 matin ou 48 h après la date promise ? Le seuil peut-il différer entre la liste du service client, le tableau de bord et l'alerte client ? Que signifient les « rouges » du tableau de bord ? | Solène Garrigue, Yanis Mercadier | non (valeurs des critères 2.5, 3.3, 6.2) |\n| Q03 | Le pic tombe pendant le gel du 16/11 au 11/01. Une dérogation est-elle envisageable pour un tableau de bord interne, sans envoi aux clients, avant le 16/11 ? Sinon, confirmez-vous une mise en service au T1 2027 ? | DSI (Bertrand Lacassagne) | oui (date de mise en service du lot 1, tâche 5) |\n| Q04 | Qu'est-ce qu'un client Premium (lien avec Orvanne+) ? La liste du matin suffit-elle à « savoir » qu'un message part, ou faut-il une validation ? Quel délai de validation pour les Premium, et que se passe-t-il sans validation ? | Yanis Mercadier ; Capucine Lorrain pour le lien avec Orvanne+ | non (activation de l'exigence 8) |\n| Q05 | À quelle fréquence Passerelle reçoit-elle les statuts des 3 transporteurs ? Quel délai de rafraîchissement du tableau de bord est acceptable pour la logistique ? | Solène Garrigue ; DSI (équipe Passerelle) | non (valeur des critères 1.6 et 1.8) |\n| Q06 | Pour une commande à plusieurs colis, le client reçoit-il un message par colis en retard ou un seul message par commande ? | Solène Garrigue, Yanis Mercadier | non (critère 6.4) |\n| Q07 | Confirmez-vous l'abandon du code promo dans les messages de retard (CT-03) ? Souhaitez-vous à la place un message commercial distinct, soumis au consentement ? | Capucine Lorrain ; Hélène Marsac | non |\n| Q34 | L'exigence d'hébergement dans le cloud d'Orvanne (B01) s'applique-t-elle à tous les projets, ou un hébergement dans l'UE chez un éditeur est-il admis (B03, B07-D20) ? | DSI (comité d'architecture) | non (P01 reste dans le cloud d'Orvanne, critère 11.2) |\n| Q36 | Quand pouvez-vous examiner les traitements des projets P01, P02, P03, P04, P06 et P07 (CT-01) ? Lesquels exigent une analyse d'impact ? | Hélène Marsac | non (prérequis du développement, tâche 1.1) |\n| Q39 | Quelle base de référence et quelle période de mesur
