e pour la baisse de 30 % des contacts WISMO et la baisse de 60 % des contacts liés aux retours ? | Yanis Mercadier ; direction de l'expérience client | non |\n\n### Points à ajouter à l'analyse\n\nCes manques des sources n'ont ni question ni hypothèse dans `work/analyse.json`. La spec les traite comme des paramètres ou des vérifications préalables (tâches 1.3, 1.4 et 1.6), sans fixer de valeur :\n\n- origine de la nouvelle date de livraison : transporteur ou calcul interne (B01-F3) ;\n- origine de la date promise de chaque colis et sa disponibilité dans Passerelle (B02-D6) ;\n- découpage des « régions » du tableau de bord (B01-D3) ;\n- définition d'un dossier ouvert dans Comptoir, et comportement si le dossier est clôturé ensuite (B02-F4) ;\n- heure exacte de « J+1 matin » et cas d'une date promise modifiée après la commande (B02-F3) ;\n- format de la liste quotidienne (B02-F9) ;\n- capacités d'extension de Comptoir (encart, liste, file de validation) et service d'envoi des e-mails transactionnels.\n", "design.md": "# Conception : détection des retards de livraison, suivi colis dans Comptoir et information du client\n\n## Vue d'ensemble\n\nLa solution repose sur un **référentiel de suivi des colis**, alimenté par les statuts transporteurs déjà reçus par Passerelle (B01-D10). Un **moteur de retards** calcule le niveau de chaque colis non livré à partir de la date promise affichée sur Vitrine. Trois usages lisent ce référentiel :\n\n- le **tableau de bord** des équipes transport et des responsables d'entrepôt (lot 1) ;\n- les **intégrations Comptoir** du service client : suivi dans la fiche commande, liste quotidienne, historique des messages, puis file de validation Premium (lots 2 et 3) ;\n- le **service de notification**, qui envoie les messages de retard aux clients selon des règles paramétrables (lot 2 pour l'e-mail, lot 3 pour le SMS).\n\n### Choix structurants\n\n| Choix | Raison | Alternative écartée |\n|---|---|---|\n| Un référentiel unique pour les quatre usages | Le tableau de bord, Comptoir, la liste quotidienne et les messages affichent les mêmes niveaux de retard | Un outil par direction : les chiffres divergeraient entre logistique et service client |\n| Seuils, niveau d'alerte, canal, horaires et options paramétrables par un administrateur métier | Les conflits C01, C02, C04 et C05 ne sont pas arbitrés (H01 à H04) ; l'arbitrage ne demandera pas de nouveau développement | Coder une des positions |\n| Retard calculé par colis, un seul message par commande | H05 : descente jusqu'au colis pour la logistique, un discours unique pour le client | Un message par colis |\n| Envois clients derrière un interrupteur global, désactivé à la mise en service | Le lot 1 peut être déployé sans aucun envoi si une dérogation au gel est accordée (Q03, critère 11.7) | Deux applications distinctes |\n| Liste quotidienne publiée avant le premier envoi du jour | Répond à « aucun message sans que l'équipe le sache » (B02-D14) sans validation systématique (B01-D8), selon H03 | Validation de chaque message |\n| Développement interne dans le cloud d'Orvanne, UE | B01-D9, CT-08 | Produit d'un éditeur de suivi de colis |\n| Coordonnées du client lues dans Vitrine au moment de l'envoi, jamais copiées | Minimisation des données personnelles (CT-01, CT-02) | Copie des e-mails et mobiles dans le référentiel |\n\nLes technologies citées ci-dessous sont des **propositions** : les sources n'en imposent aucune.\n\n## Architecture\n\n```mermaid\nflowchart LR\n  subgraph Existant\n    T[3 transporteurs]\n    V[Vitrine]\n    CPT[Comptoir]\n    EM[Service d'envoi e-mail / SMS]\n  end\n  T --> P[Passerelle]\n  V -- commandes, date promise --> P\n  P -- statuts, commandes --> COL[Collecteur de statuts]\n  COL --> REF[(Référentiel de suivi)]\n  REF <--> MOT[Moteur de retards]\n  MOT -- NiveauModifié --> NOT[Service de notification]\n  REF --> API[API de suivi]\n  API --> TDB[Tableau de bord logistique]\n  API --> CPT\n  LQ[Générateur de liste quotidienne] --> CPT\n  REF --> LQ\n  NOT -- dossier ouvert ? / file Premium --> CPT\n  NOT -- coordonnées du client --> V\n  NOT --> EM\n  NOT -- état des messages --> REF\n  BO[Back-office modèles et paramètres] --> MOT\n  BO --> NOT\n  BO --> LQ\n  SUP[Supervision] -.-> COL\n  SUP -.-> NOT\n  IND[Indicateurs quotidiens] --> REF\n```\n\n## Composants et interfaces\n\n| Composant | Responsabilité | Interfaces (entrée / sortie) | Exigences | Lot |\n|---|---|---|---|---|\n| Collecteur de statuts | Consomme les statuts et les commandes publiés par Passerelle ; normalise les codes des 3 transporteurs ; dédoublonne ; mesure la fraîcheur des flux | Entrée : flux Passerelle (format et fréquence à confirmer, Q05). Sortie : écriture dans le référentiel | 1, 11.1 | 1 |\n| Référentiel de suivi | Stocke colis, historique des statuts, niveaux, messages | Base relationnelle (proposition : PostgreSQL), index par commande, transporteur, entrepôt, région, niveau | 1, 2, 11.3 | 1 |\n| Moteur de retards | Calcule le niveau à chaque nouveau statut et lors du recalcul matinal ; publie `NiveauModifié` | Lit les seuils du back-office ; tâche planifiée avant l'heure de publication de la liste | 2 | 1 |\n| API de suivi | Agrégats, listes, détail d'un colis, suivi d'une commande | REST en lecture seule, authentification par le SSO interne (proposition), rôles | 3, 4 | 1 (tableau de bord), 2 (Comptoir) |\n| Tableau de bord | Ventilations, descente jusqu'au colis, rouge et tri, dernière mise à jour, bandeau d'interruption | Application web interne | 3, 1.8, 2.7 | 1 |\n| Intégration Comptoir | Encart de suivi dans la fiche commande, liste quotidienne, historique des messages, file de validation Premium | Selon les capacités d'extension de Comptoir (composant intégré, lien contextuel ou API) : à qualifier (tâche 1.4) | 4, 5.4, 6.7, 8 | 2, 3 |\n| Générateur de liste quotidienne | Construit la liste du matin après le recalcul, la publie, autorise ensuite les envois du jour | Lit le référentiel et l'état des messages ; interroge Comptoir pour les dossiers ouverts | 5 | 2 |\n| Service de notification | Programme, vérifie, construit, envoie, réessaie, annule et journalise les messages | Consomme `NiveauModifié` ; appelle Comptoir (dossier ouvert, file Premium) et Vitrine (coordonnées) ; appelle le service d'envoi (à qualifier, tâche 1.4) | 6, 7, 8, 10 | 2, 3 |\n| Back-office | Modèles versionnés, liste des variables de service, liste des termes interdits, seuils, niveau d'alerte, canal, horaires, tentatives, délai et action d'expiration Premium, règle Premium, avis DPO, interrupteur des envois, durée de conservation | Application web, rôles `admin-metier` et `service-client` | 2.5, 6.2, 9, 10.1, 10.3, 11.3, 11.7 | 1 (seuils, interrupteur), 2, 3 |\n| Supervision | Fraîcheur par transporteur, codes inconnus, erreurs d'envoi, files en attente | Outils de supervision de la DSI | 1.5, 1.7, 1.8, 6.8 | 1 |\n| Indicateurs quotidiens | Compte les messages par état et par motif ; export | Fichier CSV quotidien ou vue dans le Lac (proposition) | 11.5 | 2 |\n\n### Paramètres\n\nLes valeurs initiales marquées « proposition » ne viennent pas des sources ; elles sont à valider par les métiers au paramétrage.\n\n| Paramètre | Valeur initiale | Base |\n|---|---|---|\n| Seuil `à surveiller` | J+1 | H02 |\n| Seuil `en retard` | J+2 | H02 |\n| Niveau affiché en rouge | `en retard` | H02, Q02 |\n| Niveau d'alerte client | `en retard` | H02 |\n| Délai de rafraîchissement du tableau de bord | à fixer après mesure (critère 1.7) | H04, Q05 |\n| Seuil d'interruption d'un flux transporteur | à fixer après mesure (critère 1.7) | H04, Q05 |\n| Heure du recalcul matinal | 5 h 30 (proposition) | B02-D6 « J+1 matin » |\n| Heure de publication de la liste | 7 h 00 (proposition) | B02-D15 « chaque matin » |\n| Heure du premier envoi | après publication de la liste (contrôlé) | H03 |\n| Canal | e-mail seul | H01 |\n| Nombre de tentatives d'envoi | 3 (proposition) | — |\n| Validation Premium | désactivée, verrouillée sans règle Premium | H03 |\n| Délai et action d'expiration Premium | à fixer (Q04) ; « abandonner » proposé comme valeur prudente | Q04 |\n| Interrupteur des envois clients | désactivé | CT-07, critère 11.7 |\n| Durée de conservation | à fixer avec la DPO | CT-01 |\n\n## Flux principaux\n\n### Réception d'un statut et détection du retard\n\n```mermaid\nsequenceDiagram\n  participant P as Passerelle\n  participant C as Collecteur\n  participant R as Référentiel\n  participant M as Moteur de retards\n  participant N as Notification\n  P->>C: statut (colis, code, horodatage d'origine)\n  C->>C: normaliser le code, calculer la clé de dédoublonnage\n  alt statut déjà connu\n    C-->>P: acquitter sans écrire\n  else nouveau statut\n    C->>R: ajouter l'événement, mettre à jour le dernier statut et la fraîcheur du flux\n    C->>M: recalculer le colis\n    M->>R: lire la date promise et les seuils, enregistrer le niveau\n    opt le niveau a changé\n      M->>N: NiveauModifié(commande, colis, ancien, nouveau)\n    end\n  end\n```\n\n### Journée type du service client et envoi des messages\n\n```mermaid\nsequenceDiagram\n  participant M as Moteur de retards\n  participant L as Liste quotidienne\n  participant N as Notification\n  participant CPT as Comptoir\n  participant V as Vitrine\n  participant E as Service d'envoi\n  M->>M: recalcul matinal de tous les colis non livrés\n  M->>L: recalcul terminé\n  L->>CPT: publier la liste (commandes, niveaux, dossiers ouverts, messages prévus)\n  L->>N: envois du jour autorisés\n  N->>N: interrupteur actif ? commande déjà alertée ? regrouper les colis de la commande\n  N->>N: commande livrée entre-temps ? (sinon annuler)\n  N->>CPT: dossier ouvert sur la commande ?\n  alt dossier ouvert\n    N->>N: état « non envoyé : dossier ouvert »\n  else Premium et validation activée (V2)\n    N->>CPT: déposer dans la file de validation\n    CPT-->>N: validé (nouvelle vérification du dossier) / rejeté / expiré\n  else cas général\n    N->>V: lire l'e-mail (et le mobile si le SMS est activé, V2)\n    N->>N: remplir le modèle actif (avec ou sans nouvelle date)\n    N->>E: envoyer\n    N->>CPT: historique de la commande (date, canal, version, contenu)\n  end\n```\n\n## Modèle de données\n\n| Entité | Attributs principaux | Donnée personnelle | Durée de conservation |\n|---|---|---|---|\n| Colis | id colis, n° de suivi, id commande, transporteur, entrepôt, région de livraison, date promise, dernier statut, nouvelle date de livraison, niveau, date du changement de niveau, livré le | non (aucune identité, région seulement) | paramétrable, fixée avec la DPO (11.3) |\n| ÉvénementStatut | id colis, code normalisé, code d'origine, horodatage d'origine, horodatage de réception, clé de dédoublonnage | non | paramétrable (11.3) |\n| FraîcheurFlux | transporteur, dernier statut reçu, médiane et 95e centile quotidiens du délai | non | 13 mois (proposition) |\n| Message | id commande, colis concernés, canal, version du modèle, contenu envoyé, état (programmé, en validation, envoyé, non envoyé, annulé, rejeté, expiré), motif, tentatives, horodatages, conseiller valideur | oui (contenu nominatif) | paramétrable, fixée avec la DPO (11.3) ; extractible et supprimable par client (11.6) |\n| ModèleMessage | canal, cas (avec / sans date), version, texte, auteur, date d'activation, actif | non | conservé (traçabilité, 9.4) |\n| ListeQuotidienne | date, commandes, niveaux, dossier ouvert, état du message | oui (via le n° de commande et le contenu associé) | 30 jours (proposition, à valider par la DPO) |\n| Paramètre | clé, valeur, auteur, date de modification ; dont avis DPO sur le mobile | non | conservé |\n| Journal | utilisateur, action, objet, horodatage | oui (identifiant de l'employé) | à confirmer avec la DPO |\n\nLes adresses e-mail et numéros de mobile ne sont **pas** stockés dans le référentiel : ils sont lus dans Vitrine au moment de l'envoi.\n\n## Gestion des erreurs\n\n| Situation | Comportement | Exigence |\n|---|---|---|\n| Statut reçu en double | Ignoré grâce à la clé (colis, code normalisé, horodatage d'origine) | 1.4 |\n| Code de statut inconnu | Événement stocké avec le code d'origine et le code `inconnu` ; niveau inchangé ; alerte à la supervision | 1.5 |\n| Aucun statut d'un transporteur au-delà du seuil | Bandeau sur le tableau de bord et alerte à la supervision | 1.8 |\n| Date promise absente | Colis exclu du calcul, compté à part (« date promise inconnue ») | 2.7 |\n| Recalcul matinal non terminé à l'heure de publication | Publication retardée jusqu'à la fin du recalcul ; aucun envoi avant publication ; alerte à la supervision | 2.6, 5.2 |\n| API de suivi trop lente pour Comptoir | Délai maximal de 1,5 s côté Comptoir (proposition), puis fiche sans suivi avec un message | 4.2, 4.4 |\n| Comptoir indisponible lors de la vérification du dossier ouvert | Envoi reporté et retenté ; jamais d'envoi sans vérification | 7.3 |\n| Service d'envoi en erreur | Nouvelles tentatives avec délai croissant, puis « non envoyé : erreur technique » | 6.8 |\n| E-mail absent ou invalide | « non envoyé : coordonnées » dans la liste quotidienne | 6.9 |\n| Commande livrée avant l'envoi | Message annulé | 6.10 |\n| Message Premium non traité dans le délai | Action d'expiration paramétrée et signalement au responsable | 8.5 |\n| Modèle contenant un terme commercial | Activation refusée, terme signalé à l'auteur | 9.3 |\n| Tentative d'activer le SMS sans avis DPO enregistré | Activation refusée | 10.3 |\n\n## Sécurité et RGPD\n\n- **Avant le développement (CT-01, Q36)** : le traitement est soumis à la DPO. Points à faire valider : base légale du message de service, durée de conservation (11.3), liste des variables de service (9.2), liste des termes commerciaux interdits (9.3), durée de conservation du journal. L'usage du mobile (CT-02) fait l'objet d'un avis distinct avant le lot 3.\n- **Usage du mobile (CT-02)** : l'activation du SMS est bloquée tant que l'avis favorable de la DPO n'est pas enregistré dans le back-office (10.3).\n- **Contenu des messages (CT-03, H06)** : variables de service uniquement, contrôle des termes commerciaux à l'activation (9.2, 9.3). Le code promo demandé par le marketing (B05-D7) n'est pas réalisable dans ce projet.\n- **Minimisation** : le référentiel ne contient ni nom, ni adresse, ni coordonnées.\n- **Droits des personnes** : les messages d'un client sont extractibles et supprimables (11.6). Ce nouveau stockage est à déclarer au projet de registre des droits (P05) pour son orchestration.\n- **Accès** : SSO interne (proposition), rôles `logistique`, `entrepot`, `service-client`, `admin-metier`, `dsi`. Le tableau de bord est réservé aux rôles du critère 3.5.\n- **Traçabilité (CT-10)** : accès au tableau de bord, validations et rejets, modifications de modèles et de paramètres journalisés (8.6, 9.4, 11.4).\n- **Hébergement (CT-08)** : cloud d'Orvanne, UE (11.2).\n- **Données de test (CT-04)** : jeux synthétiques uniquement, y compris pour la prévisualisation des modèles (9.5, 11.8).\n\n## Volumétrie et performance\n\n| Grandeur | Normal | Pic | Base |\n|---|---|---|---|\n| Colis expédiés par jour | 35 000 | 70 000 | B01-N1, B01-N2 |\n| Colis en cours de suivi (estimation : 3 jours de transit) | ≈ 105 000 | ≈ 210 000 | estimation |\n| Statuts reçus par jour (estimation : 6 par colis) | ≈ 210 000 | ≈ 420 000 | estimation |\n| Débit moyen, et pointe (estimation : ×10) | ≈ 2,5 / s | ≈ 5 / s, pointe ≈ 50 / s | estimation ; arrivées par fichiers du matin possibles (B01-F1), d'où des rafales |\n| Contacts au service client par jour | ≈ 2 600 | > 5 000 | B02-N2, B02-N3 |\n| Ouvertures de fiche avec suivi (estimation : 2 par contact) | ≈ 5 200 | ≈ 10 000 | estimation |\n| Messages de retard par jour | inconnu | inconnu | dépend du taux de retard, non fourni par les sources |\n\nCes volumes restent modestes pour une base relationnelle indexée. Le délai de 2 s dans Comptoir (B02-N4) est tenu en lisant le référentiel, sans appeler les transporteurs en direct ; le test vise ce délai au 99e centile (proposition). Si les statuts arrivent en un fichier quotidien, une rafale de l'ordre de 420 000 statuts doit être intégrée avant le recalcul matinal : le test de charge rejoue cette rafale.\n\n## Stratégie de test\n\n| Niveau | Contenu | Exigences |\n|---|---|---|\n| Unitaire | Calcul des niveaux aux bornes (J, J+1, J+2, livré, date inconnue, seuils modifiés) ; dédoublonnage ; codes inconnus ; règles d'envoi (interrupteur, un message par commande, dossier ouvert, livraison avant envoi, publication de la liste) ; contrôle anti-commercial ; verrous Premium et SMS ; longueur SMS | 1.4, 1.5, 2, 5.2, 6, 7, 8.2, 9.2, 9.3, 10.3, 10.4, 11.7 |\n| Intégration | Flux Passerelle de recette pour les 3 transporteurs ; Comptoir (encart, liste, dossier ouvert, file) et service d'envoi, d'abord avec des bouchons puis en recette ; lecture des coordonnées dans Vitrine | 1.1, 1.3, 4.1, 4.3, 5.4, 6.3, 6.7, 8.1 |\n| Performance | Injection à 100 statuts / s pendant 1 h et rejeu d'une rafale de 420 000 statuts ; 210 000 colis en base ; 99e centile de l'API de suivi inférieur à 2 s | 1.6, 4.2, 11.1 |\n| Résilience | Coupure de Comptoir, du service d'envoi, arrêt du flux d'un transporteur, recalcul en retard | 1.8, 4.4, 6.8, 7.3 |\n| Sécurité et RGPD | Contrôle des rôles, journalisation, purge, extraction et suppression par client, absence de coordonnées dans le référentiel | 3.5, 11.3, 11.4, 11.6 |\n| Recette métier | Logistique : tableau de bord sur une journée synthétique rejouée. Service client : liste quotidienne, encart Comptoir, modèles relus par la DPO. V2 : file Premium, envoi SMS | 3, 4, 5, 6, 8, 9, 10 |\n| Données | Jeux synthétiques uniquement (CT-04) | 11.8 |\n", "tasks.md": "# Plan d'implémentation : détection des retards de livraison, suivi colis dans Comptoir et information du client\n\nLes tâches 1 à 5 forment le **lot 1** : outils internes, sans envoi aux clients. Leur date de mise en service (tâche 5) dépend de la question bloquante **Q03** : dérogation au gel avant le 16 novembre, ou mise en service après le 11 janvier.\nLes tâches 6 à 9 forment le **lot 2** : Comptoir, liste quotidienne et message par e-mail, au T1 2027, après le gel (CT-07).\nLes tâches 10 et 11 forment le **lot 3 (V2)** : validation Premium (après réponse à Q04) et canal SMS (après avis de la DPO sur le mobile, CT-02, et accord budgétaire, Q01).\n\n- [ ] 1. Prérequis et cadrage (aucune dépendance)\n  - [ ] 1.1 Soumettre l'analyse du traitement à la DPO (CT-01, Q36) : base légale du message de service, durée de conservation, liste des variables de service, liste des termes commerciaux interdits ; préparer le dossier mobile (CT-02) pour le lot 3\n    - Livrable : avis écrit de la DPO versé au dossier du projet ; listes validées\n    - _Exigences : 11.3, 9.2, 9.3, 10.3_\n  - [ ] 1.2 Obtenir l'arbitrage de la DSI sur Q03 et produire le planning des lots demandé par la logistique (B01-D11)\n    - Livrable : planning daté des lots 1, 2 et 3, avec ou sans dérogation au gel\n    - _Exigences : 11.7_\n  - [ ] 1.3 Établir avec l'équipe Passerelle le contrat d'interface des statuts et des commandes : couverture des 3 transporteurs, fréquence de réception (Q05), codes de statut, date promise, entrepôt, adresse de livraison, nouvelle date de livraison\n    - Livrable : contrat d'interface signé par l'équipe Passerelle\n    - _Exigences : 1.1, 1.2, 1.3_\n  - [ ] 1.4 Qualifier les capacités d'extension de Comptoir (encart, liste, file de validation, lecture des dossiers ouverts, historique) et le service d'envoi des e-mails transactionnels\n    - Livrable : note de choix d'intégration\n    - _Exigences : 4.1, 5.4, 7.2, 6.3_\n  - [ ] 1.5 Constituer un jeu de données synthétique : 210 000 colis, 3 transporteurs, E1 à E3, commandes multi-colis, dates promises absentes, cas aux bornes J à J+2, dossiers ouverts (CT-04)\n    - _Exigences : 11.8_\n  - [ ] 1.6 Définir avec la logistique et le service client le découpage en régions, la définition d'un dossier ouvert et les valeurs initiales des paramètres\n    - Livrable : fiche de paramétrage initial ; points remontés à l'analyste (section « Points à ajouter à l'analyse »)\n    - _Exigences : 3.1, 2.5, 7.1_\n\n- [ ] 2. Référentiel de suivi et collecte des statuts (dépend de 1.3)\n  - [ ] 2.1 Créer le schéma du référentiel (Colis, ÉvénementStatut, FraîcheurFlux, Paramètre, Journal) et ses index par commande, transporteur, entrepôt, région et niveau\n    - _Exigences : 1.2_\n  - [ ] 2.2 Développer le collecteur : consommation du flux Passerelle, normalisation des codes des 3 transporteurs, conservation du code d'origine, gestion des codes inconnus\n    - _Exigences : 1.1, 1.3, 1.5_\n  - [ ] 2.3 Implémenter le dédoublonnage par clé (colis, code normalisé, horodatage d'origine)\n    - _Exigences : 1.4_\n  - [ ] 2.4 Rattacher chaque colis à sa commande, son entrepôt, sa région de livraison et sa date promise\n    - _Exigences : 1.2_\n  - [ ] 2.5 Intégrer les statuts au fil de l'eau et calculer chaque jour la médiane et le 95e centile du délai de réception par transporteur\n    - _Exigences : 1.6, 1.7_\n  - [ ] 2.6 Mettre en place la supervision de la fraîcheur des flux et l'alerte d'interruption au-delà du seuil paramétré\n    - _Exigences : 1.8_\n  - [ ] 2.7 Écrire les tests unitaires et d'intégration du collecteur : doublons, codes inconnus, 3 transporteurs, interruption de flux\n    - _Exigences : 1.1, 1.3, 1.4, 1.5, 1.8_\n\n- [ ] 3. Moteur de retards (dépend de 2.1)\n  - [ ] 3.1 Calculer le niveau d'un colis à chaque nouveau statut : `à l'heure`, `à surveiller` à J+1, `en retard` à J+2, sortie du suivi à la livraison\n    - _Exigences : 2.1, 2.2, 2.3, 2.4_\n  - [ ] 3.2 Lire les seuils dans les paramètres et exposer leur modification dans un écran d'administration minimal\n    - _Exigences : 2.5_\n  - [ ] 3.3 Planifier le recalcul matinal de tous les colis non livrés, terminé avant l'heure de publication de la liste\n    - _Exigences : 2.6_\n  - [ ] 3.4 Exclure du calcul et compter à part les colis sans date promise\n    - _Exigences : 2.7_\n  - [ ] 3.5 Publier l'événement `NiveauModifié` à chaque changement de niveau\n    - _Exigences : 2.1_\n  - [ ] 3.6 Écrire les tests aux bornes : J, J+1, J+2, livré, date promise absente, modification d'un seuil, recalcul matinal\n    - _Exigences : 2.1, 2.2, 2.3, 2.4, 2.5, 2.6, 2.7_\n\n- [ ] 4. API de suivi et tableau de bord (dépend de 3.1)\n  - [ ] 4.1 Développer l'API de suivi en lecture (agrégats, listes, détail d'un colis), avec authentification, rôles et journalisation des accès\n    - _Exigences : 3.5, 11.4_\n  - [ ] 4.2 Développer l'écran des ventilations par transporteur, entrepôt et région\n    - _Exigences : 3.1_\n  - [ ] 4.3 Développer les listes et le détail d'un colis (commande, historique, date promise, nouvelle date)\n    - _Exigences : 3.2_\n  - [ ] 4.4 Appliquer le rouge au niveau prioritaire paramétré et le tri par ancienneté du retard décroissante\n    - _Exigences : 3.3_\n  - [ ] 4.5 Afficher la dernière mise à jour par transporteur et le bandeau d'interruption de flux\n    - _Exigences : 3.4, 1.8_\n  - [ ] 4.6 Tester la charge du lot 1 : 100 statuts / s pendant 1 h, rafale de 420 000 statuts, 210 000 colis en base\n    - _Exigences : 1.6, 11.1_\n  - [ ] 4.7 Faire la recette métier avec la logistique sur une journée de données synthétiques rejouée\n    - _Exigences : 3.1, 3.2, 3.3, 3.4, 3.5_\n\n- [ ] 5. Mise en service du lot 1 (dépend de 4 et de la réponse à Q03 pour la date)\n  - [ ] 5.1 Livrer l'interrupteur global des envois clients, désactivé, et vérifier qu'aucun envoi n'est possible\n    - _Exigences : 11.7_\n  - [ ] 5.2 Déployer dans le cloud d'Orvanne (UE) et ouvrir les accès aux équipes transport et aux responsables d'entrepôt\n    - _Exigences : 11.2, 3.5_\n\n- [ ] 6. Intégration Comptoir (lot 2, dépend de 1.4 et 4.1)\n  - [ ] 6.1 Ajouter l'encart de suivi des colis dans la fiche commande : dernier statut, horodatage, niveau, historique, pour les 3 transporteurs\n    - _Exigences : 4.1, 4.3_\n  - [ ] 6.2 Limiter l'attente côté Comptoir et afficher le mode dégradé « suivi momentanément indisponible »\n    - _Exigences : 4.2, 4.4_\n  - [ ] 6.3 Produire la liste quotidienne à l'heure paramétrée et la rendre consultable dans Comptoir\n    - _Exigences : 5.1, 5.3, 5.4_\n  - [ ] 6.4 Afficher l'historique des messages de retard dans la fiche commande\n    - _Exigences : 6.7_\n\n- [ ] 7. Back-office des modèles et des paramètres (lot 2, dépend de 1.1 et 3.2)\n  - [ ] 7.1 Gérer les modèles par canal et par cas (avec ou sans date) : création, prévisualisation sur données synthétiques, activation, historique des versions\n    - _Exigences : 9.1, 9.4, 9.5_\n  - [ ] 7.2 Restreindre les variables à la liste fermée validée par la DPO et contrôler les termes commerciaux à l'activation\n    - _Exigences : 9.2, 9.3_\n  - [ ] 7.3 Ajouter les paramètres du lot 2 : niveau d'alerte client, heure de publication, nombre de tentatives, durée de conservation\n    - _Exigences : 6.2, 11.3_\n  - [ ] 7.4 Écrire les tests du contrôle des variables et des termes commerciaux\n    - _Exigences : 9.2, 9.3_\n\n- [ ] 8. Service de notification par e-mail (lot 2, dépend de 3.5, 6.3 et 7.1)\n  - [ ] 8.1 Consommer `NiveauModifié`, programmer le message quand le niveau d'alerte est atteint, regrouper les colis, garantir un seul message par commande\n    - _Exigences : 6.1, 6.4_\n  - [ ] 8.2 N'autoriser les envois du jour qu'après publication de la liste quotidienne\n    - _Exigences : 5.2_\n  - [ ] 8.3 Vérifier l'absence de dossier ouvert dans Comptoir au moment de l'envoi ; reporter l'envoi si Comptoir ne répond pas\n    - _Exigences : 7.1, 7.2, 7.3_\n  - [ ] 8.4 Construire le message avec ou sans nouvelle date, lire l'e-mail dans Vitrine et envoyer par e-mail\n    - _Exigences : 6.3, 6.5, 6.6_\n  - [ ] 8.5 Gérer les erreurs d'envoi (tentatives puis « erreur technique ») et les coordonnées absentes ou invalides\n    - _Exigences : 6.8, 6.9_\n  - [ ] 8.6 Annuler les messages programmés ou en attente quand la commande est livrée\n    - _Exigences : 6.10_\n  - [ ] 8.7 Journaliser chaque message (date, canal, version, contenu, état, motif) et l'inscrire dans l'historique de la commande\n    - _Exigences : 6.7, 11.4_\n  - [ ] 8.8 Écrire les tests unitaires des règles d'envoi : niveau d'alerte, un message par commande, publication préalable, dossier ouvert, Comptoir indisponible, erreurs, coordonnées, livraison avant envoi\n    - _Exigences : 5.2, 6.1, 6.2, 6.4, 6.8, 6.9, 6.10, 7.1, 7.2, 7.3_\n\n- [ ] 9. Indicateurs, conservation, droits et recette du lot 2 (dépend de 6, 7 et 8)\n  - [ ] 9.1 Produire et exporter les indicateurs quotidiens des messages par état et par motif\n    - _Exigences : 11.5_\n  - [ ] 9.2 Implémenter la purge automatique selon la durée de conservation paramétrée\n    - _Exigences : 11.3_\n  - [ ] 9.3 Implémenter l'extraction et la suppression des messages d'un client, et déclarer ce stockage au projet P05\n    - _Exigences : 11.6_\n  - [ ] 9.4 Tester la charge et la résilience de bout en bout : pic, coupure de Comptoir, coupure du service d'envoi\n    - _Exigences : 4.2, 4.4, 7.3, 11.1_\n  - [ ] 9.5 Faire la recette métier avec le service client : encart Comptoir, liste quotidienne, messages reçus, modèles relus par la DPO\n    - _Exigences : 4.1, 5.1, 5.3, 6.1, 6.5, 6.6, 9.1_\n  - [ ] 9.6 Mettre en service après le 11 janvier, canal e-mail seul, puis activer l'interrupteur des envois\n    - _Exigences : 6.3, 11.2, 11.7_\n\n- [ ] 10. Validation des messages Premium (lot 3, dépend de 8 et de la réponse à Q04)\n  - [ ] 10.1 Paramétrer la règle d'identification des clients Premium et verrouiller l'option tant qu'elle est absente\n    - _Exigences : 8.2_\n  - [ ] 10.2 Déposer les messages Premium dans la file de validation de Comptoir\n    - _Exigences : 8.1_\n  - [ ] 10.3 Traiter la validation (nouvelle vérification du dossier ouvert puis envoi) et le rejet motivé, avec journalisation du conseiller\n    - _Exigences : 8.3, 8.4, 8.6_\n  - [ ] 10.4 Appliquer l'action d'expiration paramétrée et signaler le message au responsable du service client\n    - _Exigences : 8.5_\n  - [ ] 10.5 Écrire les tests et faire la recette de la file Premium avec le service client\n    - _Exigences : 8.1, 8.2, 8.3, 8.4, 8.5, 8.6_\n\n- [ ] 11. Canal SMS (lot 3, dépend de 8, de l'avis de la DPO sur le mobile et de la réponse à Q01)\n  - [ ] 11.1 Ajouter le paramètre de canal (e-mail seul, SMS avec repli sur l'e-mail)\n    - _Exigences : 10.1_\n  - [ ] 11.2 Verrouiller l'activation du SMS tant que l'avis favorable de la DPO n'est pas enregistré\n    - _Exigences : 10.3_\n  - [ ] 11.3 Lire le mobile dans Vitrine au moment de l'envoi, envoyer par SMS, sinon par e-mail\n    - _Exigences : 10.2_\n  - [ ] 11.4 Contrôler la longueur des modèles SMS à l'activation\n    - _Exigences : 10.4_\n  - [ ] 11.5 Écrire les tests du canal SMS : verrou, repli sur l'e-mail, longueur\n    - _Exigences : 10.1, 10.2, 10.3, 10.4_\n"}, "portail-retours": {"requirements.md": "# Exigences : portail de retours en libre-service, remboursement et visibilité des entrepôts\n\n<!-- Projet P02, slug portail-retours. Commanditaire : direction de l'expérience client.\n     Parties prenantes : DSI, service client, contrôle de gestion et DAF, marketing, exploitation entrepôt E2,\n     direction marketplace, direction juridique et conformité (DPO). Sources : B03, B04, B09 (MKP-06). -->\n\n## Introduction\n\nAujourd'hui, un client qui veut retourner un article doit contacter le service client, qui crée la demande dans Comptoir et envoie l'étiquette par e-mail. Ce parcours représente environ 900 demandes par jour ouvré, avec un délai moyen de 2,5 jours entre la demande et la réception de l'étiquette (B03). L'entrepôt E2 reçoit environ 1 100 colis retour par jour, dont 1 sur 5 n'est pas conforme à l'ouverture ; le contrôle a lieu 3 à 6 jours après la réception, 10 jours en janvier (B04).\n\nLe portail doit permettre au client de déclarer un retour et d'obtenir son étiquette en moins de 3 minutes sans contacter un conseiller, réduire de 60 % les contacts liés aux retours en 6 mois, et donner aux entrepôts la liste des retours attendus (B03, objectifs O1 à O3).\n\nPlusieurs règles ne sont pas arbitrées : moment du remboursement (C08), délai de retour (C09), gratuité (C10), retours marketplace (C11), montant selon la note A / B / C (C12), accès sans compte (C13), RMA imprimé (C14). La spec les traite par des **paramètres** modifiables sans mise en production, avec une valeur par défaut prudente (hypothèses H07 à H13).\n\nLe projet est livré en deux lots :\n- **Lot 1** (exigences 1 à 11) : portail pour les articles vendus et expédiés par Orvanne, remboursement, liste prévisionnelle pour les entrepôts, création et correction par le service client. Mise en service d'un pilote au plus tôt le 12 janvier 2027, après le gel des mises en production du 16 novembre au 11 janvier (`CT-07`) et après l'avis de la DPO (`CT-01`), selon `H14`.\n- **Lot 2** (exigences 12 à 14) : photos jointes par le client, retours des articles marketplace et suivi par le vendeur (MKP-06), option de bon d'achat. Date à fixer après le pilote.\n\nLe remboursement des retours marketplace n'est pas spécifié : il dépend du circuit vendeur, non décrit (`Q11`).\n\n## Glossaire\n\n- **Retour** : demande d'un client portant sur un ou plusieurs articles d'une même commande, identifiée par un numéro de retour.\n- **Étiquette** : étiquette transporteur prépayée (PDF et QR code) obtenue par l'API du transporteur.\n- **RMA** : autorisation de retour, document PDF à imprimer et à placer dans le colis pour que l'entrepôt retrouve la commande.\n- **Statut du retour** : étape visible du client : `déclaré`, `déposé`, `reçu`, `remboursé`.\n- **Premier scan** : premier événement de suivi du colis retour émis par le transporteur et reçu via Passerelle.\n- **Note de contrôle** : note de la grille A / B / C attribuée au contrôle qualité en entrepôt (A remis en stock, B déstockage, C rebut).\n- **Déclencheur du remboursement** : événement qui lance le remboursement : premier scan, réception en entrepôt ou contrôle qualité.\n- **Frais de retour** : montant éventuellement retenu sur le remboursement, paramétré par motif.\n- **Catégorie de client** : population à laquelle s'applique un paramètre ; en V1, « tous les clients » et « membres Orvanne+ ».\n- **Liste prévisionnelle** : fichier quotidien des retours attendus par entrepôt, transmis à Hangar.\n- **Signalement** : demande de traitement manuel créée dans Comptoir pour un retour noté C.\n- **Administrateur métier** : personne de la direction de l'expérience client habilitée à modifier les paramètres.\n\n## Exigences\n\n### Exigence 1 : accès au portail et identification de la commande\n\n**User story :** En tant que client, je veux retrouver ma commande avec ou sans compte, afin de déclarer un retour sans contacter le service client.\n\n#### Critères d'acceptation\n\n1. QUAND un client saisit un numéro de commande et l'adresse e-mail utilisée lors de l'achat qui correspondent, LE SYSTÈME DOIT afficher cette commande sans exiger de création de compte. _Source : B03-D8, H12_\n2. QUAND un client connecté à son compte Vitrine ouvre le portail depuis une de ses commandes, LE SYSTÈME DOIT afficher cette commande sans nouvelle saisie d'identification. _Source : B03-D11, H12_\n3. PENDANT QUE le client accède au portail sans compte, LE SYSTÈME DOIT limiter l'accès à la seule commande saisie et à ses retours. _Source : H12, CT-01_\n4. SI le numéro de commande et l'adresse e-mail ne correspondent pas, ALORS LE SYSTÈME DOIT afficher un message unique qui n'indique pas laquelle des deux valeurs est erronée. _Source : H12, CT-01_\n5. SI le nombre de tentatives échouées pour un même numéro de commande dépasse le seuil paramétré sur la fenêtre de temps paramétrée, ALORS LE SYSTÈME DOIT refuser toute nouvelle tentative pour ce numéro pendant la durée de blocage paramétrée. _Source : H12, CT-01_\n6. LE SYSTÈME DOIT lire les commandes et les livraisons dans le système de gestion des commandes, via Passerelle. _Source : B03-D24_\n\n### Exigence 2 : éligibilité des articles au retour\n\n**User story :** En tant que client, je veux savoir pour chaque article s'il peut être retourné et jusqu'à quand, afin de ne pas déclarer un retour qui sera refusé.\n\n#### Critères d'acceptation\n\n1. QUAND une commande est affichée, LE SYSTÈME DOIT indiquer pour chaque article s'il est éligible au retour et, s'il ne l'est pas, la raison. _Source : B03-D9_\n2. LE SYSTÈME DOIT considérer comme éligibles uniquement les articles vendus et expédiés par Orvanne, livrés en France métropolitaine et commandés sur Vitrine (site web ou application mobile). _Source : B03-D4_\n3. LE SYSTÈME DOIT calculer la date limite de retour à partir de la date de livraison, avec un délai paramétré par catégorie de client, fixé à 14 jours pour tous les clients et à 30 jours pour les membres Orvanne+ à la mise en service. _Source : B03-D10, B04-D4, B04-D5, H08_\n4. LE SYSTÈME DOIT afficher la date limite de retour de chaque article éligible. _Source : B03-D9, H08_\n5. LE SYSTÈME DOIT rendre non éligibles les articles des catégories exclues, dont la liste est paramétrable et contient au moins l'hygiène, les produits personnalisés et les denrées. _Source : B03-D10_\n6. QUAND un article est vendu par un vendeur partenaire de la marketplace, LE SYSTÈME DOIT l'afficher comme non éligible au portail, avec un renvoi vers le circuit de retour actuel. _Source : B03-D5, H10_\n7. QUAND un article est un article volumineux livré sur rendez-vous, LE SYSTÈME DOIT l'afficher comme non éligible au portail, avec un renvoi vers le service client. _Source : B03-D6_\n8. LE SYSTÈME NE DOIT PAS proposer d'échange et doit indiquer au client qu'un échange se fait par un retour suivi d'une nouvelle commande. _Source : B03-D7_\n9. SI la date de livraison d'un article n'est pas connue, ALORS LE SYSTÈME DOIT afficher l'article comme non éligible en ligne, avec un renvoi vers le service client. _Source : B03-D9, B03-D24_\n10. LE SYSTÈME DOIT limiter la quantité retournable d'un article à la quantité livrée, diminuée des quantités déjà déclarées dans d'autres retours de la commande. _Source : B03-D11_\n\n### Exigence 3 : déclaration du retour\n\n**User story :** En tant que client, je veux sélectionner les articles, la quantité, le motif et le mode de retour, afin d'obtenir mon étiquette en quelques minutes.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT permettre au client de sélectionner un ou plusieurs articles éligibles, une quantité par article et un motif par article choisi dans une liste fermée. _Source : B03-D11_\n2. LE SYSTÈME DOIT permettre à un administrateur métier de gérer la liste fermée des motifs, chaque motif indiquant s'il relève d'un article défectueux ou d'une erreur de préparation, la liste contenant au moins « article endommagé ». _Source : B03-D11, B03-D17, B04-D6, H09_\n3. LE SYSTÈME DOIT proposer au client deux modes de retour : dépôt en point relais ou enlèvement à domicile. _Source : B03-D12_\n4. QUAND le client a sélectionné ses articles et son mode de retour, LE SYSTÈME DOIT afficher avant confirmation un récapitulatif comprenant le montant prévisionnel du remboursement, les frais de retour éventuels et le moyen de paiement d'origine. _Source : B03-D27, H09_\n5. LE SYSTÈME DOIT permettre à un client de déclarer un retour standard et d'obtenir son étiquette en moins de 3 minutes, de l'accès au portail à l'affichage de l'étiquette, sans contact avec un conseiller. _Source : B03-D1_\n6. LE SYSTÈME DOIT mesurer, pour chaque retour déclaré sur le portail, la durée entre l'accès à la commande et l'affichage de l'étiquette. _Source : B03-D1_\n\n### Exigence 4 : étiquette prépayée et RMA\n\n**User story :** En tant que client, je veux recevoir une étiquette prépayée et le document à glisser dans le colis, afin d'expédier mon retour sans autre démarche ; en tant qu'opérateur d'entrepôt, je veux retrouver la commande à l'ouverture du colis.\n\n#### Critères d'acceptation\n\n1. QUAND le client confirme sa déclaration, LE SYSTÈME DOIT obtenir une étiquette prépayée auprès de l'API du transporteur et la fournir au format PDF et sous forme de QR code. _Source : B03-D13, B03-D25_\n2. QUAND l'étiquette est obtenue, LE SYSTÈME DOIT l'afficher au client et l'envoyer par e-mail à l'adresse utilisée lors de l'achat. _Source : B03-D13_\n3. QUAND l'étiquette est obtenue, LE SYSTÈME DOIT générer un RMA en PDF, à imprimer et à placer dans le colis, qui porte le numéro de retour, le numéro de commande, les articles et quantités retournés et un code-barres lisible à la douchette. _Source : B04-D15, H13_\n4. LE SYSTÈME DOIT rattacher l'étiquette et le RMA au même numéro de retour, de sorte que la commande soit retrouvée à partir de l'un ou de l'autre. _Source : B04-D15, H13_\n5. SI l'API du transporteur ne fournit pas l'étiquette, ALORS LE SYSTÈME DOIT enregistrer la déclaration, informer le client que l'étiquette lui sera envoyée par e-mail, et relancer la demande d'étiquette selon la politique de reprise paramétrée. _Source : B03-D13, B03-D25_\n6. LE SYSTÈME NE DOIT PAS inclure d'offre commerciale dans les e-mails du portail (étiquette, RMA, suivi). _Source : CT-03_\n\n### Exigence 5 : suivi de l'avancement du retour\n\n**User story :** En tant que client, je veux suivre l'avancement de mon retour, afin de savoir quand je serai remboursé sans appeler le service client.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT afficher au client le statut de son retour parmi `déclaré`, `déposé`, `reçu` et `remboursé`, avec la date de chaque étape franchie. _Source : B03-D14_\n2. QUAND Passerelle reçoit le premier scan du colis retour par le transporteur, LE SYSTÈME DOIT passer le retour au statut `déposé`. _Source : B03-D14, B03-D15_\n3. QUAND l'entrepôt enregistre la réception du colis retour, LE SYSTÈME DOIT passer le retour au statut `reçu`. _Source : B03-D14, H07_\n4. PENDANT QUE le déclencheur du remboursement est la réception en entrepôt ou le contrôle qualité, LE SYSTÈME DOIT n'afficher le statut `remboursé` qu'après le statut `reçu`. _Source : B03-D14, H07_\n5. LE SYSTÈME DOIT donner accès au suivi par les mêmes moyens que l'accès à la commande (exigence 1) et par un lien présent dans l'e-mail de l'étiquette. _Source : B03-D14, H12_\n\n### Exigence 6 : résultat du contrôle qualité\n\n**User story :** En tant que responsable d'entrepôt, je veux que la note de contrôle de chaque retour soit enregistrée, afin que le remboursement et le traitement des articles non conformes en dépendent.\n\n#### Critères d'acceptation\n\n1. QUAND l'entrepôt transmet le résultat du contrôle d'un retour, LE SYSTÈME DOIT enregistrer la note A, B ou C, la date du contrôle, l'entrepôt et la destination associée (A remis en stock, B déstockage, C rebut). _Source : B04-D11_\n2. SI le résultat transmis ne porte pas une note A, B ou C ou ne correspond à aucun retour reçu, ALORS LE SYSTÈME DOIT le rejeter et le signaler à la supervision. _Source : B04-D11_\n3. LE SYSTÈME NE DOIT PAS faire varier le montant remboursé selon la note A, B ou C. _Source : B04-D12, H11_\n4. SI la note d'un retour est C, ALORS LE SYSTÈME DOIT créer un signalement dans Comptoir et, si le remboursement n'est pas encore déclenché, le suspendre jusqu'à la décision d'un conseiller. _Source : H11_\n5. QUAND un conseiller traite un signalement, LE SYSTÈME DOIT enregistrer sa décision (remboursement du montant prévu ou blocage) avec un motif obligatoire et l'identité du conseiller. _Source : H11, CT-10_\n\n### Exigence 7 : remboursement\n\n**User story :** En tant que client, je veux être remboursé automatiquement sur mon moyen de paiement ; en tant que DAF, je veux que le moment du remboursement soit un réglage, afin d'appliquer la décision du codir sans redévelopper.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT déclencher automatiquement le remboursement à l'événement paramétré : premier scan, réception en entrepôt ou contrôle qualité. _Source : B03-D15, B04-D2, H07_\n2. LE SYSTÈME DOIT utiliser le contrôle qualité comme déclencheur pour tous les clients à la mise en service. _Source : B04-D2, H07_\n3. LE SYSTÈME DOIT permettre de fixer un déclencheur différent par catégorie de client, notamment pour les membres Orvanne+. _Source : B04-D3, H07_\n4. QUAND le remboursement est déclenché, LE SYSTÈME DOIT demander au prestataire de paiement de rembourser le client sur le moyen de paiement d'origine. _Source : B03-D26, B03-D27_\n5. LE SYSTÈME DOIT calculer le montant remboursé comme le montant payé pour les articles retournés, diminué des frais de retour applicables à leur motif. _Source : B03-D27, H09_\n6. LE SYSTÈME DOIT appliquer des frais de retour paramétrés par motif, égaux à 0 pour tous les motifs à la mise en service. _Source : B03-D29, B04-D8, H09_\n7. OÙ une retenue est activée pour les motifs qui ne relèvent ni d'un article défectueux ni d'une erreur de préparation, LE SYSTÈME DOIT déduire le montant paramétré (4,90 € envisagés) du remboursement. _Source : B04-D6, B04-D7, H09_\n8. LE SYSTÈME DOIT émettre au plus une demande de remboursement aboutie par article retourné, y compris en cas de nouvelle tentative. _Source : B03-D26_\n9. QUAND le prestataire de paiement confirme le remboursement, LE SYSTÈME DOIT passer le retour au statut `remboursé` et enregistrer la référence de l'opération. _Source : B03-D14, B03-D26_\n10. SI le prestataire de paiement refuse le remboursement ou ne répond pas après les reprises paramétrées, ALORS LE SYSTÈME DOIT créer un signalement dans Comptoir et ne pas afficher le statut `remboursé`. _Source : B03-D26_\n\n### Exigence 8 : visibilité des entrepôts sur les retours attendus\n\n**User story :** En tant que responsable d'entrepôt, je veux connaître chaque jour les retours attendus, afin de préparer la réception et le contrôle.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT déterminer l'entrepôt de destination de chaque retour selon une règle de routage paramétrable. _Source : B03-D16_\n2. LE SYSTÈME DOIT transmettre chaque jour à Hangar, par fichier et à l'heure paramétrée, la liste prévisionnelle des retours attendus pour chaque entrepôt. _Source : B03-D3, B03-D16, B03-D28_\n3. LE SYSTÈME DOIT inclure dans la liste prévisionnelle, pour chaque retour déclaré et non encore reçu : numéro de retour, numéro de RMA, numéro de commande, articles, quantités, motifs, transporteur, numéro de suivi et date de premier scan si elle est connue. _Source : B03-D16, B04-D15_\n4. SI Hangar n'a pas acquitté le fichier du jour dans le délai paramétré, ALORS LE SYSTÈME DOIT alerter la supervision et permettre de renvoyer le fichier. _Source : B03-D28_\n5. LE SYSTÈME DOIT permettre aux entrepôts de retrouver un retour et sa commande à partir du numéro de RMA, du numéro de suivi de l'étiquette ou du numéro de commande. _Source : B03-D3, B04-D15_\n\n### Exigence 9 : création et correction par le service client\n\n**User story :** En tant que conseiller du service client, je veux créer ou corriger un retour pour le compte d'un client depuis Comptoir, afin de traiter les cas que le client ne peut pas faire seul.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT permettre à un conseiller de créer depuis Comptoir un retour pour le compte d'un client, avec les règles d'éligibilité de l'exigence 2. _Source : B03-D18_\n2. LE SYSTÈME DOIT permettre à un conseiller de corriger les articles, les quantités, les motifs et le mode de retour d'un retour existant. _Source : B03-D18_\n3. QUAND une correction modifie les articles, les quantités ou le mode d'un retour au statut `déclaré`, LE SYSTÈME DOIT générer une nouvelle étiquette et un nouveau RMA, invalider les précédents et les envoyer au client par e-mail. _Source : B03-D18, H13_\n4. LE SYSTÈME DOIT afficher dans Comptoir, pour une commande, ses retours avec leur statut, leur historique et leurs signalements. _Source : B03-D18_\n5. QUAND un conseiller crée, corrige un retour ou traite un signalement, LE SYSTÈME DOIT journaliser l'identifiant du conseiller, l'horodatage, l'action, le retour concerné et les valeurs avant et après, comme preuve d'exécution. _Source : B03-D23, CT-10_\n\n### Exigence 10 : indicateurs\n\n**User story :** En tant que commanditaire, je veux mesurer l'usage du portail et les délais de traitement, afin de suivre les objectifs O1 et O2 et d'éclairer la décision sur le moment du remboursement.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT produire chaque jour le nombre de retours déclarés sur le portail, de retours créés et de retours corrigés par le service client, ainsi que la durée médiane et le 90e centile de la durée mesurée au critère 3.6. _Source : B03-D1, B03-D2_\n2. LE SYSTÈME DOIT produire chaque jour, par entrepôt, les délais médians entre réception et contrôle et entre déclencheur et remboursement, ainsi que la répartition des notes A, B et C. _Source : B04-D11, H07_\n\n### Exigence 11 : exigences non fonctionnelles, conformité et paramétrage\n\n**User story :** En tant que DSI, je veux un portail disponible, rapide, accessible, hébergé dans l'UE et conforme au RGPD, dont les règles métier se règlent sans mise en production, afin de l'ouvrir au public en sécurité.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT offrir une disponibilité d'au moins 99,5 %, mesurée chaque mois. _Source : B03-D19_\n2. LE SYSTÈME DOIT afficher les pages du portail en moins de 2 secondes pour 95 % des requêtes, jusqu'à 300 utilisateurs simultanés. _Source : B03-D20_\n3. LE SYSTÈME DOIT être hébergé dans l'Union européenne. _Source : B03-D21, CT-08_\n4. LE SYSTÈME DOIT proposer une interface conforme au RGAA et utilisable sur mobile. _Source : B03-D22, CT-09_\n5. LE SYSTÈME DOIT permettre à un client non accompagné de réaliser un retour standard de bout en bout sur mobile lors des tests utilisateurs. _Source : B03-D31, CT-09_\n6. LE SYSTÈME DOIT rester fermé aux clients tant que l'avis de la DPO sur le traitement n'est pas enregistré. _Source : CT-01, B03-D21_\n7. LE SYSTÈME DOIT conserver les retours, étiquettes, remboursements et journaux pendant des durées paramétrables fixées avec la DPO, puis les supprimer automatiquement. _Source : CT-01, B03-D21_\n8. LE SYSTÈME DOIT permettre à un administrateur métier de modifier sans mise en production les délais de retour, les catégories exclues, les motifs, les frais et le déclencheur du remboursement, en conservant l'auteur, la date et l'ancienne valeur de chaque modification. _Source : CT-07, H07, H08, H09_\n9. OÙ le mode pilote est activé, LE SYSTÈME DOIT limiter l'accès au portail aux commandes du périmètre pilote paramétré et renvoyer les autres vers le circuit actuel. _Source : B03-D30, H14_\n10. LE SYSTÈME DOIT réserver les écrans internes aux rôles habilités (service client, entrepôt, administrateur métier, DSI), authentifiés par le SSO interne. _Source : CT-01, CT-10_\n11. LE SYSTÈME DOIT utiliser exclusivement des données synthétiques ou anonymisées dans ses environnements de test et de démonstration. _Source : CT-04_\n\n### Exigence 12 : photos jointes par le client (lot 2)\n\n**User story :** En tant que client, je veux joindre des photos d'un article endommagé ; en tant qu'exploitation entrepôt, je veux les voir avant la réception, afin d'anticiper le contrôle.\n\n#### Critères d'acceptation\n\n1. OÙ la fonction photos est activée, LE SYSTÈME DOIT permettre au client de joindre jusqu'à 3 photos à un article dont le motif est « article endommagé ». _Source : B03-D17_\n2. SI une photo dépasse la taille maximale paramétrée ou n'est pas dans un format d'image accepté, ALORS LE SYSTÈME DOIT la refuser en indiquant la raison au client. _Source : B03-D17_\n3. QUAND un retour accompagné de photos figure dans la liste prévisionnelle, LE SYSTÈME DOIT permettre à l'exploitation de l'entrepôt de destination de consulter ces photos avant la réception du colis. _Source : B04-D1_\n4. LE SYSTÈME DOIT traiter les photos comme des données personnelles : accès réservé aux rôles service client et entrepôt de destination, durée de conservation paramétrée, suppression avec le retour. _Source : CT-06, CT-01_\n5. LE SYSTÈME DOIT bloquer l'activation de la fonction photos tant que l'avis de la DPO sur ce traitement n'est pas enregistré. _Source : CT-06, CT-01_\n\n### Exigence 13 : retours des articles marketplace (lot 2)\n\n**User story :** En tant que conseiller du service client, je veux que les retours d'articles marketplace passent aussi par le portail ; en tant que vendeur, je veux suivre les retours déclarés sur mes articles.\n\n#### Critères d'acceptation\n\n1. OÙ les retours marketplace sont activés, LE SYSTÈME DOIT rendre éligibles les articles des vendeurs partenaires selon des règles d'éligibilité paramétrées pour la marketplace. _Source : B04-D9, H10_\n2. OÙ les retours marketplace sont activés, LE SYSTÈME DOIT obtenir pour ces articles une étiquette à destination du vendeur, distincte des étiquettes vers les entrepôts d'Orvanne. _Source : B04-D10, H10_\n3. LE SYSTÈME NE DOIT PAS inclure les retours d'articles marketplace dans la liste prévisionnelle transmise à Hangar. _Source : B04-D10_\n4. QUAND une commande contient des articles d'Orvanne et d'un ou plusieurs vendeurs, LE SYSTÈME DOIT créer un retour et une étiquette par destinataire. _Source : B04-D10, H10_\n5. LE SYSTÈME DOIT mettre à disposition de l'espace vendeur (P07) les retours déclarés sur les articles du vendeur : numéro de retour, articles, quantités, motifs, statut et dates. _Source : B09-D8, H10_\n\n### Exigence 14 : bon d'achat à la place du remboursement (lot 2)\n\n**User story :** En tant que client, je veux pouvoir choisir un bon d'achat majoré au lieu d'un remboursement, afin de bénéficier d'un montant supérieur.\n\n#### Critères d'acceptation\n\n1. OÙ l'option bon d'achat est activée (elle est désactivée à la livraison), LE SYSTÈME DOIT proposer au client, dans le récapitulatif, le choix entre le remboursement sur le moyen de paiement d'origine et un bon d'achat majoré du taux paramétré (5 % envisagés). _Source : B04-D14_\n2. QUAND le client a choisi le bon d'achat, LE SYSTÈME DOIT émettre le bon d'achat au déclencheur du remboursement, au lieu de solliciter le prestataire de paiement. _Source : B04-D14, H07_\n3. LE SYSTÈME NE DOIT PAS promouvoir le bon d'achat dans les e-mails de service du portail. _Source : CT-03, B04-D14_\n\n## Hors périmètre\n\n- Application douchette de saisie de la note et de la photo au contrôle qualité (`B04-D13`) : même écran que la déclaration de casse, renvoyée vers P03. Le portail reçoit la note par l'interface du critère 6.1.\n- Suivi du taux de retour par produit (`B04-D16`) : indicateur analytique du Lac, à l'état d'idée, sans porteur (`Q32`) ; aucun projet.\n- Chiffrage du coût du remboursement anticipé avant le codir (`B04-D17`) : action du contrôle de gestion, pas une exigence du système. Le résultat alimente la décision sur le déclencheur (critère 7.1) ; les indicateurs du critère 10.2 serviront à le réviser après le pilote.\n- Réduction du montant remboursé selon la note (`B04-D12`) : écartée en V1 par `H11` en attendant l'avis juridique (`Q12`). Le critère 6.3 l'interdit explicitement.\n- Remboursement des retours marketplace (`B04-D9`, `B04-D10`) : non spécifié, le circuit vendeur et le payeur du remboursement n'étant pas décrits (`Q11`).\n- Mouvements de stock consécutifs à la note (remise en stock, déstockage, rebut) : réalisés dans Hangar, hors du portail.\n- Mesure du taux de contacts liés aux retours (objectif O2, `B03-D2`) : elle relève des outils du service client ; le portail fournit ses propres données (critère 10.1). La base de référence est à fixer (`Q39`).\n\n## Hypothèses\n\n| Id | Hypothèse | Conflit | Réversible |\n|---|---|---|---|\n| H07 | Le déclencheur du remboursement est un paramètre (premier scan, réception en entrepôt, contrôle qualité). La V1 rembourse après le contrôle qualité ; le statut « reçu » précède « remboursé ». | C08 | oui |\n| H08 | Le délai d'éligibilité est un paramètre par catégorie de client : 14 jours après livraison pour tous, 30 jours pour les membres Orvanne+. | C09 | oui |\n| H09 | Les frais de retour sont un paramètre par motif, à 0 pour tous les motifs au départ. La retenue de 4,90 (euros supposés) hors défaut ou erreur de préparation s'active sans développement si elle est décidée et inscrite dans les CGV. | C10 | oui |\n| H10 | La V1 exclut les articles marketplace, affichés comme non éligibles avec un renvoi vers le circuit actuel. Les retours marketplace et leur suivi par le vendeur (MKP-06) forment la V2. | C11 | oui |\n| H11 | En V1, le montant remboursé ne dépend pas de la note A / B / C. Une note C déclenche un signalement pour traitement manuel par le service client, sans réduction automatique. | C12 | oui |\n| H12 | Le portail est accessible sans compte (numéro de commande et e-mail d'achat) et depuis le compte du client connecté. EF-03 s'applique aux deux parcours ; l'accès sans compte ne donne accès qu'à la commande saisie. | C13 | oui |\n| H13 | Le portail produit, avec l'étiquette, un RMA en PDF à imprimer et placer dans le colis. Le cas du client sans imprimante reste ouvert. | C14 | oui |\n| H14 | Le pilote est mis en service au plus tôt le 12 janvier, après le gel et après consultation de la DPO. Si la fenêtre avant les soldes d'hiver est trop courte, le pilote est décalé après les soldes. | C15 | oui |\n\n## Questions ouvertes\n\n| Id | Question | Destinataire | Bloquante |\n|---|---|---|---|\n| Q08 | À quel moment rembourser un retour : premier scan, réception ou contrôle en entrepôt ? Un remboursement anticipé est-il prévu pour certains clients, lesquels ? | DAF, puis codir ; chiffrage par Odile (contrôle de gestion) | non (valeur du paramètre des critères 7.1 à 7.3) |\n| Q09 | Quel délai de retour : 14 jours pour tous et 30 jours pour Orvanne+, ou 30 jours pour tous ? Que disent les CGV ? | Direction de l'expérience client ; direction juridique et conformité | non (valeur du paramètre du critère 2.3) |\n| Q10 | Les retours sont-ils gratuits pour tous, ou 4,90 € sont-ils retenus hors défaut et erreur de préparation ? Jusqu'à quand dure la gratuité « pour le lancement » ? | DAF ; direction de l'expérience client ; Capucine Lorrain | non (valeurs des critères 7.6 et 7.7) |\n| Q11 | Les retours marketplace entrent-ils en V1 ou en V2 ? Qui fournit les étiquettes et le circuit vers les vendeurs, et qui rembourse le client ? | Direction de l'expérience client ; direction marketplace ; Yanis Mercadier | non pour le lot 1 ; conditionne l'exigence 13 et le remboursement marketplace |\n| Q12 | Est-il légal de réduire le montant remboursé selon la note C (voire B) ? Si oui, quels montants ? | Direction juridique et conformité | non (critère 6.3 maintenu tant qu'il n'y a pas de réponse) |\n| Q13 | Le portail doit-il fonctionner sans compte, pour un client connecté, ou les deux ? Quelle vérification pour l'accès sans compte ? | Inès Rouvière ; direction de l'expérience client | non (exigence 1) |\n| Q14 | Le RMA doit-il être imprimé par le client ? Que faire pour un client sans imprimante qui dépose avec un QR code ? | Karim Benhaddou ; Inès Rouvière | non (critère 4.3) |\n| Q15 | Quelle est la date des soldes d'hiver visée et quel est le périmètre du pilote ? Une mise en service entre le 12 janvier et les soldes est-elle réaliste ? | Inès Rouvière ; direction de l'expérience client ; DSI | non (date du lot 1 et critère 11.9) |\n| Q34 | L'hébergement doit-il être dans le cloud d'Orvanne, ou un hébergement dans l'UE chez un éditeur est-il admis ? | DSI (comité d'architecture) | non (critère 11.3) |\n| Q36 | Quand la DPO peut-elle examiner le traitement du portail ? Exige-t-il une analyse d'impact ? | Hélène Marsac | non, mais conditionne l'ouverture aux clients (critère 11.6) |\n| Q37 | La note A / B / C des retours est-elle saisie sur l'application douchette de P03 ? En V1 du portail ou plus tard ? | Karim Benhaddou ; Inès Rouvière | non (source de la note du critère 6.1 ; interface provisoire en lot 1) |\n| Q39 | Quelle base de référence et quelle période de mesure pour la baisse de 60 % des contacts liés aux retours ? | Yanis Mercadier ; direction de l'expérience client | non (critère 10.1) |\n\nPoints relevés pendant la rédaction, sans question dans `work/analyse.json` (à ajouter au registre par l'analyste) :\n- liste fermée des motifs de retour, non fournie (`B03-F6`) : critère 3.2 ;\n- règle de choix de l'entrepôt de destination et horaire du fichier quotidien (`B03-F7`) : critères 8.1 et 8.2 ;\n- périmètre de la correction par le service client (`B03-F9`) : critères 9.2 et 9.3 ;\n- source de la date de livraison qui fait courir le délai (`B03-F5`) : critère 2.3 ;\n- remontée de la réception des colis retour par Hangar (interface non décrite) : critère 5.3 ;\n- conditions de l'accord de la finance sur le bon d'achat majoré et système d'émission du bon (`B04-F12`) : exigence 14.\n", "design.md": "# Conception : portail de retours en libre-service, remboursement et visibilité des entrepôts\n\n## Vue d'ensemble\n\nLa solution repose sur un **service Retours** qui porte le cycle de vie d'un retour, de la déclaration au remboursement. Il est utilisé par :\n\n- le **portail client** (web responsive, ouvert depuis Vitrine ou par lien direct), pour l'éligibilité, la déclaration, l'étiquette, le RMA et le suivi ;\n- l'**intégration Comptoir**, pour la création et la correction par le service client et le traitement des signalements ;\n- les **entrepôts**, par le fichier quotidien vers Hangar et par la recherche d'un retour à partir du RMA ou de l'étiquette ;\n- le **moteur de remboursement**, qui applique le déclencheur et les frais paramétrés et appelle le prestataire de paiement.\n\nToutes les règles non arbitrées (C08 à C14) sont des **paramètres** du back-office, avec les valeurs par défaut des hypothèses H07 à H13. Une décision du codir ou de la direction juridique se traduit par un changement de paramètre, possible même pendant le gel (`CT-07`), sans mise en production.\n\nChoix structurants :\n\n| Choix | Raison | Alternative écartée |\n|---|---|---|\n| Déclencheur du remboursement, délais, frais et catégories exclues paramétrables | C08, C09 et C10 sont renvoyés au DAF, au codir et à la direction juridique ; les décisions arriveront après le début du développement | Coder une position (premier scan du CDC ou contrôle de la finance) et redévelopper si le codir tranche autrement |\n| Valeurs par défaut prudentes : remboursement après contrôle, 14 jours (30 pour Orvanne+), frais à 0 | Limite le risque financier (1 retour sur 5 non conforme, B04-N2) et l'écart avec les CGV ; frais à 0 conformes au CDC et au marketing (H09) | Remboursement au premier scan dès le pilote |\n| Un service Retours unique pour le portail et Comptoir | Le client et le conseiller voient le même retour, avec les mêmes règles d'éligibilité (critère 9.1) | Saisie séparée dans Comptoir, comme aujourd'hui |\n| Accès sans compte et depuis le compte Vitrine (H12) | Tient l'objectif de 3 minutes (O1) sans supprimer de parcours | Compte obligatoire (EF-03 lu seul) |\n| RMA en PDF généré avec l'étiquette, rattaché au même numéro de retour (H13) | L'étiquette transporteur est illisible 1 fois sur 10 (B04-N11) ; le RMA permet de retrouver la commande | Étiquette seule |\n| Liste prévisionnelle par fichier quotidien vers Hangar | Interface imposée par le CDC (B03-D28) | API temps réel vers Hangar |\n| Lot 2 séparé : photos, marketplace, bon d'achat | V2 de l'analyse ; dépendances non levées (avis DPO sur les photos, circuit vendeur Q11, conditions de la finance) | Tout livrer au pilote |\n| Lecture des statuts transporteurs dans Passerelle, partagée avec P01 | Même source pour le premier scan (B03-D15) et les retards (P01) | Appel direct des API de suivi des transporteurs |\n\nLes technologies citées ci-dessous sont des **propositions** : les sources n'en imposent aucune, hormis Passerelle, Hangar, Comptoir, Vitrine, l'API des transporteurs et le prestataire de paiement.\n\n## Architecture\n\n```mermaid\nflowchart LR\n  subgraph Clients\n    CL[Client web / mobile]\n  end\n  subgraph SI_Orvanne[SI d'Orvanne]\n    VIT[Vitrine]\n    GC[Système de gestion des commandes]\n    P[Passerelle]\n    H[Hangar]\n    CPT[Comptoir]\n    LAC[(le Lac)]\n  end\n  subgraph Externes\n    TR[API transporteurs]\n    PSP[Prestataire de paiement]\n    EM[Service d'envoi d'e-mails]\n  end\n  subgraph Retours[Portail de retours]\n    PC[Portail client]\n    API[Service Retours]\n    ELI[Moteur d'éligibilité]\n    ETQ[Service étiquettes et RMA]\n    SUI[Collecteur de statuts]\n    CQ[Réception des contrôles]\n    RMB[Moteur de remboursement]\n    EXP[Export Hangar]\n    BO[Back-office paramètres]\n    IND[Indicateurs]\n    DB[(Base Retours)]\n  end\n  CL --> PC\n  VIT -- lien depuis la commande --> PC\n  PC --> API\n  API --> ELI\n  GC --> P\n  P -- commandes, livraisons --> API\n  P -- premier scan --> SUI\n  API --> ETQ --> TR\n  ETQ --> EM\n  SUI --> API\n  H -- réceptions, notes A/B/C --> CQ --> API\n  API --> RMB --> PSP\n  API --> DB\n  EXP -- fichier quotidien --> H\n  DB --> EXP\n  CPT <--> API\n  BO --> ELI\n  BO --> RMB\n  DB --> IND --> LAC\n```\n\n## Composants et interfaces\n\n| Composant | Responsabilité | Interfaces (entrée / sortie) | Exigences | Lot |\n|---|---|---|---|---|\n| Portail client | Accès sans compte ou depuis Vitrine, affichage de l'éligibilité, déclaration, récapitulatif, étiquette, RMA, suivi. Conforme RGAA, conçu d'abord pour le mobile | HTTPS ; proposition : application web servie par le service Retours, sans application native | 1, 2.1, 2.4, 3, 4.2, 5.1, 5.5, 11.2, 11.4, 11.5 | 1 |\n| Service Retours | Cycle de vie du retour, contrôle d'accès à la commande, limitation des tentatives, journal | API REST interne ; lecture des commandes et livraisons via Passerelle (format à confirmer, tâche 1.2) | 1, 5, 9, 11.6, 11.9, 11.10 | 1 |\n| Moteur d'éligibilité | Périmètre Orvanne / France métropolitaine / Vitrine, délai par catégorie de client, catégories exclues, marketplace, volumineux, quantités restantes | Lit les paramètres du back-office et les données de commande | 2 | 1 (13.1 en lot 2) |\n| Service étiquettes et RMA | Demande d'étiquette à l'API du transporteur, PDF et QR code, génération du RMA avec code-barres, reprises, invalidation lors d'une correction | API des transporteurs (B03-D25) ; service d'envoi d'e-mails transactionnels (même question que Q07 de P01) | 4, 9.3 | 1 (13.2, 13.4 en lot 2) |\n| Collecteur de statuts | Consomme les statuts transporteurs des colis retour publiés par Passerelle et détecte le premier scan | Flux Passerelle partagé avec P01 | 5.2 | 1 |\n| Réception des contrôles | Reçoit de l'entrepôt la réception du colis et la note A / B / C ; rejette les résultats invalides | Proposition : fichier ou message Hangar via Passerelle ; à défaut, écran de saisie web pour poste fixe en entrepôt, en attendant l'application douchette de P03 (Q37) | 5.3, 6.1, 6.2 | 1 |\n| Moteur de remboursement | Déclencheur par catégorie de client, calcul du montant et des frais, appel idempotent au prestataire, reprises, suspension en cas de note C | API du prestataire de paiement (B03-D26), clé d'idempotence par ligne de retour | 6.3, 6.4, 7 | 1 (14.2 en lot 2) |\n| Export Hangar | Routage vers l'entrepôt de destination, fichier quotidien de la liste prévisionnelle, suivi de l'acquittement, renvoi | Fichier déposé pour Hangar (format et horaire à fixer, tâche 1.5) | 8.1 à 8.4, 13.3 | 1 |\n| Recherche entrepôt | Recherche d'un retour par RMA, numéro de suivi ou commande | Écran web et API en lecture, rôle `entrepot` | 8.5 | 1 |\n| Intégration Comptoir | Création et correction pour le compte du client, vue des retours d'une commande, file des signalements (note C, échec de remboursement) | Selon les capacités d'extension de Comptoir : composant intégré ou lien contextuel (question commune avec Q09 de P01) | 6.4, 6.5, 7.10, 9 | 1 |\n| Back-office paramètres | Délais, catégories exclues, motifs, frais, déclencheur, routage, heure du fichier, seuils de tentatives, mode pilote, durées de conservation, verrous DPO ; historique de chaque modification | Application web, rôle `admin-metier` | 2.3, 2.5, 3.2, 7.1 à 7.3, 7.6, 7.7, 8.1, 11.6 à 11.9, 12.5 | 1 |\n| Indicateurs | Agrégats quotidiens d'usage et de délais | Export quotidien vers le Lac (proposition) | 3.6, 10 | 1 |\n| Supervision | Disponibilité, erreurs des API transporteurs et du prestataire, acquittement du fichier Hangar, résultats de contrôle rejetés | Outils de supervision de la DSI | 4.5, 6.2, 8.4, 11.1 | 1 |\n| Stockage des photos | Dépôt, contrôle de format et de taille, accès restreint, purge | Stockage objet chiffré dans l'UE (proposition) | 12 | 2 |\n| Connecteur espace vendeur | Expose à l'espace vendeur (P07) les retours des articles du vendeur | API en lecture filtrée par vendeur | 13.5 | 2 |\n| Bon d'achat | Choix du client, émission du bon au déclencheur | Système d'émission des bons à identifier (Vitrine ou autre, point ouvert) | 14 | 2 |\n\n## Flux principaux\n\n### Déclaration d'un retour sans compte\n\n```mermaid\nsequenceDiagram\n  participant C as Client\n  participant PC as Portail\n  participant R as Service Retours\n  participant P as Passerelle\n  participant E as Moteur d'éligibilité\n  participant T as API transporteur\n  participant M as Service e-mail\n  C->>PC: n° de commande + e-mail d'achat\n  PC->>R: vérifier l'accès (compteur de tentatives)\n  R->>P: lire la commande et les livraisons\n  alt pas de correspondance\n    R-->>PC: message unique « commande introuvable »\n  else correspondance\n    R->>E: éligibilité de chaque article\n    E-->>PC: éligible / raison, date limite, quantité restante\n    C->>PC: articles, quantités, motifs, mode de retour\n    PC-->>C: récapitulatif (montant prévisionnel, frais, moyen d'origine)\n    C->>PC: confirmer\n    PC->>R: créer le retour (statut déclaré)\n    R->>T: demander l'étiquette\n    alt étiquette obtenue\n      R->>R: générer le RMA (même n° de retour)\n      R-->>PC: afficher étiquette, QR code, RMA\n      R->>M: e-mail de service (étiquette, RMA, lien de suivi)\n    else erreur transporteur\n      R-->>PC: « étiquette envoyée par e-mail dès que disponible »\n      R->>R: programmer les reprises\n    end\n  end\n```\n\n### Du dépôt au remboursement (déclencheur par défaut : contrôle qualité)\n\n```mermaid\nsequenceDiagram\n  participant P as Passerelle\n  participant R as Service Retours\n  participant H as Hangar / entrepôt\n  participant RB as Moteur de remboursement\n  participant PSP as Prestataire de paiement\n  participant CPT as Comptoir\n  P->>R: premier scan du colis retour\n  R->>R: statut déposé\n  opt déclencheur = premier scan pour la catégorie du client\n    R->>RB: déclencher\n  end\n  H->>R: réception du colis (RMA ou n° de suivi)\n  R->>R: statut reçu\n  opt déclencheur = réception\n    R->>RB: déclencher\n  end\n  H->>R: note A / B / C\n  alt note C\n    R->>CPT: signalement ; remboursement suspendu s'il n'est pas déjà parti\n    CPT-->>R: décision du conseiller (rembourser / bloquer, motif)\n  else note A ou B\n    opt déclencheur = contrôle qualité\n      R->>RB: déclencher\n    end\n  end\n  RB->>RB: montant payé - frais du motif (aucun effet de la note)\n  RB->>PSP: remboursement sur le moyen d'origine (clé d'idempotence)\n  alt confirmé\n    PSP-->>RB: référence de l'opération\n    RB->>R: statut remboursé\n  else refus ou absence de réponse après reprises\n    RB->>CPT: signalement « échec de remboursement »\n  end\n```\n\nLecture de H11 retenue pour le critère 6.4 : le « traitement manuel » d'une note C porte sur la décision de rembourser, sans jamais calculer de montant réduit. Si le remboursement est déjà parti (déclencheur au premier scan ou à la réception), le signalement sert seulement d'information au service client.\n\n### Liste prévisionnelle\n\nChaque jour, à l'heure paramétrée, l'export sélectionne les retours `déclaré` ou `déposé` non encore reçus, hors marketplace, les répartit par entrepôt selon la règle de routage, et dépose un fichier par entrepôt pour Hangar. Un retour reste dans les fichiers suivants tant qu'il n'est pas reçu.\n\n## Modèle de données\n\n| Entité | Attributs principaux | Donnée personnelle | Durée de conservation |\n|---|---|---|---|\n| Retour | n° de retour, n° de commande, référence client Vitrine (sans copie du nom), canal de création (portail / Comptoir), mode de retour, catégorie de client, statut, horodatages des étapes, entrepôt de destination, vendeur (lot 2) | oui (lié à un client identifiable) | paramétrable, fixée avec la DPO (critère 11.7) |\n| LigneRetour | article, quantité, motif, montant payé, frais appliqués, éligibilité au moment de la déclaration | oui (rattachée au retour) | comme le retour |\n| Étiquette | transporteur, n° de suivi, PDF, QR code, état (valide / invalidée) | oui (adresse de l'expéditeur imprimée) | paramétrable, courte après la réception (proposition à valider avec la DPO) |\n| RMA | n° de RMA, n° de retour, n° de commande, articles, code-barres, PDF | non (aucun nom ni adresse sur le RMA, proposition) | comme le retour |\n| ÉvénementRetour | n° de retour, type (premier scan, réception, contrôle…), horodatage source, horodatage de réception, origine | non | comme le retour |\n| ContrôleQualité | n° de retour, note A / B / C, destination, date, entrepôt, identifiant de l'opérateur s'il est transmis | oui si l'opérateur est identifié (employé) | comme le retour |\n| Remboursement | n° de retour, déclencheur appliqué, montant, frais, clé d'idempotence, référence PSP, statut, tentatives | oui (opération financière d'un client ; aucune donnée de carte stockée) | à fixer avec la DPO et la DAF (obligations comptables) |\n| Signalement | n° de retour, type (note C, échec de remboursement, étiquette non obtenue), décision, motif, conseiller | oui | comme le retour |\n| TentativeAccès | empreinte du n° de commande, horodatage, résultat | non (aucune adresse IP conservée, proposition) | courte, à fixer avec la DPO (proposition : 30 jours) |\n| Paramètre | clé, portée (catégorie de client, motif, entrepôt), valeur, auteur, date, ancienne valeur | non (auteur = identifiant employé) | conservé (traçabilité) |\n| Journal | acteur, action, objet, valeurs avant / après, horodatage | oui (identifiant de l'employé, référence client) | paramétrable, fixée avec la DPO |\n| Photo (lot 2) | n° de retour, ligne, fichier, taille, format, date | oui (`CT-06`) | paramétrable, supprimée avec le retour au plus tard |\n| BonAchat (lot 2) | n° de retour, montant, taux de majoration, référence d'émission | oui | à fixer avec la DPO et la DAF |\n\nL'adresse e-mail du client n'est pas copiée : elle est lue dans la commande au moment de l'envoi. L'adresse d'enlèvement à domicile n'est transmise qu'au transporteur.\n\n## Gestion des erreurs\n\n| Situation | Comportement | Exigence |\n|---|---|---|\n| Numéro de commande et e-mail sans correspondance | Message unique, compteur de tentatives incrémenté | 1.4, 1.5 |\n| Seuil de tentatives dépassé | Refus pendant la durée de blocage, message neutre, alerte à la supervision au-delà d'un volume anormal | 1.5 |\n| Passerelle indisponible à la lecture de la commande | Message « service momentanément indisponible », aucune déclaration partielle ; compte dans la disponibilité mensuelle | 1.6, 11.1 |\n| Date de livraison absente | Article non éligible en ligne, renvoi vers le service client | 2.9 |\n| Catégorie ou vendeur de l'article inconnu | Article non éligible en ligne (choix prudent), compté à part dans les indicateurs | 2.2, 2.5, 2.6 |\n| API du transporteur en erreur ou trop lente | Retour enregistré `déclaré`, reprises avec délai croissant ; après la dernière reprise, signalement « étiquette non obtenue » dans Comptoir | 4.5 |\n| E-mail non délivré | Étiquette et RMA restent téléchargeables depuis le suivi | 4.2, 5.5 |\n| Premier scan reçu pour un retour inconnu | Événement conservé, alerte à la supervision | 5.2 |\n| Résultat de contrôle invalide ou sans retour reçu | Rejet, alerte à la supervision | 6.2 |\n| Note C reçue après un remboursement déjà parti | Signalement d'information, aucun effet sur le remboursement | 6.3, 6.4 |\n| Prestataire de paiement en erreur | Reprises avec la même clé d'idempotence ; après la dernière, signalement « échec de remboursement », statut non `remboursé` | 7.8, 7.10 |\n| Fichier Hangar non acquitté | Alerte à la supervision, renvoi manuel ou automatique du fichier ; le fichier suivant reprend les retours non reçus | 8.4 |\n| Correction d'un retour déjà `déposé` | Pas de nouvelle étiquette ; la correction porte sur les données du retour et est journalisée | 9.2, 9.3, 9.5 |\n| Photo trop lourde ou hors format (lot 2) | Refus avec la raison, les autres photos sont conservées | 12.2 |\n| Fonction soumise à avis DPO activée sans avis | Activation refusée par le back-office | 11.6, 12.5 |\n\n## Sécurité et RGPD\n\n- **Avant le développement :** le traitement est soumis à la DPO (`CT-01`, `Q36`), qui n'a pas été consultée sur le portail (B07). Points à faire valider :\n  - la base légale et les durées de conservation de chaque entité ;\n  - l'accès sans compte et la limitation des tentatives ;\n  - les photos du lot 2 (`CT-06`), avec un verrou d'activation dans le back-office (critère 12.5).\n- **Ouverture aux clients :** le portail reste fermé tant que l'avis de la DPO n'est pas enregistré (critère 11.6).\n- **Accès sans compte :** il ne donne accès qu'à la commande saisie (H12). Les messages d'erreur ne révèlent pas quelle valeur est fausse, et les tentatives sont limitées (critères 1.3 à 1.5). Le lien de suivi de l'e-mail porte un jeton signé à durée limitée (proposition).\n- **Minimisation :** la base Retours ne copie ni le nom, ni l'e-mail, ni le moyen de paiement. Le RMA ne porte ni nom ni adresse (proposition). Aucune donnée de carte n'est stockée : le remboursement passe par la référence de transaction du prestataire.\n- **Messages de service :** les e-mails du portail ne contiennent aucune offre commerciale (`CT-03`). Le bon d'achat du lot 2 n'est proposé que dans le portail, jamais promu dans les e-mails (critère 14.3) ; la qualification de ce choix au regard de `CT-03` est à confirmer avec la DPO.\n- **Accès internes :** les accès passent par le SSO interne, avec les rôles `service-client`, `entrepot`, `admin-metier` et `dsi`. Les actions faites pour le compte d'un client sont journalisées avec les valeurs avant et après (`CT-10`, critère 9.5).\n- **Droits des personnes :** les retours, photos et journaux sont de nouvelles données clients à déclarer au registre de P05 pour l'orchestration des droits (dépendance P05).\n- **Hébergement :** dans l'Union européenne (`CT-08`). Le choix entre le cloud d'Orvanne et un éditeur hébergé dans l'UE attend `Q34`.\n- **Données de test :** jeux synthétiques ou anonymisés uniquement (`CT-04`).\n- **Accessibilité :** conformité RGAA et usage sur mobile (`CT-09`), vérifiées par un audit et par les tests utilisateurs.\n\n## Volumétrie et performance\n\n| Grandeur | Valeur | Base |\n|---|---|---|\n| Demandes de retour traitées aujourd'hui par le service client | ≈ 900 par jour ouvré | B03-N1 |\n| Colis retour reçus par E2 | ≈ 1 100 par jour | B04-N1 |\n| Part des demandes portant sur des articles marketplace | 35 % | B04-N7 |\n| Retours éligibles au portail en lot 1 (hors marketplace) | ≈ 600 à 700 par jour ouvré | estimation : 65 % de 900 à 1 100 |\n| Retours en janvier | ≈ 2 fois le volume normal, soit ≈ 1 400 par jour en lot 1 | estimation à confirmer (délai de contrôle à 10 jours en janvier, B04-N9, et pic de fin d'année à environ ×2) |\n| Retours non conformes à l'ouverture | 1 sur 5 | B04-N2 |\n| Signalements « note C » possibles | jusqu'à ≈ 280 par jour en janvier si tous les non-conformes sont notés C | estimation : 20 % de 1 400 ; charge à valider avec le service client |\n| Étiquettes transporteur illisibles | 1 sur 10 | B04-N11 |\n| Délai entre réception et contrôle | 3 à 6 jours, 10 en janvier | B04-N8, B04-N9 |\n| Utilisateurs simultanés du portail | 300 | B03-N11 |\n| Temps d'affichage | < 2 s pour 95 % des requêtes | B03-N9, B03-N10 |\n| Disponibilité | 99,5 % par mois, soit environ 3 h 40 d'indisponibilité au plus | B03-N8 |\n\nCes volumes sont modestes pour une base relationnelle (proposition : PostgreSQL). Les points sensibles sont les appels externes : la lecture de la commande via Passerelle et la demande d'étiquette se trouvent sur le parcours du client et pèsent sur l'objectif de 3 minutes. Le test de charge vise 600 utilisateurs simultanés, soit 2 fois l'exigence, avec des bouchons de Passerelle et des transporteurs aux temps de réponse mesurés en recette.\n\nLe pilote démarre au plus tôt le 12 janvier (H14), au moment où les retours et le délai de contrôle sont les plus élevés. Avec le déclencheur par défaut (contrôle qualité), le client attendra jusqu'à 10 jours après la réception : le suivi (exigence 5) doit le montrer pour éviter un report des contacts vers le service client.\n\n## Stratégie de test\n\n| Niveau | Contenu | Exigences |\n|---|---|---|\n| Unitaire | Éligibilité aux bornes : jour 14 et 15, jour 30 et 31 pour Orvanne+, catégories exclues, marketplace, volumineux, date de livraison absente, quantités déjà déclarées. Calcul du montant et des frais par motif. Choix du déclencheur par catégorie. Idempotence du remboursement. Limitation des tentatives | 1.3 à 1.5, 2, 7 |\n| Intégration | Passerelle (commandes, livraisons, premier scan), API des transporteurs (étiquette, erreur), prestataire de paiement (succès, refus, absence de réponse), fichier Hangar et acquittement, réception des contrôles, Comptoir : avec des bouchons, puis en recette | 1.6, 4, 5.2, 5
