t et les réseaux sociaux (estimation). La taille d'un export n'est pas connue ; le générateur est testé avec un export de 100 Mo (estimation).\n\n## Stratégie de test\n\n| Niveau | Contenu | Exigences |\n|---|---|---|\n| Unitaire | Calcul d'échéance (fins de mois, 29 février, réception un samedi), alertes J+15 et J+25, hors délai, prolongation (motif, plafond de deux mois, recalcul), fin de conservation des données isolées | 3.1 à 3.6, 4, 7.4 |\n| Unitaire | Règles de clôture (action manquante, identité non vérifiée, issue et motif), gel après clôture, retrait du Lac interdit, détection de doublon | 1.9, 6.3 à 6.6, 7.5 |\n| Intégration | Import du classeur sur une copie anonymisée ; saisie depuis Comptoir si l'option est retenue ; envoi des alertes par le service d'e-mail interne | 1.8, 5.5, 3.3 |\n| Sécurité | Contrôle des rôles sur chaque écran et chaque API ; espace de remise (jeton, code, expiration, tentatives) ; journal non modifiable ; chiffrement au repos ; absence de donnée personnelle dans le tableau de bord | 5.4, 8.2 à 8.5, 9.3, 11.1 à 11.3 |\n| Conservation | Purge des exports et des demandes selon les durées paramétrées, sur une horloge simulée | 8.7, 11.4 |\n| Utilisabilité | Les 2 membres de l'équipe de la DPO et 2 conseillers du service client déroulent les scénarios de recette sans assistance, avec la seule aide intégrée | 10 |\n| Recette métier | Trimestre fictif rejoué : 150 demandes synthétiques couvrant les 4 types et les 4 canaux, prolongations et dépassements ; contrôle du tableau de bord par l'équipe de la DPO | 1 à 9 |\n| Lot 2 | Bouchon du contrat d'interface, puis chaque système en recette : accès, effacement avec isolation, opposition dans l'outil d'e-mailing, erreurs et délais dépassés | 12 |\n| Données | Jeux synthétiques uniquement (CT-04) | 11.7 |\n", "tasks.md": "# Plan d'implémentation : registre et traitement des demandes d'exercice de droits RGPD\n\nLes tâches 1 à 9 forment le **lot 1** : registre, échéances, saisie par le servic 5_\n  - [ ] 2.2 Brancher l'authentification interne et définir les rôles `dpo`, `admin-dpo`, `service-client`, `comite-risques`, avec le contrôle d'accès sur chaque écran et chaque API\n    - _Exigences : 11.2, 11.6, 5.4_\n  - [ ] 2.3 Mettre en place le journal d'audit en ajout seul pour toutes les consultations et opérations\n    - _Exigences : 11.1_\n  - [ ] 2.4 Mettre en place le stockage chiffré des pièces, preuves et exports, et TLS sur tous les échanges ; déployer les environnements dans l'UE\n    - _Exigences : 11.3, 11.5_\n  - [ ] 2.5 Écrire les tests de sécurité du socle : rôles, journal non modifiable, chiffrement au repos\n    - _Exigences : 11.1, 11.2, 11.3_\n\n- [ ] 3. Registre, catalogue et saisie (dépend de 2.1 et 2.2)\n  - [ ] 3.1 Développer la création et la fiche d'une demande : canal, date de réception, type, statuts horodatés, identifiant unique\n    - _Exigences : 1.1, 1.2, 1.3, 1.4, 1.5_\n  - [ ] 3.2 Développer la vérification d'identité : état, moyen paramétrable, auteur, date\n    - _Exigences : 1.6_\n  - [ ] 3.3 Développer la recherche multicritère et l'avertissement de doublon\n    - _Exigences : 1.7, 1.9_\n  - [ ] 3.4 Développer le catalogue des systèmes, initialisé avec Vitrine, Comptoir, Hangar, le Lac et l'outil d'e-mailing, et la proposition des systèmes concernés avec motif de retrait\n    - _Exigences : 2.1, 2.2, 2.3_\n  - [ ] 3.5 Développer l'écran de saisie du service client : message d'origine, date d'envoi du client, notification à l'équipe de la DPO, consultation limitée au statut et à l'échéance\n    - _Exigences : 5.1, 5.2, 5.3, 5.4_\n  - [ ] 3.6 Intégrer la saisie à Comptoir selon la note de choix, sans ressaisie de l'identité ni des coordonnées\n    - _Exigences : 5.5_\n  - [ ] 3.7 Écrire les tests de la tâche 3 : listes paramétrables, doublon, date d'envoi postérieure à la saisie refusée, droits du service client\n    - _Exigences : 1.2, 1.3, 1.9, 5.2, 5.4_\n\n- [ ] 4. Échéances, alertes et prolongation (dépend de 3.1)\n  - nd de 2.4 et 5.1)\n  - [ ] 6.1 Développer le générateur d'export lisible, par système, avec libellés en français\n    - _Exigences : 8.1_\n  - [ ] 6.2 Développer l'espace de remise externe : vérification d'identité préalable, lien personnel, code transmis séparément, durée de validité, limite de tentatives\n    - _Exigences : 8.2, 8.3_\n  - [ ] 6.3 Développer l'expiration du lien avec alerte, la preuve de téléchargement et la remise par courrier\n    - _Exigences : 8.4, 8.5, 8.6_\n  - [ ] 6.4 Développer la purge des exports après le délai paramétré, en conservant preuve et empreinte\n    - _Exigences : 8.7_\n  - [ ] 6.5 Écrire les tests de sécurité de l'espace de remise (jeton, code, expiration, tentatives) et un test avec un export de 100 Mo\n    - _Exigences : 8.2, 8.3, 8.4, 8.5_\n\n- [ ] 7. Tableau de bord trimestriel (dépend de 4.2 et 5.4)\n  - [ ] 7.1 Développer les indicateurs par trimestre civil, par type et par canal, dont le nombre de demandes importées sans preuve d'exécution\n    - _Exigences : 9.1, 9.2_\n  - [ ] 7.2 Développer l'export PDF et l'accès en lecture du comité des risques ; vérifier l'absence de donnée personnelle\n    - _Exigences : 9.3, 9.4_\n\n- [ ] 8. Conservation et reprise de l'existant (dépend de 1.3, 5.4 et 6.4)\n  - [ ] 8.1 Développer la purge des demandes clôturées, de leurs pièces et de leurs preuves selon la durée paramétrée par la DPO\n    - _Exigences : 11.4_\n  - [ ] 8.2 Développer l'import du classeur avec rapport d'import et mention « antérieure à l'outil, preuve absente » ; répéter l'import sur la copie anonymisée\n    - _Exigences : 1.8, 9.2, 11.7_\n  - [ ] 8.3 Écrire les tests de conservation sur une horloge simulée\n    - _Exigences : 8.7, 11.4_\n\n- [ ] 9. Recette et mise en service du lot 1 (dépend de 3 à 8, et de 1.2 pour la date)\n  - [ ] 9.1 Rédiger l'aide intégrée aux écrans et vérifier les libellés en français\n    - _Exigences : 10.3_\n  - [ ] 9.2 Faire le test d'utilisabilité : les 2 membres de l'équipe de la DPO et 2 conseillers du service client déroulent les scénarios sans assistance\n    - _Exigences : 10.1, 10.2_\n  - [ ] 9.3 Faire la recette métier sur un trimestre fictif rejoué (150 demandes synthétiques), tableau de bord compris\n    - _Exigences : 1.1, 1.7, 3.3, 3.4, 3.5, 4.1, 6.4, 8.1, 9.1_\n  - [ ] 9.4 Importer le classeur réel en production, faire contrôler le rapport d'import par l'équipe de la DPO, puis geler le classeur\n    - _Exigences : 1.8_\n  - [ ] 9.5 Mettre en production au plus tôt le 12 janvier 2027, dans l'UE, et ouvrir les accès par rôle\n    - _Exigences : 11.2, 11.5_\n\n- [ ] 10. Contrat d'interface et orchestrateur (lot 2, dépend de 9)\n  - [ ] 10.1 Rédiger et publier le contrat d'interface unique (`rechercher`, `extraire`, `rectifier`, `effacer`, `opposer`, compte rendu), à transmettre aux projets P01, P02, P03, P06 et P07\n    - _Exigences : 12.8_\n  - [ ] 10.2 Développer l'orchestrateur : envoi après vérification d'identité et validation des systèmes par l'équipe de la DPO, suivi des comptes rendus, délai paramétré, repli manuel avec alerte\n    - _Exigences : 12.1, 12.3, 12.4_\n  - [ ] 10.3 Transmettre les catégories à isoler lors d'un effacement et intégrer les extractions reçues à l'export d'accès\n    - _Exigences : 12.5, 12.6_\n  - [ ] 10.4 Écrire les tests de l'orchestrateur avec un bouchon du contrat : succès, erreur, délai dépassé, compte rendu après clôture\n    - _Exigences : 12.1, 12.3, 12.4_\n\n- [ ] 11. Connecteurs des systèmes et recette du lot 2 (dépend de 10.1 et 10.2)\n  - [ ] 11.1 Connecteurs Vitrine et Comptoir via Passerelle\n    - _Exigences : 12.2_\n  - [ ] 11.2 Connecteur Hangar via Passerelle\n    - _Exigences : 12.2_\n  - [ ] 11.3 Connecteur de l'outil d'e-mailing, opposition à la prospection comprise\n    - _Exigences : 12.2, 12.7_\n  - [ ] 11.4 Connecteur du Lac par traitement par lots\n    - _Exigences : 12.2, 12.5_\n  - [ ] 11.5 Faire la recette de bout en bout sur chaque système : accès, effacement avec isolation, opposition ; mettre en production hors gel\n    - _Exigences : 12.1, 12.2, 12.3, 12.5, 12.6, 12.7_\n"}, "rdv-livraisons-fournisseurs": {"requirements.md": "# Exigences : prise de rendez-vous de déchargement par les fournisseurs et transporteurs\n\n<!-- Projet P06, slug rdv-livraisons-fournisseurs. Commanditaire : approvisionnement et transport amont.\n     Parties prenantes : exploitation E1 (chef de quai), exploitation E2, achats, DSI, poste de garde, DPO.\n     Source unique : B08 (compte rendu d'atelier du 12/11/2026). Conflits : C21, C22, C23, C24. -->\n\n## Introduction\n\nLes fournisseurs d'Orvanne et leurs transporteurs prennent aujourd'hui rendez-vous par téléphone ou par e-mail auprès du bureau de réception de chaque site, qui note les créneaux dans un tableur propre au site. E1 reçoit environ 70 camions par jour sur 6 quais de réception, E2 une quarantaine. Un camion sur quatre se présente sans rendez-vous ou hors créneau. L'attente moyenne dépasse 1 h 30 le lundi matin, avec des pénalités d'immobilisation facturées par les transporteurs. Le bureau de réception passe environ 3 heures par jour au téléphone, et personne ne voit la veille la charge du lendemain.\n\nL'atelier a retenu un portail web de réservation des créneaux de déchargement, régi par sept règles (R1 à R7), avec une vue planning par site, le pointage des camions au poste de garde et un export des indicateurs.\n\nLe projet est découpé en deux versions :\n- **V1** (exigences 1 à 11) : règles R1 à R7, vue planning, poste de garde, indicateurs et export. Pilote sur E1 au printemps, avec une vingtaine de fournisseurs pilotes. L'année n'est pas écrite dans B08 ; l'atelier datant du 12/11/2026, le pilote est compris comme celui du printemps 2027.\n- **V2** (hors de cette spec, voir « Hors périmètre ») : notation des fournisseurs, lien avec Hangar, application mobile pour les chauffeurs.\n\nJalons connus : liste des fournisseurs pilotes et vérification des commandes d'achat dans Passerelle pour le 27/11, paramétrage cible de E1 pour le 04/12, chiffrage et planning de la DSI en décembre. Le gel des mises en production du 16 novembre au 11 janvier (`CT-07`) ne touche pas le pilote du printemps ; il interdit en revanche toute mise en production anticipée pendant cette période.\n\n## Glossaire\n\n- **Site** : entrepôt de réception (E1, E2 ; E3 non évoqué dans B08, voir `Q38`).\n- **Quai** : quai de réception d'un site, sur lequel un camion décharge.\n- **Créneau** : plage horaire de déchargement sur un quai, de durée fixée par site (30 minutes par défaut).\n- **Réservation** : rendez-vous de déchargement pris sur un ou plusieurs créneaux consécutifs d'un même quai, pour une ou plusieurs commandes d'achat.\n- **Commande d'achat** : commande passée par Orvanne à un fournisseur, identifiée par un numéro ; elle est « soldée » quand il ne reste rien à livrer.\n- **Camion complet** : livraison déclarée comme telle par l'auteur de la réservation ; elle consomme deux créneaux (R2).\n- **Jour J** : jour du créneau réservé. « J-1 midi » désigne 12 h 00, heure de Paris, la veille du jour J.\n- **Pointage** : enregistrement de l'arrivée d'un camion par le poste de garde.\n- **Créneau perdu** : réservation dont le camion n'a pas été pointé dans les 20 minutes suivant le début du créneau (R5).\n- **Forçage** : action du chef de quai qui crée ou maintient une réservation en dehors des règles de capacité ou de délai (R7).\n- **Blocage** : action du chef de quai qui rend un créneau ou un quai non réservable (R7).\n- **Utilisateur externe** : contact d'un fournisseur ou d'un transporteur disposant d'un compte sur le portail.\n\n## Exigences\n\n### Exigence 1 : accès au portail fournisseurs\n\n**User story :** En tant que fournisseur ou transporteur, je veux réserver moi-même un créneau de déchargement sur un portail web, afin de ne plus appeler le bureau de réception.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT proposer un portail web sur lequel un fournisseur ou son transporteur réserve un créneau de déchargement sur un site d'Orvanne. _Source : B08-D1_\n2. LE SYSTÈME DOIT réserver l'accès au portail aux comptes nominatifs ouverts par Orvanne pour des contacts de fournisseurs et de transporteurs. _Source : B08-D1, CT-01_\n3. PENDANT QUE le pilote est en cours, LE SYSTÈME DOIT n'ouvrir de compte qu'aux fournisseurs de la liste pilote établie par les achats (une vingtaine) et à leurs transporteurs. _Source : B08-D28, B08-D30_\n4. LE SYSTÈME DOIT limiter chaque compte externe aux commandes d'achat et aux réservations des fournisseurs auxquels il est rattaché. _Source : B08-D2, CT-01_\n5. LE SYSTÈME DOIT présenter les écrans du portail de façon utilisable sur un smartphone et conforme au RGAA. _Source : CT-09_\n\n### Exigence 2 : paramétrage des sites\n\n**User story :** En tant que responsable de site, je veux paramétrer mes quais, mes horaires, mes jours fermés et la durée de mes créneaux, afin que les réservations correspondent à la capacité réelle de mon site.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT permettre à chaque site de paramétrer ses quais de réception, ses horaires d'ouverture et ses jours fermés. _Source : B08-D7_\n2. LE SYSTÈME DOIT permettre à chaque site de paramétrer la durée de ses créneaux, avec une valeur par défaut de 30 minutes. _Source : B08-D3, B08-D20, H20_\n3. LE SYSTÈME DOIT générer les créneaux réservables de chaque jour ouvert d'un site à partir de ses horaires d'ouverture et de sa durée de créneau, avec une capacité égale au nombre de quais actifs. _Source : B08-D3, B08-D7_\n4. SI une modification du paramétrage d'un site (quais, horaires, jours fermés, durée de créneau) rend incompatibles des réservations existantes, ALORS LE SYSTÈME DOIT refuser la modification et lister les réservations à déplacer ou à annuler au préalable. _Source : B08-D7, B08-D11_\n5. LE SYSTÈME DOIT accepter, sans développement, le paramétrage cible de E1 fourni par le chef de quai E1, soit 4 quais de réception et des créneaux d'une heure selon le compte rendu du 12/11, valeurs à confirmer. _Source : B08-D26, H20, H21_\n6. LE SYSTÈME DOIT permettre d'ouvrir la réservation site par site, E1 étant le premier site ouvert pour le pilote. _Source : B08-D30, B08-D7_\n\n### Exigence 3 : réservation d'un créneau\n\n**User story :** En tant que fournisseur ou transporteur, je veux réserver un créneau pour les commandes d'achat que je livre, afin d'être déchargé à l'heure prévue.\n\n#### Critères d'acceptation\n\n1. QUAND un utilisateur externe crée une réservation, LE SYSTÈME DOIT exiger au moins un numéro de commande d'achat Orvanne et permettre d'en saisir plusieurs. _Source : B08-D2_\n2. LE SYSTÈME DOIT vérifier que chaque commande d'achat saisie est valide et non soldée, à partir des commandes d'achat transmises par Passerelle. _Source : B08-D2, B08-D27_\n3. SI une commande d'achat saisie est inconnue, non rattachée au compte ou soldée, ALORS LE SYSTÈME DOIT refuser la réservation en indiquant la commande en cause et l'un des deux motifs « inconnue ou non rattachée à votre compte » ou « soldée ». _Source : B08-D2, CT-01_\n4. LE SYSTÈME DOIT demander à l'auteur de la réservation s'il s'agit d'un camion complet, puis réserver deux créneaux consécutifs sur le même quai pour un camion complet et un seul créneau dans les autres cas. _Source : B08-D4_\n5. LE SYSTÈME DOIT n'accepter une réservation d'un utilisateur externe que si elle est faite entre J-10 et J-1 à 12 h 00, heure de Paris. _Source : B08-D5_\n6. LE SYSTÈME DOIT proposer uniquement les créneaux d'un jour ouvert du site sur lesquels un quai est libre pendant toute la durée demandée. _Source : B08-D3, B08-D7_\n7. SI deux réservations visent en même temps le dernier quai libre d'un créneau, ALORS LE SYSTÈME DOIT n'en enregistrer qu'une et proposer d'autres créneaux à l'autre utilisateur. _Source : B08-D7, B08-D3_\n8. QUAND une réservation est enregistrée, LE SYSTÈME DOIT lui attribuer un numéro de réservation unique et un quai. _Source : B08-D1, B08-D16_\n9. LE SYSTÈME DOIT exiger dans chaque réservation l'adresse e-mail du transporteur qui effectue la livraison. _Source : B08-D10_\n\n### Exigence 4 : modification et annulation par l'utilisateur externe\n\n**User story :** En tant que fournisseur ou transporteur, je veux modifier ou annuler ma réservation, afin de libérer le créneau si mon planning change.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT permettre à un utilisateur externe de modifier ou d'annuler une réservation de son périmètre jusqu'à J-1 à 12 h 00, heure de Paris. _Source : B08-D6_\n2. SI un utilisateur externe demande une modification ou une annulation après J-1 à 12 h 00, ALORS LE SYSTÈME DOIT la refuser et afficher les coordonnées du site à contacter. _Source : B08-D6, B08-D11_\n3. QUAND une réservation est modifiée, LE SYSTÈME DOIT appliquer de nouveau les contrôles des critères 3.2 à 3.7. _Source : B08-D6, B08-D2_\n4. QUAND une réservation est annulée, LE SYSTÈME DOIT rendre ses créneaux de nouveau réservables. _Source : B08-D6_\n\n### Exigence 5 : confirmation et rappel par e-mail\n\n**User story :** En tant que transporteur, je veux recevoir une confirmation puis un rappel la veille, afin de me présenter au bon site, au bon quai et à la bonne heure.\n\n#### Critères d'acceptation\n\n1. QUAND une réservation est enregistrée, LE SYSTÈME DOIT envoyer au transporteur un e-mail de confirmation indiquant le numéro de réservation, le site, le quai, la date, l'heure, les commandes d'achat et la tolérance de retard de 20 minutes. _Source : B08-D10, B08-D9_\n2. LE SYSTÈME DOIT envoyer au transporteur un e-mail de rappel la veille du créneau, à une heure paramétrable postérieure à 12 h 00. _Source : B08-D10, B08-D6_\n3. QUAND une réservation est modifiée, déplacée ou annulée, LE SYSTÈME DOIT en informer le transporteur par e-mail avec les nouvelles informations. _Source : B08-D10, B08-D11_\n4. QUAND l'auteur de la réservation n'est pas le transporteur, LE SYSTÈME DOIT lui adresser une copie des e-mails de confirmation, de modification et d'annulation. _Source : B08-D10, B08-D1_\n5. LE SYSTÈME NE DOIT PAS insérer d'offre ni de contenu commercial dans les e-mails de confirmation, de rappel, de modification ou d'annulation. _Source : CT-03_\n6. SI l'envoi d'un e-mail échoue après 3 tentatives, ALORS LE SYSTÈME DOIT signaler l'échec sur la réservation dans la vue planning du site. _Source : B08-D10, B08-D16_\n\n### Exigence 6 : actions du chef de quai\n\n**User story :** En tant que chef de quai, je veux forcer, déplacer ou bloquer un créneau, afin d'adapter le planning aux aléas du site.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT permettre au chef de quai de déplacer une réservation vers un autre créneau ou un autre quai de son site, y compris après J-1 à 12 h 00. _Source : B08-D11_\n2. LE SYSTÈME DOIT permettre au chef de quai de forcer une réservation pour le compte d'un fournisseur, c'est-à-dire de la créer ou de la maintenir sur un créneau sans quai libre ou en dehors du délai de J-10 à J-1 à 12 h 00. _Source : B08-D11, CT-10_\n3. SI le chef de quai force une réservation, ALORS LE SYSTÈME DOIT continuer d'exiger au moins une commande d'achat valide et non soldée. _Source : B08-D2, H22_\n4. LE SYSTÈME DOIT permettre au chef de quai de bloquer un créneau ou un quai, ponctuellement ou sur une plage horaire récurrente, avec un motif obligatoire. _Source : B08-D11, B08-D22, H22_\n5. SI le chef de quai bloque un créneau qui porte une réservation, ALORS LE SYSTÈME DOIT refuser le blocage tant que la réservation n'a pas été déplacée ou annulée. _Source : B08-D11_\n6. LE SYSTÈME DOIT journaliser chaque forçage, déplacement, blocage et annulation fait par un utilisateur interne, avec son auteur, son horodatage, les valeurs avant et après, et le motif. _Source : B08-D11, CT-10_\n7. LE SYSTÈME DOIT réserver les actions de forçage, de déplacement et de blocage aux utilisateurs ayant le rôle de chef de quai du site concerné. _Source : B08-D11_\n\n### Exigence 7 : poste de garde\n\n**User story :** En tant qu'agent du poste de garde, je veux pointer chaque camion à son arrivée, afin d'appliquer la tolérance de retard et de mesurer les arrivées sans rendez-vous.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT afficher au poste de garde la liste des réservations du jour pour son site, triée par heure de créneau, avec une recherche par numéro de réservation ou par numéro de commande d'achat. _Source : B08-D8, B08-D25_\n2. QUAND le poste de garde pointe un camion, LE SYSTÈME DOIT enregistrer l'heure d'arrivée et la rattacher à la réservation. _Source : B08-D8_\n3. QUAND un camion est pointé au plus tard 20 minutes après le début de son créneau, LE SYSTÈME DOIT passer la réservation au statut « arrivé ». _Source : B08-D9_\n4. QUAND 20 minutes se sont écoulées depuis le début d'un créneau réservé sans pointage du camion, LE SYSTÈME DOIT passer la réservation au statut « perdu » et rendre le quai disponible pour le chef de quai. _Source : B08-D9_\n5. SI un camion est pointé sur une réservation au statut « perdu », ALORS LE SYSTÈME DOIT enregistrer son heure d'arrivée et le signaler au chef de quai, qui décide de la suite. _Source : B08-D9, B08-D11_\n6. QUAND un camion se présente sans réservation, LE SYSTÈME DOIT permettre au poste de garde de l'enregistrer comme « sans rendez-vous », avec son heure d'arrivée et, s'il est connu, son fournisseur ou son transporteur. _Source : B08-D8, B08-D12_\n\n### Exigence 8 : vue planning par site\n\n**User story :** En tant que chef de quai ou membre de l'approvisionnement, je veux voir le planning de chaque site par quai et par créneau, afin de connaître la charge du lendemain et de suivre la journée en cours.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT afficher, pour un site et un jour choisis, le planning par quai et par créneau avec le statut de chaque créneau : libre, réservé, bloqué, arrivé, à quai, déchargé ou perdu. _Source : B08-D16_\n2. LE SYSTÈME DOIT afficher, pour chaque réservation du planning, le fournisseur, le transporteur, les commandes d'achat et l'indication de camion complet. _Source : B08-D16, B08-D2, B08-D4_\n3. LE SYSTÈME DOIT permettre de consulter le planning de chacun des 10 jours à venir, avec le nombre de réservations et le taux de remplissage des créneaux du jour affiché. _Source : B08-D16, B08-D5_\n4. QUAND un utilisateur ouvre ou actualise la vue planning, LE SYSTÈME DOIT afficher l'état enregistré à cet instant, pointages et actions du chef de quai compris. _Source : B08-D16_\n5. QUAND le chef de quai enregistre la mise à quai puis la fin du déchargement d'un camion, LE SYSTÈME DOIT horodater chacune de ces deux étapes. _Source : B08-D13, B08-D14_\n6. LE SYSTÈME DOIT réserver la vue planning aux utilisateurs internes du site (chef de quai, poste de garde, bureau de réception) et à l'approvisionnement. _Source : B08-D16, CT-01_\n\n### Exigence 9 : indicateurs et export\n\n**User story :** En tant que responsable de l'approvisionnement, je veux suivre les arrivées sans rendez-vous, l'attente, l'occupation des quais et la ponctualité des fournisseurs, afin de mesurer l'effet du portail et de constituer un historique.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT calculer, par site et par jour, la part des camions sans rendez-vous, égale au nombre de camions enregistrés « sans rendez-vous » divisé par le nombre total de camions pointés. _Source : B08-D12_\n2. LE SYSTÈME DOIT calculer, par site, par jour et par demi-journée, l'attente moyenne des camions, égale à la moyenne des durées entre le pointage et la mise à quai. _Source : B08-D13_\n3. LE SYSTÈME DOIT calculer, par site et par jour, le taux d'occupation des quais, égal au nombre de créneaux-quais réservés divisé par le nombre de créneaux-quais ouverts, les créneaux bloqués étant comptés à part. _Source : B08-D14_\n4. LE SYSTÈME DOIT calculer, par fournisseur et sur une période choisie, la ponctualité, égale à la part des réservations pointées au plus tard 20 minutes après le début du créneau, les réservations perdues comptant comme non ponctuelles. _Source : B08-D15, B08-D9_\n5. LE SYSTÈME DOIT permettre d'exporter au format CSV les indicateurs des critères 9.1 à 9.4 pour un site et une période choisis. _Source : B08-D17_\n6. LE SYSTÈME DOIT conserver pendant au moins 12 mois, pour chaque réservation, l'heure prévue, l'heure de pointage, l'heure de mise à quai et le fournisseur. _Source : B08-D15, B08-D18, H23_\n7. LE SYSTÈME NE DOIT PAS calculer de note ni de pénalité des fournisseurs en V1. _Source : B08-D19, H23_\n\n### Exigence 10 : langues\n\n**User story :** En tant que fournisseur étranger sans interlocuteur francophone, je veux pouvoir utiliser le portail dans ma langue quand elle sera proposée, afin de réserver sans erreur.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT proposer en V1 les écrans du portail et les e-mails en français. _Source : H26_\n2. LE SYSTÈME DOIT stocker tous les textes des écrans externes et des e-mails hors du code, de sorte qu'une langue s'ajoute sans développement. _Source : B08-D21, CT-11, H26_\n3. OÙ plusieurs langues sont activées, LE SYSTÈME DOIT afficher le portail et envoyer les e-mails dans la langue choisie dans le compte de l'utilisateur externe. _Source : B08-D21, CT-11_\n\n### Exigence 11 : hébergement, données personnelles et données de test\n\n**User story :** En tant que DSI et DPO, je veux une solution hébergée dans l'Union européenne, qui collecte le minimum de données sur les contacts externes, afin de respecter les règles d'Orvanne.\n\n#### Critères d'acceptation\n\n1. LE SYSTÈME DOIT être hébergé dans l'Union européenne. _Source : CT-08_\n2. LE SYSTÈME DOIT limiter les données collectées sur un contact externe à son nom, son prénom, son adresse e-mail professionnelle, sa langue et son rattachement à un fournisseur ou à un transporteur. _Source : CT-01_\n3. LE SYSTÈME DOIT supprimer les comptes externes inactifs et leurs données de contact au terme d'une durée paramétrable, fixée avec la DPO. _Source : CT-01_\n4. LE SYSTÈME DOIT utiliser exclusivement des données synthétiques ou anonymisées dans les environnements de test et de démonstration. _Source : CT-04_\n\n## Hors périmètre\n\n- Notation des fournisseurs à partir de la ponctualité (`B08-D18`) : classée en V2 par l'atelier ; la V1 constitue l'historique nécessaire (critère 9.6, `H23`). Renvoyée vers la V2 de P06.\n- Pénalités des fournisseurs (`B08-D19`) : idée « à terme », non décidée, sans base contractuelle connue (`H23`, `Q24`). Aucun projet ne la reprend ; le critère 9.7 l'exclut explicitement de la V1.\n- Lien avec Hangar pour préremplir la réception attendue (`B08-D23`) : jugé « bien mais pas vital » et classé en V2. Renvoyé vers la V2 de P06.\n- Application mobile pour les chauffeurs (`B08-D24`) : classée en V2. Renvoyée vers la V2 de P06.\n- Prise de rendez-vous dans le portail pour les messageries et petits colis sans commande d'achat (`B08-D22`) : non arbitrée (conflit C23). En V1, R1 s'applique et le chef de quai bloque un quai sur une plage fixe (critère 6.4, `H22`). Leur prise en charge dans le portail reste à décider (`Q23`).\n- Chiffrage et planning (`B08-D29`) : livrable de la DSI attendu en décembre, pas une exigence du système. Le découpage de `tasks.md` sert de base à ce chiffrage.\n- Entrepôt E3 : non évoqué dans B08. Le paramétrage par site (exigence 2) permet de l'ajouter sans développement si la réponse à `Q38` l'inclut.\n\n## Hypothèses\n\n| Id | Hypothèse | Conflit | Réversible |\n|---|---|---|---|\n| H20 | La durée de créneau est un paramètre par site, ajouté aux paramètres de R4, avec 30 minutes par défaut (R2). Chaque site fixe sa valeur lors du paramétrage ; un camion complet consomme deux créneaux. | C21 | oui |\n| H21 | Le nombre de quais est saisi par site (R4) ; la valeur de E1 est celle que le chef de quai fournira pour le 04/12. | C22 | oui |\n| H22 | R1 s'applique en V1 : toute réservation exige une commande d'achat. Pour les messageries et petits colis sans commande, le chef de quai bloque un quai sur une plage fixe (R7). Leur prise en charge dans le portail est reportée. | C23 | oui |\n| H23 | La V1 enregistre les heures prévues et réelles d'arrivée, qui alimentent l'indicateur de ponctualité. La notation des fournisseurs est en V2 ; les pénalités restent hors périmètre tant qu'elles ne sont pas décidées. | C24 | oui |\n| H26 | Les textes du portail fournisseurs (écrans, e-mails) sont externalisés pour qu'une langue s'ajoute sans développement. La V1 est en français. | — | oui |\n\n## Questions ouvertes\n\n| Id | Question | Destinataire | Bloquante |\n|---|---|---|---|\n| Q21 | La durée de créneau peut-elle être fixée par site ? Quelle valeur pour E1 (30 minutes ou une heure) et pour E2 ? | Grégory Thibaudeau ; Rémi Vasseur ; Karim Benhaddou | non (valeur du paramètre 2.2 ; défaut 30 min) |\n| Q22 | E1 a 6 quais de réception aujourd'hui, le paramétrage cible en indique 4 : pourquoi cet écart ? | Rémi Vasseur | non (valeur saisie au critère 2.5) |\n| Q23 | Les messageries et petits colis sans commande d'achat entrent-ils dans le périmètre ? Un quai réservé sur une plage fixe suffit-il en V1 ? | Grégory Thibaudeau ; Rémi Vasseur | non (critères 6.3 et 6.4) |\n| Q24 | À partir de quand la ponctualité alimente-t-elle la notation des fournisseurs ? Les pénalités sont-elles envisagées, et sur quelle base contractuelle ? | Nadège Courtois ; Grégory Thibaudeau | non (V2 ; critère 9.7) |\n| Q27 | Dans quelles langues proposer le portail fournisseurs (anglais, allemand, espagnol) ? Pour quelle version ? | Grégory Thibaudeau | non (critère 10.3) |\n| Q34 | L'exigence d'hébergement dans le cloud d'Orvanne s'applique-t-elle à tous les projets, ou un hébergement dans l'UE chez un éditeur est-il admis ? | DSI (comité d'architecture) | non (critère 11.1) |\n| Q35 | La conformité RGAA s'applique-t-elle au portail fournisseurs ? | DSI (comité d'architecture) | non (critère 1.5, appliqué par prudence) |\n| Q36 | Quand la DPO peut-elle examiner le traitement des contacts fournisseurs et transporteurs (CT-01) ? Une analyse d'impact est-elle nécessaire ? | Hélène Marsac | non (critères 11.2 et 11.3 ; préalable au développement) |\n| Q38 | L'entrepôt E3 entre-t-il dans le périmètre de la prise de rendez-vous ? | Grégory Thibaudeau | non (paramétrage, exigence 2) |\n\n### Points sans hypothèse dans l'analyse, à remonter à l'analyste (étape 2)\n\nLes sources ne tranchent pas les points suivants et `work/analyse.json` ne leur associe ni hypothèse ni question. La spec retient le comportement le plus simple compatible avec B08 ; ces choix sont à valider avec l'approvisionnement.\n\n- Définition de « camion complet » (`B08-F6`) : déclarée par l'auteur de la réservation (critère 3.4).\n- Destinataire des e-mails quand le fournisseur réserve lui-même (`B08-F9`) : e-mail du transporteur obligatoire, copie à l'auteur (critères 3.9 et 5.4).\n- Suite d'un créneau perdu (`B08-F11`) : décision du chef de quai, qui peut forcer un nouveau créneau (critères 7.5 et 6.2).\n- Accès des fournisseurs et transporteurs au portail (`B08-F12`) : comptes nominatifs ouverts par Orvanne (critère 1.2).\n- Définitions des indicateurs (critères 9.1 à 9.4), en particulier le point de départ de l'attente (pointage) et le traitement des créneaux bloqués.\n- `CT-10` n'est pas rattachée à P06 dans l'analyse, alors que le forçage d'une réservation pour le compte d'un fournisseur en relève (critères 6.2 et 6.6).\n- Durée de conservation des données de contact externes : aucune valeur dans les sources (critère 11.3, à fixer avec la DPO via `Q36`).\n", "design.md": "# Conception : prise de rendez-vous de déchargement par les fournisseurs et transporteurs\n\n## Vue d'ensemble\n\nLa solution est une application unique avec deux faces :\n\n- le **portail fournisseurs**, ouvert aux contacts externes (fournisseurs et transporteurs), pour réserver, modifier et annuler des créneaux ;\n- le **back-office des sites**, réservé aux utilisateurs internes : paramétrage des sites, vue planning, actions du chef de quai, écran du poste de garde, indicateurs et export.\n\nLes deux faces s'appuient sur un même **service de réservation**, qui porte les règles R1 à R7, et sur une **copie locale des commandes d'achat** alimentée par Passerelle. Un **ordonnanceur** déclenche les rappels de la veille et le passage des créneaux non pointés au statut « perdu ». Un **service d'envoi d'e-mails** transactionnels envoie confirmations, rappels et avis de modification.\n\nChoix structurants :\n\n| Choix | Raison | Alternative écartée |\n|---|---|---|\n| Un seul service de réservation pour le portail et le back-office | Les règles R1 à R7 s'appliquent de la même façon, qu'un fournisseur ou un chef de quai agisse ; seul le forçage lève la capacité et le délai | Deux applications : risque de règles divergentes et de double réservation |\n| Capacité matérialisée par créneau et par quai, avec contrainte d'unicité en base | Garantit l'absence de double réservation, y compris pour un camion complet qui occupe deux créneaux consécutifs (critères 3.4, 3.7) | Compteur de places par créneau : verrouillage plus fragile, pas d'attribution de quai |\n| Durée de créneau, nombre de quais, horaires et jours fermés paramétrables par site | Les conflits C21 et C22 ne sont pas arbitrés (H20, H21) ; les valeurs relèvent de chaque site | Coder 30 minutes et 6 quais |\n| Copie locale des commandes d'achat, mise à jour par un flux Passerelle | La vérification R1 ne dépend pas de la disponibilité de Passerelle au moment de la réservation ; la disponibilité des commandes dans Passerelle reste à vérifier (B08-D27) | Appel synchrone à Passerelle à chaque réservation |\n| Comptes nominatifs ouverts par Orvanne, pas d'inscription libre | Pilote limité à une vingtaine de fournisseurs (B08-D28) ; cloisonnement des commandes d'achat par fournisseur | Inscription libre avec validation a posteriori |\n| Textes externalisés dans des fichiers de traduction dès la V1 | CT-11 et H26 : environ 15 % des livraisons viennent de fournisseurs étrangers (B08-N13) ; les langues ne sont pas décidées (Q27) | Textes en dur, traduction en V2 |\n| Pas de lien avec Hangar en V1 | Classé en V2 par l'atelier (B08-D23) ; le modèle de données garde les numéros de commande d'achat pour le permettre | Préremplissage de la réception dès la V1 |\n\nLes technologies citées ci-dessous sont des **propositions** : B08 n'en impose aucune.\n\n## Architecture\n\n```mermaid\nflowchart LR\n  subgraph Externes\n    F[Fournisseurs et transporteurs]\n    EM[Service d'envoi d'e-mails transactionnels]\n  end\n  subgraph Orvanne\n    P[Passerelle]\n    SSO[SSO interne]\n  end\n  F -- navigateur, smartphone --> PF[Portail fournisseurs]\n  PF --> RES[Service de réservation]\n  BO[Back-office des sites] --> RES\n  SSO --> BO\n  P -- commandes d'achat --> SYN[Synchronisation des commandes d'achat]\n  SYN --> CA[(Copie des commandes d'achat)]\n  RES --> CA\n  RES --> DB[(Base des réservations)]\n  ORD[Ordonnanceur] --> RES\n  RES -- événements --> NOT[Notification]\n  NOT --> EM\n  EM --> F\n  DB --> IND[Indicateurs et export]\n  IND --> BO\n  RES --> JRN[(Journal)]\n  SUP[Supervision DSI] -.-> SYN\n  SUP -.-> NOT\n```\n\nLes utilisateurs internes (chef de quai, poste de garde, bureau de réception, approvisionnement, achats) passent par le back-office ; les utilisateurs externes par le portail. Hangar n'est pas relié en V1.\n\n## Composants et interfaces\n\n| Composant | Responsabilité | Interfaces (entrée / sortie) | Exigences |\n|---|---|---|---|\n| Portail fournisseurs | Connexion, création, modification et annulation de réservation, consultation des réservations du périmètre ; écrans adaptés au smartphone et conformes au RGAA ; textes traduisibles | Application web (proposition : rendu serveur ou SPA légère, sans dépendance à une application mobile) ; appelle l'API du service de réservation | 1, 3, 4, 10 |\n| Back-office des sites | Paramétrage des sites, vue planning, actions du chef de quai, écran du poste de garde, indicateurs | Application web interne derrière le SSO ; rôles `chef-de-quai`, `poste-de-garde`, `bureau-reception`, `approvisionnement`, `achats`, `admin-site` | 2, 6, 7, 8, 9 |\n| Service de réservation | Génère les créneaux, applique R1 à R7, attribue le quai, gère les statuts, publie les événements | API REST interne ; écrit dans la base des réservations et le journal | 2.3, 2.4, 3, 4, 6, 7 |\n| Synchronisation des commandes d'achat | Reçoit les commandes d'achat (numéro, fournisseur, statut validé / soldé, site de livraison s'il est fourni) et met à jour la copie locale ; mesure la fraîcheur | Entrée : flux Passerelle (format et fréquence à fixer, tâche 1.2) ; sortie : table `CommandeAchat` | 3.2, 3.3, 6.3 |\n| Ordonnanceur | Toutes les minutes : passe au statut « perdu » les réservations non pointées 20 minutes après le début du créneau. Chaque jour : déclenche les rappels de la veille, la purge des comptes inactifs | Tâches planifiées, fuseau Europe/Paris | 5.2, 7.4, 11.3 |\n| Notification | Construit les e-mails à partir des modèles traduisibles, les envoie, réessaie, signale les échecs | Consomme les événements `RéservationCréée`, `RéservationModifiée`, `RéservationAnnulée`, `Rappel` ; appelle le service d'envoi (à choisir, tâche 1.6) | 5, 10.3 |\n| Indicateurs et export | Calcule les quatre indicateurs, produit les exports CSV | Lecture de la base des réservations ; calcul à la demande (volume faible) | 9 |\n| Journal | Trace les actions des utilisateurs internes et les connexions | Table append-only, consultable par l'approvisionnement et la DSI | 6.6 |\n\n### Règles du service de réservation\n\n- **Génération des créneaux (R2, R4, H20).** Pour un jour ouvert d'un site, les créneaux commencent à l'heure d'ouverture et se suivent par pas de la durée de créneau du site, tant que le créneau se termine avant l'heure de fermeture. Chaque créneau existe une fois par quai actif.\n- **Camion complet (R2).** La réservation occupe deux créneaux consécutifs du même quai. Le dernier créneau de la journée ne peut donc pas accueillir un camion complet.\n- **Attribution du quai.** Le service attribue le quai libre de plus petit numéro ; le chef de quai peut le changer (critère 6.1). C'est une **proposition** : B08 ne dit pas si les quais sont interchangeables.\n- **Fenêtre de réservation (R3).** Une réservation externe est acceptée si `maintenant ≥ J-10 à 00 h 00` et `maintenant < J-1 à 12 h 00`, heure de Paris. L'interprétation « J-10 à 00 h 00 » est une **proposition** à valider ; les bornes sont des paramètres.\n- **Forçage (R7).** Le forçage lève la contrainte de capacité et la fenêtre R3, jamais R1 (H22). Une réservation forcée sur un créneau sans quai libre est rattachée à un quai virtuel « en surnombre » visible dans le planning.\n- **Statuts d'une réservation.** `réservée` → `arrivée` → `à quai` → `déchargée` ; `réservée` → `perdue` (non pointée à T+20 min) ; `réservée` → `annulée`. Le pointage d'un camion sur une réservation `perdue` est enregistré sans changer le statut et crée une alerte pour le chef de quai (critère 7.5).\n\n## Flux principaux\n\n### Réservation par un utilisateur externe\n\n```mermaid\nsequenceDiagram\n  participant U as Fournisseur / transporteur\n  participant PF as Portail\n  participant R as Service de réservation\n  participant CA as Copie des commandes d'achat\n  participant N as Notification\n  U->>PF: site, jour, commandes d'achat, camion complet, e-mail du transporteur\n  PF->>R: demande de créneaux disponibles\n  R->>CA: commandes valides, non soldées, rattachées au compte ?\n  alt une commande refusée\n    R-->>PF: motif « inconnue ou non rattachée » ou « soldée »\n  else commandes acceptées\n    R->>R: contrôler la fenêtre J-10 / J-1 12 h\n    R-->>PF: créneaux avec un quai libre sur toute la durée\n    U->>PF: choix du créneau\n    PF->>R: réserver\n    R->>R: transaction : insérer les occupations (quai, date, début) ; échec si déjà prises\n    alt occupation déjà prise (course)\n      R-->>PF: créneau indisponible, autres créneaux proposés\n    else réservation enregistrée\n      R-->>PF: numéro de réservation, quai\n      R->>N: RéservationCréée\n      N->>U: e-mail de confirmation (transporteur, copie à l'auteur)\n    end\n  end\n```\n\n### Arrivée au poste de garde\n\n```mermaid\nsequenceDiagram\n  participant G as Poste de garde\n  participant BO as Back-office\n  participant R as Service de réservation\n  participant O as Ordonnanceur\n  participant CQ as Chef de quai\n  G->>BO: recherche par n° de réservation ou de commande d'achat\n  alt réservation trouvée, T ≤ début + 20 min\n    BO->>R: pointer (heure d'arrivée)\n    R->>R: statut « arrivée »\n  else réservation déjà « perdue »\n    BO->>R: pointer\n    R->>CQ: alerte « camion arrivé sur créneau perdu »\n    CQ->>R: forcer un nouveau créneau ou refuser\n  else aucune réservation\n    BO->>R: enregistrer « sans rendez-vous »\n  end\n  O->>R: chaque minute, réservations non pointées à début + 20 min → « perdue »\n  CQ->>R: mise à quai, puis fin du déchargement (horodatées)\n```\n\n## Modèle de données\n\n| Entité | Attributs principaux | Donnée personnelle | Durée de conservation |\n|---|---|---|---|\n| Site | code (E1, E2…), nom, adresse, fuseau, durée de créneau, ouvert à la réservation (oui / non), heure du rappel | non | durée de vie de l'application |\n| Quai | site, numéro, actif | non | durée de vie de l'application |\n| HoraireSite | site, jour de la semaine, heure d'ouverture, heure de fermeture | non | durée de vie de l'application |\n| JourFermé | site, date, motif | non | 2 ans (proposition) |\n| Fournisseur | code fournisseur Orvanne, raison sociale, pilote (oui / non) | non (personne morale) | durée de vie de l'application |\n| Transporteur | raison sociale, rattachement à un ou plusieurs fournisseurs | non (personne morale) | durée de vie de l'application |\n| CompteExterne | nom, prénom, e-mail professionnel, langue, rattachement (fournisseur ou transporteur), date de dernière connexion | **oui** | jusqu'à la suppression du compte, puis purge après la durée d'inactivité fixée avec la DPO (critère 11.3) |\n| CommandeAchat (copie) | numéro, code fournisseur, statut (valide, soldée), site de livraison s'il est transmis, date de mise à jour | non | tant que la commande est ouverte, puis 12 mois |\n| Réservation | numéro, site, quai, date, heure de début, nombre de créneaux, camion complet, commandes d'achat, e-mail du transporteur, auteur, statut, forcée (oui / non), heures de pointage, de mise à quai, de fin de déchargement | **oui** (e-mail du transporteur s'il est nominatif, auteur) | 12 mois au moins pour les heures (H23) ; e-mail et auteur pseudonymisés au-delà de la durée fixée avec la DPO |\n| Occupation | site, quai, date, heure de début, réservation ou blocage ; contrainte d'unicité (site, quai, date, heure de début) hors surnombre | non | comme la réservation |\n| Blocage | site, quai ou tous les quais, plage horaire, récurrence, motif, auteur | oui (identifiant de l'employé) | 12 mois (proposition) |\n| ArrivéeSansRendezVous | site, heure d'arrivée, fournisseur ou transporteur s'il est connu | non | 12 mois (H23) |\n| E-mailEnvoyé | réservation, type, destinataires, langue, statut, nombre de tentatives | oui (adresses) | 6 mois (proposition, à confirmer avec la DPO) |\n| Journal | utilisateur, action, objet, valeurs avant / après, motif, horodatage | oui (identifiant de l'employé) | 1 an (proposition, à confirmer avec la DPO) |\n\nAucune donnée sur les chauffeurs (nom, téléphone, immatriculation) n'est collectée en V1 : le pointage se fait par numéro de réservation ou de commande d'achat.\n\n## Gestion des erreurs\n\n| Situation | Comportement | Exigence |\n|---|---|---|\n| Commande d'achat inconnue ou rattachée à un autre fournisseur | Refus avec le motif unique « inconnue ou non rattachée à votre compte », pour ne pas révéler l'existence d'une commande d'un autre fournisseur | 3.3, 1.4 |\n| Commande d'achat soldée | Refus avec le motif « soldée » | 3.3 |\n| Copie des commandes d'achat non mise à jour depuis plus que le délai paramétré (proposition : 24 h) | Alerte à la supervision de la DSI ; les réservations restent possibles sur la dernière copie connue, avec un bandeau dans le back-office | 3.2 |\n| Commande d'achat soldée après la réservation | Réservation conservée, signalée dans la vue planning au chef de quai | 3.2, 8.2 |\n| Deux réservations simultanées sur le dernier quai libre | La contrainte d'unicité fait échouer la seconde transaction ; le portail propose d'autres créneaux | 3.7 |\n| Camion complet demandé sur le dernier créneau de la journée | Créneau non proposé | 3.4, 3.6 |\n| Modification ou annulation externe après J-1 12 h | Refus, avec les coordonnées du site | 4.2 |\n| Modification du paramétrage incompatible avec des réservations | Refus, avec la liste des réservations concernées | 2.4 |\n| Blocage d'un créneau réservé | Refus tant que la réservation n'est pas déplacée ou annulée | 6.5 |\n| Échec d'envoi d'un e-mail | 3 tentatives avec délai croissant (valeur par défaut d'un paramètre, proposition), puis signalement sur la réservation dans la vue planning | 5.6 |\n| Ordonnanceur arrêté ou en retard | Au redémarrage, rattrapage de toutes les réservations dont le début + 20 min est dépassé ; le pointage reste possible et fait foi de l'heure d'arrivée | 7.3, 7.4 |\n| Panne réseau au poste de garde | Liste du jour imprimable dès l'ouverture du site (proposition) ; saisie a posteriori de l'heure d'arrivée par le chef de quai, journalisée | 7.2, 6.6 |\n| Changement d'heure (été / hiver) | Créneaux calculés en heure locale de Paris ; tests aux deux dates de changement | 2.3, 3.5 |\n| Camion pointé sur une réservation perdue | Heure enregistrée, statut inchangé, alerte au chef de quai | 7.5 |\n\n## Sécurité et RGPD\n\n- **Avant le développement (CT-01) :** le traitement des contacts fournisseurs et transporteurs est soumis à la DPO (`Q36`). Points à faire valider :\n  - la base légale (exécution des relations contractuelles avec les fournisseurs, à confirmer) ;\n  - la durée d'inactivité avant suppression d'un compte (critère 11.3) ;\n  - la durée de conservation des e-mails envoyés et du journal ;\n  - le recensement du traitement dans le registre (dépendance avec P05).\n- **Minimisation :** seuls le nom, le prénom, l'e-mail professionnel et la langue des contacts externes sont collectés (critère 11.2). Aucune donnée sur les chauffeurs.\n- **Authentification externe (proposition) :** comptes nominatifs créés par l'approvisionnement, activation par lien à usage unique, mot de passe et second facteur par code envoyé par e-mail, verrouillage temporaire après plusieurs échecs. Les comptes partagés entre plusieurs personnes ne sont pas autorisés.\n- **Cloisonnement :** chaque requête du portail est filtrée par les fournisseurs rattachés au compte (critère 1.4). Les messages d'erreur ne révèlent pas l'existence d'une commande d'achat d'un autre fournisseur, et le nombre de vérifications de commande par compte et par heure est limité (proposition) pour empêcher l'énumération des numéros.\n- **Accès internes :** SSO interne, rôles par site (critères 6.7 et 8.6). Le forçage, le déplacement, le blocage et l'annulation par un utilisateur interne sont journalisés (critère 6.6, `CT-10`).\n- **Contenu des e-mails :** modèles de service uniquement, sans offre commerciale (`CT-03`, critère 5.5) ; relecture du texte des modèles lors de la recette.\n- **Accessibilité :** le portail vise la conformité RGAA et l'usage sur smartphone (`CT-09`), en attendant la réponse à `Q35`.\n- **Hébergement :** Union européenne (`CT-08`, critère 11.1). Le choix entre le cloud d'Orvanne et un hébergeur de l'UE attend la réponse à `Q34`.\n- **Données de test :** jeux synthétiques uniquement (`CT-04`, critère 11.4), y compris pour la recette avec les fournisseurs pilotes.\n- **Mise en production :** aucune entre le 16 novembre et le 11 janvier (`CT-07`).\n\n## Volumétrie et performance\n\n| Grandeur | Valeur | Base |\n|---|---|---|\n| Camions reçus par jour sur E1 | ≈ 70 | B08-N1 |\n| Camions reçus par jour sur E2 | ≈ 40 | B08-N3 |\n| Quais de réception de E1 | 6 aujourd'hui, 4 dans le paramétrage cible | B08-N2, B08-N16 |\n| Camions sans rendez-vous ou hors créneau | 1 sur 4, soit ≈ 18 par jour sur E1 | B08-N4 (calcul sur B08-N1) |\n| Fournisseurs pilotes | une vingtaine | B08-N15 |\n| Part des livraisons par des fournisseurs étrangers | ≈ 15 % | B08-N13 |\n| Réservations par jour, E1 et E2 ouverts | ≈ 110 au plus | estimation (B08-N1 + B08-N3) |\n| E-mails par jour (confirmation, rappel, copie, modifications) | < 500 | estimation : 110 réservations × 2 à 4 e-mails |\n| Utilisateurs simultanés | quelques dizaines | estimation |\n\nCes volumes sont très faibles ; une base relationnelle (proposition : PostgreSQL) et une seule instance applicative avec redémarrage automatique suffisent. Le seul point sensible est la concurrence sur les derniers créneaux libres, traitée par la contrainte d'unicité.\n\n**Capacité de E1 (estimation à porter à l'arbitrage de C21 et C22).** Avec le paramétrage cible de 4 quais et des créneaux d'une heure, absorber 70 camions par jour demande au moins 70 créneaux-quais, soit 17 h 30 d'ouverture, et davantage pour les camions complets qui consomment deux heures. Avec 6 quais et des créneaux de 30 minutes, 70 camions d'un créneau demandent environ 5 h 50 d'ouverture, et 11 h 40 s'ils sont tous complets. Les horaires d'ouverture de E1 ne sont pas connus ; le paramétrage du 04/12 doit être vérifié contre ce calcul avant le pilote.\n\n**Pilote partiel.** Pendant le pilote, seuls une vingtaine de fournisseurs réservent sur le portail. Les autres continuent d'appeler. Pour que le planning de E1 reste la seule référence, le bureau de réception ou le chef de quai saisit ces rendez-vous par forçage (critère 6.2), ou bien le site bloque une part des quais pour eux (critère 6.4). Le mode retenu est à décider avec le chef de quai E1 avant le pilote.\n\n## Stratégie de test\n\n| Niveau | Contenu | Exigences |\n|---|---|---|\n| Unitaire | Génération des créneaux (durée 30 min et 1 h, jours fermés, dernier créneau, changement d'heure) ; fenêtre R3 aux bornes (J-10, J-1 11 h 59, J-1 12 h 00) ; camion complet ; forçage sans levée de R1 ; statuts à début + 20 min (19 min 59 s, 20 min 00 s, 20 min 01 s) ; calcul des quatre indicateurs sur un jeu connu | 2.2, 2.3, 3.4, 3.5, 6.2, 6.3, 7.3, 7.4, 9.1 à 9.4 |\n| Concurrence | 50 réservations simultanées sur le dernier quai libre : une seule acceptée, aucune occupation en double | 3.7, 3.8 |\n| Intégration | Flux Passerelle des commandes d'achat en recette (création, solde, fournisseur) ; envoi d'e-mails via le service choisi, échec simulé | 3.2, 3.3, 5.1 à 5.6 |\n| Sécurité | Cloisonnement entre deux fournisseurs ; message d'erreur identique pour une commande inconnue et une commande d'un autre fournisseur ; rôles internes | 1.2, 1.4, 6.7, 8.6 |\n| Accessibilité et mobile | Audit RGAA du portail ; parcours de réservation complet sur smartphone | 1.5 |\n| Langues | Pseudo-langue générée automatiquement : aucun texte en dur dans les écrans et les e-mails | 10.1, 10.2, 10.3 |\n| Recette métier | Journée de E1 rejouée sur données synthétiques (≈ 70 camions, 1 sur 4 sans rendez-vous) avec le chef de quai et le poste de garde ; parcours de réservation avec 2 ou 3 fournisseurs pilotes sur un environnement de recette | 2, 3, 4, 6, 7, 8 |\n| Données | Jeux synthétiques uniquement (CT-04) | 11.4 |\n", "tasks.md": "# Plan d'implémentation : prise de rendez-vous de déchargement par les fournisseurs et transporteurs\n\nToutes les tâches relèvent de la **V1** (pilote sur E1 au printemps). Jalons des sources : vérification des commandes d'achat dans Passerelle et liste des fournisseurs pilotes pour le 27/11, paramétrage cible de E1 pour le 04/12, chiffrage et planning de la DSI en décembre. Aucune mise en production entre le 16 novembre et le 11 janvier (CT-07) : les tâches 1 à 3 peuvent avancer pendant le gel, la mise en service (tâche 11) a lieu au printemps. La V2 (notation des fournisseurs, lien avec Hangar, application chauffeurs) n'est pas planifiée ici.\n\n- [ ] 1. Prérequis et cadrage (aucune dépendance)\n  - [ ] 1.1 Soumettre le traitement des contacts fournisseurs et transporteurs à la DPO : base légale, données collectées, durée d'inactivité avant suppression des comptes, conservation des e-mails et du journal, inscription au registre (Q36)\n    - Livrable : avis écrit de la DPO, versé au dossier du projet\n    - _Exigences : 11.2, 11.3_\n  - [ ] 1.2 Vérifier avec l'équipe Passerelle la disponibilité des commandes d'achat (numéro, fournisseur, validité, solde, site de livraison), leur format et leur fréquence de mise à jour, pour le 27/11 (B08-D27)\n    - Livrable : contrat d'interface du flux des commandes d'achat\n    - _Exigences : 3.2, 3.3_\n  - [ ] 1.3 Recevoir des achats la liste des fournisseurs pilotes (une vingtaine) et de leurs transporteurs, avec un contact par entreprise, pour le 27/11\n    - Livrable : fichier de comptes à créer, sans donnée saisie dans les environnements de test\n    - _Exigences : 1.3_\n  - [ ] 1.4 Recueillir le paramétrage de E1 auprès du chef de quai pour le 04/12 (quais, horaires, jours fermés, durée de créneau) et les réponses à Q21 et Q22 ; vérifier la capacité contre les 70 camions par jour (calcul de design.md)\n    - Livrable : fiche de paramétrage de E1 validée par l'approvisionnement\n    - _Exigences : 2.5_\n  - [ ] 1.5 Constituer un jeu de données synthétique : 2 sites, 30 fournisseurs fictifs, 300 commandes d'achat (valides, soldées), une journée de 70 camions dont 1 sur 4 sans rendez-vous (CT-04)\n    - _Exigences : 11.4_\n  - [ ] 1.6 Choisir l'hébergement (UE, réponse à Q34) et le service d'envoi d'e-mails transactionnels\n    - Livrable : note de choix d'architecture\n    - _Exigences : 11.1, 5.1_\n\n- [ ] 2. Socle applicatif (dépend de 1.1 et 1.6)\n  - [ ] 2.1 Créer le schéma de données : Site, Quai, HoraireSite, JourFermé, Fournisseur, Transporteur, CompteExterne, CommandeAchat, Réservation, Occupation (contrainte d'unicité site, quai, date, heure de début), Blocage, ArrivéeSansRendezVous, E-mailEnvoyé, Journal\n    - _Exigences : 2.1, 3.7, 3.8, 11.2_\n  - [ ] 2.2 Mettre en place l'authentification des comptes externes : création par l'approvisionnement, activation par lien à usage unique, second facteur, verrouillage\n    - _Exigences : 1.2_\n  - [ ] 2.3 Implémenter le cloisonnement par fournisseur sur toutes les requêtes du portail et la limitation des vérifications de commande par compte\n    - _Exigences : 1.4_\n  - [ ] 2.4 Brancher le back-office sur le SSO interne et définir les rôles par site (`chef-de-quai`, `poste-de-garde`, `bureau-reception`, `approvisionnement`, `achats`, `admin-site`)\n    - _Exigences : 6.7, 8.6_\n  - [ ] 2.5 Mettre en place le mécanisme de traduction : textes des écrans et des modèles d'e-mail dans des fichiers par langue, français seul activé, choix de la langue dans le compte externe\n    - _Exigences : 10.1, 10.2, 10.3_\n  - [ ] 2.6 Créer le journal append-only des actions internes et des connexions\n    - _Exigences : 6.6_\n  - [ ] 2.7 Écrire les tests de sécurité du socle : cloisonnement entre deux fournisseurs, rôles internes, comptes partagés refusés\n    - _Exigences : 1.2, 1.4, 6.7, 8.6_\n\n- [ ] 3. Paramétrage des sites et génération des créneaux (dépend de 2.1)\n  - [ ] 3.1 Développer les écrans de paramétrage d'un site : quais actifs, horaires par jour de la semaine, jours fermés, durée de créneau (30 minutes par défaut)\n    - _Exigences : 2.1, 2.2_\n  - [ ] 3.2 Générer les créneaux d'un jour ouvert à partir des horaires et de la durée, un par quai actif, en heure de Paris\n    - _Exigences : 2.3_\n  - [ ] 3.3 Refuser une modification de paramétrage incompatible avec des réservations existantes et lister ces réservations\n    - _Exigences : 2.4_\n  - [ ] 3.4 Ajouter l'ouverture et la fermeture de la réservation par site\n    - _Exigences : 2.6_\n  - [ ] 3.5 Charger le paramétrage de E1 issu de la tâche 1.4, sans développement spécifique\n    - _Exigences : 2.5_\n  - [ ] 3.6 Écrire les tests de génération : créneaux de 30 minutes et d'une heure, jours fermés, dernier créneau, changement d'heure, modification incompatible\n    - _Exigences : 2.1, 2.2, 2.3, 2.4_\n\n- [ ] 4. Copie des commandes d'achat (dépend de 1.2 et 2.1)\n  - [ ] 4.1 Développer la synchronisation des commandes d'achat depuis Passerelle selon le contrat de la tâche 1.2\n    - _Exigences : 3.2_\n  - [ ] 4.2 Superviser la fraîcheur de la copie : alerte à la DSI au-delà du délai paramétré, bandeau dans le back-office\n    - _Exigences : 3.2_\n  - [ ] 4.3 Écrire les tests d'intégration : création, solde, changement de fournisseur, flux interrompu\n    - _Exigences : 3.2, 3.3_\n\n- [ ] 5. Réservation sur le portail (dépend de 2.3, 3.2 et 4.1)\n  - [ ] 5.1 Développer le parcours de réservation : choix du site et du jour, saisie d'une ou plusieurs commandes d'achat, camion complet, e-mail du transporteur, choix du créneau\n    - _Exigences : 1.1, 3.1, 3.9_\n  - [ ] 5.2 Contrôler les commandes d'achat (valides, non soldées, rattachées au compte) avec les deux motifs de refus\n    - _Exigences : 3.2, 3.3_\n  - [ ] 5.3 Contrôler la fenêtre J-10 à J-1 12 h 00 et ne proposer que les créneaux ayant un quai libre sur toute la durée, deux créneaux consécutifs du même quai pour un camion complet\n    - _Exigences : 3.4, 3.5, 3.6_\n  - [ ] 5.4 Enregistrer la réservation dans une transaction (occupations, numéro unique, quai attribué) et gérer l'échec en cas de course\n    - _Exigences : 3.7, 3.8_\n  - [ ] 5.5 Développer la modification et l'annulation jusqu'à J-1 12 h 00, avec nouveau contrôle et libération des créneaux, et le refus au-delà avec les coordonnées du site\n    - _Exigences : 4.1, 4.2, 4.3, 4.4_\n  - [ ] 5.6 Rendre le portail utilisable sur smartphone et conforme au RGAA (structure, contrastes, navigation au clavier, libellés)\n    - _Exigences : 1.5_\n  - [ ] 5.7 Écrire les tests unitaires et de concurrence : bornes de R3, camion complet sur le dernier créneau, 50 réservations simultanées sur le dernier quai libre, modification après J-1 12 h 00\n    - _Exigences : 3.4, 3.5, 3.6, 3.7, 3.8, 4.1, 4.2, 4.3, 4.4_\n\n- [ ] 6. Notifications par e-mail (dépend de 2.5 et 5.4)\n  - [ ] 6.1 Envoyer la confirmation au transporteur à l'enregistrement, avec la tolérance de 20 minutes\n    - _Exigences : 5.1_\n  - [ ] 6.2 Planifier le rappel de la veille à l'heure paramétrée du site, postérieure à 12 h 00\n    - _Exigences : 5.2_\n  - [ ] 6.3 Envoyer les avis de modification, de déplacement et d'annulation, et la copie à l'auteur quand il n'est pas le transporteur\n    - _Exigences : 5.3, 5.4_\n  - [ ] 6.4 Rédiger les modèles d'e-mail de service, sans contenu commercial, et les faire relire par l'approvisionnement\n    - _Exigences : 5.5_\n  - [ ] 6.5 Gérer les échecs d'envoi : 3 tentatives, puis signalement sur la réservation dans la vue planning\n    - _Exigences : 5.6_\n  - [ ] 6.6 Écrire les tests des notifications : chaque type d'e-mail, destinataires, langue, échec simulé\n    - _Exigences : 5.1, 5.2, 5.3, 5.4, 5.6, 10.3_\n\n- [ ] 7. Actions du chef de quai (dépend de 2.4, 2.6 et 5.4)\n  - [ ] 7.1 Développer le déplacement d'une réservation vers un autre créneau ou un autre quai, y compris après J-1 12 h 00\n    - _Exigences : 6.1_\n  - [ ] 7.2 Développer le forçage pour le compte d'un fournisseur (créneau sans quai libre, hors fenêtre R3), avec contrôle maintenu de la commande d'achat et affichage en surnombre\n    - _Exigences : 6.2, 6.3_\n  - [ ] 7.3 Développer le blocage ponctuel ou récurrent d'un créneau ou d'un quai avec motif, et le refus sur un créneau réservé\n    - _Exigences : 6.4, 6.5_\n  - [ ] 7.4 Journaliser les for
